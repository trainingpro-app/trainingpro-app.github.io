<style>
:root{
  --bg:#F1F3F1; --surface:#FFFFFF; --surface-2:#E7EBE8; --ink:#0D110E; --ink-2:#4A544D; --ink-3:#7A847D; --line:#D3D9D4;
  --accent:#00963E; --accent-soft:#DCF1E3; --accent-ink:#FFFFFF;
  --match:#0D110E; --match-ink:#FFFFFF; --match-soft:#E4E6E4;
  --gym:#2F55C9; --gym-soft:#E1E7FA; --cancha:#C46A12; --cancha-soft:#F8E9D6;
  --good:#1D8A47; --warn:#B87A06; --bad:#C0352B; --good-soft:#DCF1E3; --warn-soft:#F8EBCB; --bad-soft:#F7DDDA;
  --side:#0B0D0C; --side-ink:#ECEFEC; --side-ink-2:#8E9891; --side-hover:#1A1F1C; --side-line:#232925;
  --shadow:0 12px 40px rgba(13,17,14,.18);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0A0C0B; --surface:#141816; --surface-2:#1C211E; --ink:#ECEFEC; --ink-2:#A6B0A9; --ink-3:#727C75; --line:#28302B;
    --accent:#1FB65C; --accent-soft:#11301D; --accent-ink:#04140A;
    --match:#ECEFEC; --match-ink:#0A0C0B; --match-soft:#232825;
    --gym:#7E98F2; --gym-soft:#1C2444; --cancha:#E39A4C; --cancha-soft:#352512;
    --good:#3CC775; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#11301D; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --side:#050605; --side-hover:#141816; --side-line:#1C211E; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#0A0C0B; --surface:#141816; --surface-2:#1C211E; --ink:#ECEFEC; --ink-2:#A6B0A9; --ink-3:#727C75; --line:#28302B;
    --accent:#1FB65C; --accent-soft:#11301D; --accent-ink:#04140A;
    --match:#ECEFEC; --match-ink:#0A0C0B; --match-soft:#232825;
    --gym:#7E98F2; --gym-soft:#1C2444; --cancha:#E39A4C; --cancha-soft:#352512;
    --good:#3CC775; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#11301D; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --side:#050605; --side-hover:#141816; --side-line:#1C211E; --shadow:0 12px 40px rgba(0,0,0,.5);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}

/* ---------- sidebar ---------- */
.side{width:264px;flex:0 0 264px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin-left .22s ease}
.app.side-off .side{margin-left:-264px}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--side-line)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.tp-row{display:flex;align-items:center;gap:8px;color:var(--side-ink);margin-bottom:12px}
.tp-row .kb{width:22px;height:22px;--kb-cut:var(--side)}
.tp-name{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-ink-2)}
.tp-name b{color:var(--side-ink);font-weight:800}
.esp{display:flex;align-items:center;gap:12px;background:var(--side-hover);border:1px solid var(--side-line);border-radius:10px;padding:10px 12px}
.esp .brand{font-size:28px}
.crest{width:44px;height:auto;flex:0 0 44px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.08))}
.theme-btn{display:flex;align-items:center;justify-content:center;gap:8px;border-style:solid}
.brand-sub{font-size:12px;color:var(--side-ink-2);margin-top:4px}
.grp{padding:10px 10px 4px}
.grp-t{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);padding:6px 8px}
.cat-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--side-ink)}
.cat-btn:hover{background:var(--side-hover)}
.cat-btn.on{background:var(--accent);color:var(--accent-ink)}
.cat-btn .nm{flex:1;font-weight:500}
.inj-dot{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px}
.cat-btn.on .inj-dot{background:rgba(0,0,0,.28)}
.side-foot{margin-top:auto;padding:12px 18px 18px;border-top:1px solid var(--side-line);display:grid;gap:8px}
.side-foot input{background:var(--side-hover);border:1px solid var(--side-line);border-radius:6px;padding:7px 9px;width:100%}
.side-foot .row{display:flex;gap:6px}
.side-foot select{background:var(--side-hover);border:1px solid var(--side-line);border-radius:6px;padding:7px 6px}
.btn-side{background:transparent;border:1px dashed var(--side-ink-2);color:var(--side-ink);border-radius:6px;padding:7px 10px;white-space:nowrap}
.ver{font-size:10.5px;color:var(--side-ink-2);font-family:var(--f-mono)}
.status{font-size:11.5px;color:var(--side-ink-2);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.status.ok i{background:var(--good)}
.scrim{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding-inline:24px;padding-block:18px 60px}
.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.burger{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px}
.burger span{display:block;width:18px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
.cat-title{flex:1;min-width:200px}
.eyebrow{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-size:13px}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(32px,5vw,48px);line-height:.95;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:118px}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.view{margin-top:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;letter-spacing:.02em}
h3{font-family:var(--f-disp);font-weight:700;font-size:18px;text-transform:uppercase;margin:0 0 8px;letter-spacing:.04em}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-disp);font-size:20px;text-transform:uppercase;color:var(--ink);margin-bottom:4px;letter-spacing:.03em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.gym{background:var(--gym-soft);color:var(--gym)}
.chip.cancha{background:var(--cancha-soft);color:var(--cancha)}
.chip.match{background:var(--match);color:var(--match-ink)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-month{font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;min-width:190px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;min-width:660px}
.dow{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--ink-3);padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;background:none;border-top:0;border-left:0;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch;cursor:pointer}
.day:hover{background:var(--surface-2)}
.day.out{opacity:.38}
.day .n{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.day.today .n span:first-child{background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px}
.day .att{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
th button.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.bar-pct{display:inline-block;width:70px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar-pct i{display:block;height:100%}
.delta-up{color:var(--good)} .delta-down{color:var(--bad)}

/* attendance */
.att-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.P{background:var(--good);color:#fff}
.seg button.on.A{background:var(--bad);color:#fff}
.seg button.on.J{background:var(--warn);color:#fff}
.seg button.on.L{background:var(--ink-2);color:var(--surface)}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.date-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px}
.date-chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}

/* matches */
.match-list{display:grid;gap:8px}
.match{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.match .when{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;line-height:1.05}
.match .when .d{font-size:26px}
.match .when .m{font-size:13px;color:var(--ink-3);letter-spacing:.08em}
.match .vs{font-weight:600;font-size:15px}
.score{font-family:var(--f-disp);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.res{font-family:var(--f-disp);font-weight:800;font-size:14px;width:26px;height:26px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;margin-left:8px;vertical-align:4px}
.res.G{background:var(--good)} .res.E{background:var(--warn)} .res.P{background:var(--bad)}

/* testeos */
.ex-chips{display:flex;gap:6px;flex-wrap:wrap}
.ex-chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13px}
.ex-chip small{color:var(--ink-3);font-weight:500;margin-left:4px}
.ex-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-chip.on small{color:inherit;opacity:.7}
.spark{display:block}

/* injuries */
.inj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.inj{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:6px;text-align:left}
.inj.readapt{border-left-color:var(--warn)}
.inj .who{font-weight:700;font-size:15px}
.inj .days{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1}
.inj .days small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pl .dor{font-family:var(--f-disp);font-weight:800;font-size:22px;width:34px;text-align:center;color:var(--ink-3)}
.pl .nm{font-weight:600}
.pl .info{flex:1;min-width:0}

/* forms / modal */
.field{display:grid;gap:4px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.field textarea{min-height:74px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.modal-wrap{position:fixed;inset:0;background:rgba(10,14,12,.5);display:flex;justify-content:flex-end;z-index:50}
.modal{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-h{position:sticky;top:0;background:var(--surface);padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;z-index:2}
.modal-h .t{flex:1}
.modal-b{padding:16px 20px;display:grid;gap:14px}
.modal-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
.modal-f .grow{flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-3);padding:2px 6px}
.stype{display:flex;gap:6px}
.stype button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:center;align-items:center;gap:8px}
.stype button.on.gym{border-color:var(--gym);color:var(--gym);background:var(--gym-soft)}
.stype button.on.cancha{border-color:var(--cancha);color:var(--cancha);background:var(--cancha-soft)}
.stype .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plan{background:transparent;border:1.5px dashed currentColor;padding:0 5px}
.chip.susp{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.rut-note{background:var(--surface-2);border-left:3px solid var(--ink-3);border-radius:6px;padding:10px 12px;font-size:13px;display:grid;gap:8px}
.rut-acts{display:flex;gap:6px;flex-wrap:wrap}
.rut-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

.rut-daylist{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2)}

.ex-drag:hover,.ex-drag:focus-visible{color:var(--ink);background:var(--surface-2)}
.exr.dragging{box-shadow:var(--shadow);border-color:var(--accent);opacity:.92;z-index:5;position:relative}

.exr .ex-c{grid-area:c;width:100%}

.exr .ex-lrow{grid-area:l;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exr .ex-o{flex:2 1 220px;font-size:12.5px;font-style:italic;text-transform:lowercase}
.exr .ex-o::placeholder{text-transform:none}
.exr .ex-l{flex:1 1 180px}
.exr .ex-l{flex:1;font-size:12.5px}
.ex-dist{border:1px dashed var(--ink-3);background:none;border-radius:6px;min-width:28px;height:31px;font-weight:700;color:var(--ink-2);padding:0 6px;font-size:12px}
.ex-dist.on{border-style:solid;border-color:var(--accent);color:var(--accent)}
.ex-by{font-weight:700;color:var(--ink-3);margin-right:2px}
.ex-head2{display:grid;grid-template-columns:minmax(0,1fr) 56px auto 88px 28px;gap:6px;padding:0 9px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ex-head2 span:nth-child(3){min-width:120px}
.ex-lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vmini{position:fixed;right:16px;bottom:16px;z-index:300;width:min(420px,calc(100vw - 32px));background:#000;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column}

.dnav{display:flex;align-items:center;gap:8px;margin:-4px 0 2px}

.dnav-b{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:20px;padding:7px 14px;font-weight:700;font-size:17px;line-height:1;cursor:pointer;white-space:nowrap;min-height:38px}

.f-blk-o{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:2px 6px}
.cb-list{max-height:none!important;overflow:visible!important;padding:0!important;min-width:min(330px,calc(100vw - 40px))}
.cb-head{padding:8px 10px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line);line-height:1.35}
.cb-head b{color:var(--ink)}
.cb-chips{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.cb-list .cb-chip{display:inline-block;width:auto;min-height:0;border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:700;text-transform:none;color:var(--ink-2);background:var(--surface)}

.cb-list [data-cbv] span{display:grid;line-height:1.2}

.cb-th{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff;font-style:normal;font-size:10px;font-weight:800;overflow:hidden}
.cb-th img{width:100%;height:100%;object-fit:cover}
.rol-b{font-style:normal;font-size:10.5px;font-weight:800;color:#fff!important;background:var(--rc)!important;border-radius:4px;padding:1px 6px}
.rol-b.auto{opacity:.55}
.ej-tags.auto i{font-style:italic;opacity:.8}
.ej-chip.rc.on{background:var(--rc);border-color:var(--rc);color:#fff}
.ej-ini{background:color-mix(in srgb,var(--rc,#9aa39d) 18%,var(--surface))!important;color:var(--rc,#9aa39d)!important}
/* biblioteca de ejercicios */
.ej-filt{display:grid;gap:8px;margin-bottom:12px}
.ej-q{max-width:420px;width:100%}
.ej-chips{display:flex;flex-wrap:wrap;gap:6px}
.ej-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
.ej-chip small{font-family:var(--f-mono);font-size:10px;opacity:.7}
.ej-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ej-sels{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ej-sels select{width:auto;min-width:160px;flex:0 1 220px}
.ej-auto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.ej-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ej-card{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;min-width:0;color:var(--ink);font:inherit}

.ej-vb{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-style:normal;font-size:10px;border-radius:4px;padding:1px 5px}

.ej-th.sm.ej-ini{font-size:16px}

.ej-ficha{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}

.vmini-media{position:relative;background:#000}
.vmini video{width:100%;aspect-ratio:16/9;display:block;background:#000;object-fit:contain}
.vmini.vert video{aspect-ratio:auto;height:min(62vh,520px,calc((100vw - 32px) * 16 / 9));width:calc(min(62vh,520px,calc((100vw - 32px) * 16 / 9)) * 9 / 16)}
.vmini.big.vert video{height:min(calc(100vh - 110px),calc((100vw - 24px) * 16 / 9));width:calc(min(calc(100vh - 110px),calc((100vw - 24px) * 16 / 9)) * 9 / 16)}
.vmini-tap{position:absolute;inset:0;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.vmini-ico{font-size:30px;color:#fff;background:rgba(0,0,0,.45);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none}
.vmini-ico.show{animation:vflash .7s ease-out}
.vmini.paused .vmini-ico{opacity:1;animation:none}
@keyframes vflash{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.vmini-err{color:#ddd;padding:28px 18px;font-size:14px;text-align:center;min-width:240px}
.vmini-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#111;color:#eee;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.vmini-bar span{flex:1}
.vmini-bar button,.vmini-bar a{background:none;border:0;color:#eee;font-size:15px;width:30px;height:28px;border-radius:6px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
.vmini-bar button:hover,.vmini-bar a:hover{background:#2a2a2a}
.has-th{display:inline-flex!important;align-items:center;gap:6px;padding:2px 8px 2px 2px!important}
.vid-th{width:56px;height:32px;object-fit:cover;border-radius:4px;display:block;background:#000}
.vid{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:2px 8px;cursor:pointer}
.blk-foot{display:flex;gap:8px;flex-wrap:wrap}
.side-foot .bk{display:flex;gap:6px}
.side-foot .bk button{flex:1;font-size:12px}
.imp-sum{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px}
.imp-sum td{padding:4px 8px}
.day-match{background:var(--match-soft);border-radius:8px;padding:10px 12px;font-weight:600}
.test-grid{display:grid;gap:4px}
/* varios intentos por jugador (saltos, sprints…) */
.test-grid .intc{display:none}
.test-grid.with-int .intc{display:flex;gap:4px;justify-content:flex-end}
.test-grid.with-int .tr [data-jid],.test-grid.with-int .tr.th .lbl-m{display:none}
.test-grid .intc input{width:62px;min-width:0}
.test-grid.with-int .tr{grid-template-columns:minmax(0,1fr) auto!important}
.test-grid.with-int.with-ideal .tr{grid-template-columns:minmax(0,1fr) auto 112px!important}
.test-grid.with-int.with-bw .tr{grid-template-columns:minmax(0,1fr) 64px auto!important}
.test-grid.with-int.with-ideal.with-bw .tr{grid-template-columns:minmax(0,1fr) 64px auto 112px!important}
@media (max-width:520px){.test-grid .intc input{width:48px}.test-grid.with-int.with-ideal .tr{grid-template-columns:minmax(0,1fr) auto 84px!important}.test-grid.with-int.with-ideal.with-bw .tr{grid-template-columns:minmax(0,1fr) 48px auto 84px!important}}
.int-box{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.int-box label{display:flex;gap:6px;align-items:center;font-weight:600}
.ints-t{display:block;font-size:11px;color:var(--ink-3);font-weight:400;font-family:var(--f-mono)}
.test-grid .tr{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.test-grid input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:80;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}

@media (max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:40;height:100%;box-shadow:var(--shadow)}
  .app.side-off .side{margin-left:-280px}
  .app:not(.side-off) .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:30}
  .main{padding-inline:16px}
  .grid2{grid-template-columns:1fr}
  .match{grid-template-columns:64px 1fr;}
  .match .right{grid-column:1/-1}
  .ex-head2{display:none}
  .exr{grid-template-columns:52px minmax(0,1fr) 28px;grid-template-areas:"n n x" "s r r" "c c c" "l l l"}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
.tp-login{display:flex;align-items:center;gap:10px}.tp-login .kb{width:34px;height:34px;color:var(--ink)}
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .25s}
#boot.off{opacity:0;pointer-events:none}
.boot-in{display:grid;justify-items:center;gap:8px;text-align:center}
.boot-in img{width:64px;height:auto}
.boot-in b{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.boot-in b span{color:var(--accent)}
.boot-in small{color:var(--ink-3);font-size:13px}
.boot-in i{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.boot-in i::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);border-radius:3px;animation:bootbar 1s ease-in-out infinite}
@keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.boot-in i::after{animation:none}}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;padding-inline:16px}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(380px,100%);display:grid;gap:14px;box-shadow:var(--shadow)}
.status button{background:none;border:0;color:var(--side-ink);text-decoration:underline;padding:0;font-size:11.5px;margin-left:auto}
/* ---- compartir en modo solo lectura ---- */
.sh-on{background:var(--good);color:#fff;border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:800;letter-spacing:.04em;opacity:1}
.sw{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked+i{background:var(--good)}
.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}
.sw b{display:block;font-size:15px}
.sh-link{display:flex;gap:8px}.sh-link .inp{flex:1;min-width:0}
.ro-band{background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.ro-band b{font-weight:800;white-space:nowrap}
body.ro :is(.st-import,#catForm,.bk,#editCat,#plForm,#bulkForm,.tes-seg,[data-share],.ro-hide,.draft-note,[data-asignew],[data-asigend],[data-rutdup],.rut-acts [data-asig],[data-act=allP],[data-act=newMatch],[data-act=newTest],[data-act=newInj],[data-act=editIdeal],[data-act=testList],[data-act=newRut],[data-act=newRutHere],[data-act=newAsig],[data-act=atlLink]){display:none!important}
body.ro .modal-f button:not([data-close]):not(#ldBack):not(#goAtt):not(#r_print):not(#goStats):not(#toLoads):not([data-rok]){display:none!important}
body.ro .modal-b button:not([data-stype]):not(.ld-btn):not([data-rok]):not([data-close]){display:none!important}
body.ro .modal-b :is(input,textarea,select){background:transparent;cursor:default}
body.ro .modal-b input::placeholder,body.ro .modal-b textarea::placeholder{color:transparent}
</style>

function clean(o){return JSON.parse(JSON.stringify(o));}
const Store={
  mode:'loading', fs:null, local:ls.get('pfclub-local',{}), lsubs:[], csubs:[],
  async init(){
    if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined'){this.mode='local';return;}
    firebase.initializeApp(FIREBASE_CONFIG);
    this.fs=firebase.firestore();
    /* la pestaña que se abre última es la que manda (si quedó otra abierta y dormida en el celu, ya no traba esta).
       En algunos celulares esto puede quedar colgado: no lo esperamos más de 2,5 s */
    try{await Promise.race([this.fs.enablePersistence({experimentalForceOwningTab:true}),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
    this.mode='cloud';
  },
  watch(coll,field,val,cb){
    if(this.mode==='cloud'){
      let q=this.fs.collection(coll); if(field) q=q.where(field,'==',val);
      const sub={coll,field,val,cb,un:null,dead:false,fails:0};
      sub.start=()=>{sub.dead=false;sub.un=q.onSnapshot(s=>{sub.fails=0;cb(s.docs.map(d=>Object.assign({id:d.id},d.data())));},
        e=>{console.warn(coll,e);sub.dead=true;sub.fails++;sub.code=e&&e.code;
          if(e&&e.code==='permission-denied'&&RO)return roBlocked();
          if(e&&e.code==='permission-denied'&&sub.fails>=3)handleErr(e);
          NET.upd();NET.retry();});};
      sub.start();this.csubs.push(sub);
      return ()=>{this.csubs=this.csubs.filter(x=>x!==sub);try{sub.un&&sub.un();}catch(e){}};
    }
    const sub={coll,field,val,cb}; this.lsubs.push(sub); this._emit(sub);
    return ()=>{this.lsubs=this.lsubs.filter(x=>x!==sub);};
  },
  _emit(sub){const c=this.local[sub.coll]||{};const arr=Object.keys(c).map(id=>Object.assign({id},c[id])).filter(x=>!sub.field||x[sub.field]===sub.val);sub.cb(arr);},
  _changed(coll){ls.set('pfclub-local',this.local);this.lsubs.filter(s=>s.coll===coll).forEach(s=>this._emit(s));},
  /* En la nube no esperamos la confirmación del servidor: Firestore aplica el cambio
     al toque en pantalla y lo sube cuando hay señal (sirve en la cancha sin wifi). */
  async put(coll,id,data){
    if(RO){roMsg();return;}
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).set(clean(data)).catch(handleErr); NET.wrote(); return; }
    (this.local[coll]=this.local[coll]||{})[id]=clean(data); this._changed(coll);
  },
  async getAll(coll){
    if(this.mode==='cloud'){const s=await this.fs.collection(coll).get();const o={};s.docs.forEach(d=>o[d.id]=d.data());return o;}
    return clean(this.local[coll]||{});
  },
  async putMany(coll,obj){
    if(RO){roMsg();return;}
    const ids=Object.keys(obj);
    if(this.mode==='cloud'){
      for(let i=0;i<ids.length;i+=400){const b=this.fs.batch();ids.slice(i,i+400).forEach(id=>b.set(this.fs.collection(coll).doc(id),clean(obj[id])));await b.commit();}
      return;
    }
    this.local[coll]=this.local[coll]||{};ids.forEach(id=>this.local[coll][id]=clean(obj[id]));this._changed(coll);
  },
  async remove(coll,id){
    if(RO){roMsg();return;}
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).delete().catch(handleErr); NET.wrote(); return; }
    if(this.local[coll]) delete this.local[coll][id]; this._changed(coll);
  }
};
function handleErr(e){
  const c=e&&e.code;
  if(c==='permission-denied'&&RO) return roBlocked();
  if(c==='permission-denied'&&Store.mode==='cloud'){const u=firebase.auth().currentUser;
    $('#banner').innerHTML='<div class="banner" style="border-color:var(--bad);background:var(--bad-soft)"><b>No se guardó.</b> La cuenta '+esc(u&&u.email?u.email:'con la que entraste')+' no tiene permiso para cargar datos. Tocá <b>Salir</b> (abajo del menú) y entrá con la cuenta autorizada.</div>';}
  if(c==='permission-denied') toast('Tu cuenta no tiene permiso. Revisá las reglas de Firebase.');
  else if(c==='resource-exhausted') toast('Se llegó al límite gratuito de Firebase por hoy.');
  else toast('No se pudo guardar. Probá de nuevo.');
}
/* ---- estado de la conexión: lo que muestra el puntito de abajo del menú ---- */
const NET={on:false,cache:true,pend:false,t0:Date.now(),rt:null,wait:4000,
  start(){if(this.on||Store.mode!=='cloud')return;this.on=true;
    Store.fs.collection('config').limit(1).onSnapshot({includeMetadataChanges:true},s=>{this.cache=s.metadata.fromCache;this.upd();},()=>{});
    const wake=()=>{this.t0=Date.now();this.revive();this.upd();setTimeout(()=>this.upd(),6500);};
    window.addEventListener('online',wake);window.addEventListener('offline',()=>this.upd());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
    setTimeout(()=>this.upd(),6000);this.upd();},
  wrote(){if(Store.mode!=='cloud')return;this.pend=true;this.upd();
    Store.fs.waitForPendingWrites().then(()=>{this.pend=false;this.upd();},()=>{});},
  retry(){if(this.rt)return;this.rt=setTimeout(()=>{this.rt=null;this.revive();this.wait=Math.min(this.wait*2,60000);},this.wait);},
  revive(){const d=Store.csubs.filter(x=>x.dead);if(!d.length){this.wait=4000;return;}
    d.forEach(x=>{try{x.un&&x.un();}catch(e){}x.start();});this.upd();},
  upd(){if(!this.on||RO)return;const el=$('#status');const u=firebase.auth().currentUser;
    const off=!navigator.onLine||(this.cache&&Date.now()-this.t0>6000);const dead=Store.csubs.some(x=>x.dead);
    let ok=false,txt;
    if(!navigator.onLine)txt=this.pend?'Sin internet · hay cambios esperando para subirse':'Sin internet · lo que cargues se sube cuando vuelva';
    else if(Store.csubs.some(x=>x.dead&&x.code==='permission-denied'))txt='Sin permiso: '+(u&&u.email?u.email:'esta cuenta')+' no está autorizada. Tocá Salir y entrá con la cuenta correcta';
    else if(dead)txt='Reconectando…';
    else if(off)txt=this.cache&&Date.now()-this.t0<=6000?'Conectando…':(this.pend?'Sin conexión · hay cambios esperando para subirse':'Sin conexión con la nube');
    else if(this.cache)txt='Conectando…';
    else if(this.pend)txt='Subiendo cambios…';
    else{ok=true;txt='Sincronizado · '+(u?u.email:'');}
    el.className='status'+(ok?' ok':'');
    el.innerHTML='<i></i><span>'+esc(txt)+'</span><button id="logout">Salir</button>';
    $('#logout').onclick=()=>firebase.auth().signOut().then(()=>location.reload());}
};
function setStatus(kind){
  if(kind==='cloud'&&!RO){NET.start();NET.upd();return;}

  else if(kind==='local'){el.className='status';el.innerHTML='<i></i><span>Guardado solo en este navegador</span>';}
  else if(kind==='err'){el.className='status';el.innerHTML='<i></i><span>Problema de conexión</span>';}
}

  S.asis.forEach(a=>{const m=a.marcas||{};Object.keys(m).forEach(jid=>{if(st[jid]&&st[jid][m[jid]]!=null){st[jid][m[jid]]++;st[jid].t++;}});});

function sesContent(x,fecha){
  if(x.src==='rut'){const w=weekIdx(x.asig,fecha);const s=resolveDay(x.dia,w);s.hora=x.hora;s.rutDia=x.dia.nombre;s.semana=w+1;s.semTot=x.asig.semanas||0;return {s,rut:x.rut,exists:false};}

function presText(e,b){

  const r=reps.length?(e.dist?reps.join('-'):reps[0]):'';

}
function attOf(f){const a=S.asis.find(x=>x.fecha===f);if(!a)return null;const m=a.marcas||{};return {p:Object.values(m).filter(x=>x==='P').length,t:Object.keys(m).length};}

function calTitle(){

    return A.getMonth()===B.getMonth()?A.getDate()+' – '+B.getDate()+' '+B.toLocaleDateString('es-AR',{month:'short',year:'numeric'}):fmtD(a,{day:'numeric',month:'short'})+' – '+fmtD(b,{day:'numeric',month:'short',year:'numeric'});}

}
function calMove(dir){

/* ---- arrastrar ejercicios para cambiar el orden (mouse y dedo); también dentro de otro bloque ---- */
const DRAG={row:null,root:null,scroller:null,raf:0,y:0};
function dragTargets(){return [...DRAG.root.querySelectorAll('.blk-ex')];}
function dragMove(y){
  const row=DRAG.row;let placed=false;
  for(const box of dragTargets()){
    const r=box.getBoundingClientRect();
    if(y<r.top-24||y>r.bottom+24)continue;
    const rows=[...box.querySelectorAll(':scope > .exr')].filter(x=>x!==row);
    let before=null;for(const x of rows){const q=x.getBoundingClientRect();if(y<q.top+q.height/2){before=x;break;}}

/* ---------- pegar rutina como texto ---------- */
const RX_PRES=/(\d{1,2})\s*[x×X*]\s*(\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?(?:\s*[-\/,]\s*\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?)*)/;
const RX_SDE=/(\d{1,2})\s*series?\s*(?:de|x)\s*(\d+(?:\s*[-\/,]\s*\d+)*)/i;
const RX_LIST=/(?:^|\s)(\d+(?:\s*[-\/]\s*\d+){1,11})(?=\s|$)/;
const RX_HEAD=/^(bloque|circuito|superserie|biserie|triserie|parte|serie\s+[a-z\d]|activaci[oó]n|core|potencia|fuerza|accesorios?)\b/i;
function splitReps(str){return str.split(/\s*[-\/,]\s*/).map(x=>x.trim()).filter(Boolean);}
function parseExercise(line){
  const parts=line.split(/\s+\/\s+|\s*\|\s*/);
  if(parts.length>1&&parts.slice(1).every(p=>/^\d{1,2}\s*[x×X*]\s*\d/.test(p.trim())||/^@?\s*\d+(?:[.,]\d+)?\s*(?:%|kg|x\s*pc|reps?)/i.test(p.trim())||/^\d{1,3}(?:\s*[-\/]\s*\d{1,3})*$/.test(p.trim()))){const e=parseExercise(parts[0]);e.prog=['',...parts.slice(1).map(x=>x.trim())];return e;}
  let link='';
  line=line.replace(/(https?:\/\/\S+|(?:www\.)?(?:youtu\.be|youtube\.com|drive\.google\.com)\/\S+)/i,m=>{link=m;return ' ';});
  line=line.replace(/^\s*(?:[-•*·–]+|\d{1,2}[.)]|[a-z]\d{1,2}[.):-]?|[a-z][.)])\s+/i,'').trim();
  let m,series='',reps=[],name=line,rest='',raw='',expl=false;
  if((m=line.match(RX_PRES))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_SDE))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_LIST))){reps=splitReps(m[1]);series=String(reps.length);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(/\s[x×]\s*(\d+)\b/))){reps=[m[1]];name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  name=name.replace(/[\s:,\-–(]+$/,'').trim();
  const c=rest.replace(/^[\s,;:\-–@)]+/,'').replace(/[\s,;(]+$/,'').trim();
  /* "3x8-8" (por lado) o "3x12/15" (rango): si la cantidad no coincide con las series, se respeta tal cual */
  if(expl&&reps.length>1&&reps.length!==+series)return {n:name,series,reps:[raw.replace(/\s+/g,'').trim()],dist:false,c,link};
  const uniq=[...new Set(reps)];
  const dist=reps.length>1&&uniq.length>1;
  return {n:name,series,reps:dist?reps:[uniq[0]||''],dist,c,link};
}
function parseRoutineText(txt){
  const lines=txt.replace(/\r/g,'').split('\n');
  const blocks=[];let cur=null;let blankBreak=false;
  const hasHeaders=lines.some(l=>{const t=l.trim();return t&&!RX_PRES.test(t)&&(RX_HEAD.test(t)||/:\s*$/.test(t));});
  const newBlock=(nombre,series)=>{cur={nombre:nombre||('Bloque '+(blocks.length+1)),series:series||'',nota:'',ejercicios:[]};blocks.push(cur);};
  lines.forEach(raw=>{
    const t=raw.trim();
    if(!t){blankBreak=true;return;}
    const isHead=!RX_PRES.test(t)&&!RX_SDE.test(t.replace(/^.*?(\d+\s*series?\s*de)/i,'$1'))&&(RX_HEAD.test(t)||/:\s*$/.test(t));
    if(isHead){
      const sm=t.match(/(\d{1,2})\s*(?:series|sets|vueltas|rondas)/i);
      const nombre=t.replace(/(\(|[-–:,]\s*)?\d{1,2}\s*(?:series|sets|vueltas|rondas)\)?/i,'').replace(/[\s:\-–]+$/,'').trim();
      newBlock(nombre,sm?sm[1]:'');blankBreak=false;return;
    }
    if(/^(pausa|descanso|nota|obs)/i.test(t)&&cur){cur.nota=(cur.nota?cur.nota+' · ':'')+t;return;}
    if(!cur||(blankBreak&&!hasHeaders&&cur.ejercicios.length))newBlock();
    blankBreak=false;
    const e=parseExercise(t);if(e.n)cur.ejercicios.push(e);
  });
  blocks.forEach(b=>{
    const ss=b.ejercicios.map(e=>e.series).filter(Boolean);
    if(!b.series&&ss.length===b.ejercicios.length&&ss.length&&new Set(ss).size===1)b.series=ss[0];
    b.ejercicios.forEach(e=>{if(e.series&&e.series===b.series)e.series='';});
  });
  return blocks.filter(b=>b.ejercicios.length||b.nota);
}

/* ---------- rutinas: proyección en el calendario ---------- */
const WD=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const WDL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const wdOf=f=>(pISO(f).getDay()+6)%7;
const addDays=(f,n)=>{const d=pISO(f);d.setDate(d.getDate()+n);return iso(d);};
const rutActive=(r,f)=>r.desde&&f>=r.desde&&(!r.hasta||f<=r.hasta);
function rutState(r){if(r.hasta&&r.hasta<TODAY)return 'fin';if(r.desde>TODAY)return 'prox';return 'vig';}
/* Días de una rutina. Las rutinas viejas (un solo contenido para varios días) se convierten al vuelo. */
function rutDays(r){
  if(r.sesiones&&r.sesiones.length)return r.sesiones;
  const base={};['objetivo','duracion','rpe','calor','bloques','ejercicios','principal','calma','notas'].forEach(k=>{if(r[k]!=null)base[k]=r[k];});
  if(base.ejercicios&&!base.bloques){base.bloques=toBloques(base,r.tipo);}delete base.ejercicios;
  return (r.dias||[]).slice().sort((a,b)=>a.d-b.d).map((x,i)=>Object.assign(JSON.parse(JSON.stringify(base)),{nombre:'Día '+(i+1),d:x.d,hora:x.hora||''}));
}
const weekIdx=(r,f)=>Math.max(0,Math.floor(daysBetween(r.desde,f)/7));
function applyProg(e,b,txt){
  const o=Object.assign({},e);txt=String(txt).trim();
  const p=parseExercise('X '+txt);
  if(!p.series&&!(p.reps.length>1||p.reps[0]!=='')){
    /* la semana solo cambia reps ("12 reps") o carga ("75%", "80kg", "1.5xPC") */
    /* "6" o "6 reps" = repeticiones; "6 reps 80kg" = reps + carga */
    const m=txt.match(/^(\d{1,3})(?:\s*(?:reps?|repeticiones)\b\s*(.*))?$/i);
    if(m){o.reps=[m[1]];o.dist=false;if(m[2]&&m[2].trim())o.c=m[2].replace(/^[\s,;:\-–@]+/,'').trim();}
    else o.c=txt.replace(/^@\s*/,'');
    return o;
  }
  /* solo reps sin "x" (ej. "8-8", "12/15", "8-6-4"): si la cantidad no coincide con las series, es por lado o rango */
  const lm=txt.match(/^(\d+(?:\s*[-\/,]\s*\d+)+)/);
  if(!/[x×*]/i.test(txt)&&lm){
    const eff=+(e.series||b.series||0),n=lm[1].split(/\s*[-\/,]\s*/).length;
    if(eff&&n!==eff){o.reps=[lm[1].replace(/\s+/g,'')];o.dist=false;const rest=txt.slice(lm[0].length).replace(/^[\s,;:\-–@]+/,'').trim();if(rest)o.c=rest;return o;}
  }
  if(p.series)o.series=p.series;
  const hasR=p.reps.length>1||p.reps[0]!=='';
  if(hasR){o.reps=p.reps;o.dist=p.reps.length>1;if(!p.series&&o.dist)o.series=String(p.reps.length);}
  if(p.c)o.c=p.c;
  return o;
}
function resolveDay(dd,w){
  const c=JSON.parse(JSON.stringify(dd));
  (c.bloques||[]).forEach(b=>{b.ejercicios=(b.ejercicios||[]).map(e=>{
    const pr=e.prog||[];let t='';
    for(let j=Math.min(w,pr.length-1);j>=1;j--){if(pr[j]){t=pr[j];break;}}
    const o=t?applyProg(e,b,t):Object.assign({},e);
    if(t&&w>0)o.progW=1;delete o.prog;return o;
  });});
  return c;
}
function sessionsOn(f){
  const conc=S.ses.filter(s=>s.fecha===f).map(s=>Object.assign({src:'ses'},s));
  const out=conc.slice();const wd=wdOf(f);
  S.asigAll.forEach(a=>{
    if(a.cat!==S.cat||!rutActive(a,f))return;
    const r=rutById(a.rutina);if(!r)return;
    const di=(a.horario||[]).findIndex(x=>x&&x.d===wd);if(di<0)return;
    const dd=rutDays(r)[di];if(!dd)return;
    if(conc.some(c=>c.tipo===r.tipo&&(c.rutina===r.id||!c.rutina)))return;
    out.push({src:'rut',tipo:r.tipo,objetivo:dd.nombre+' · '+r.nombre,hora:(a.horario[di]||{}).hora||'',rut:r,asig:a,dia:dd});
  });
  return out.sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')||a.tipo.localeCompare(b.tipo));
}

/* ---------- cargas por jugador (%RM y ×peso corporal) ---------- */
function parseLoad(c){
  c=String(c||'').replace(/,/g,'.');
  let m=c.match(/(\d+(?:\.\d+)?)\s*(?:[-–a]\s*(\d+(?:\.\d+)?))?\s*[x×]\s*(?:pc|p\.?c\.?|peso)/i);
  if(m)return {type:'pc',a:+m[1],b:m[2]?+m[2]:null};
  m=c.match(/(\d+(?:\.\d+)?)\s*%?\s*(?:[-–a]\s*(\d+(?:\.\d+)?))?\s*%\s*(?:de\s*)?(?:1?\s*rm)?/i);
  if(m)return {type:'rm',a:+m[1]/100,b:m[2]?+m[2]/100:null};
  return null;
}
const round25=x=>Math.round(x/2.5)*2.5;
function testKeyFor(name){
  const k=slug(name);const lib=S.lib.find(x=>x.id===k);
  if(lib&&lib.test)return lib.test;
  const exs=allExercises().filter(e=>e.u==='kg');
  const exact=exs.find(e=>e.k===k||slug(e.n)===k);if(exact)return exact.k;
  const part=exs.filter(e=>k.includes(e.k)||k.includes(slug(e.n))).sort((a,b)=>b.k.length-a.k.length)[0];
  return part?part.k:'';
}
function lastRM(jid,key){
  let out=null;
  S.tes.filter(t=>t.ejercicio===key).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(t=>{const v=(t.valores||{})[jid];if(v!==''&&v!=null)out={rm:Number(v),t};});
  return out;
}
function loadRows(e,key,L){
  return sortedJug().map(j=>{
    const lr=key?lastRM(j.id,key):null;const bw=bwOf(j.id,lr&&lr.t);
    const rm=lr?lr.rm:null;
    const calc=f=>{
      if(L.type==='rm'){if(!rm)return null;const kg=round25(rm*f);return {kg,pct:kg/rm,pc:bw?kg/bw:null};}
      if(!bw)return null;const kg=round25(bw*f);return {kg,pct:rm?kg/rm:null,pc:f};
    };
    return {j,rm,bw,lo:calc(L.a),hi:L.b?calc(L.b):null};
  });
}
function loadsSection(e,b,label,key){
  const L=parseLoad(e.c);
  const exs=allExercises().filter(x=>x.u==='kg');
  let h='<div class="ld-sec" data-exname="'+esc(e.n)+'"><div class="ld-h"><span class="mono tiny">'+esc(label)+'</span><b>'+esc(e.n)+'</b><span class="pill neutral">'+esc(presText(e,b))+' · '+esc(e.c)+'</span></div>';
  h+='<label class="ld-map tiny">1RM tomado del testeo <select data-map="'+esc(slug(e.n))+'"><option value="">— elegir —</option>'+exs.map(x=>'<option value="'+esc(x.k)+'"'+(x.k===key?' selected':'')+'>'+esc(x.n)+'</option>').join('')+'</select></label>';
  if(!key)return h+'<p class="tiny warn-t">Elegí de qué testeo sale el 1RM de este ejercicio (queda guardado para la próxima).</p></div>';
  const rows=loadRows(e,key,L);
  const kgTxt=r=>r.lo?fmtN(r.lo.kg)+(r.hi?'–'+fmtN(r.hi.kg):'')+' kg':null;
  h+='<div class="tbl-wrap"><table class="ld-t"><thead><tr><th>Jugador</th><th class="r">Carga</th><th class="r">% de su 1RM</th><th class="r">× peso corp.</th><th class="r">1RM</th><th class="r">Peso corp.</th></tr></thead><tbody>'+
    rows.map(r=>{
      const k=kgTxt(r);
      const why=!r.rm&&L.type==='rm'?'sin 1RM en testeos':(!r.bw&&L.type==='pc'?'falta peso corporal':'');
      const over=r.lo&&r.lo.pct!=null&&(r.hi||r.lo).pct>1;
      const pctT=r.lo&&r.lo.pct!=null?Math.round(r.lo.pct*100)+(r.hi&&r.hi.pct!=null?'–'+Math.round(r.hi.pct*100):'')+' %':'–';
      const pcT=r.lo&&r.lo.pc!=null?r.lo.pc.toFixed(2)+(r.hi&&r.hi.pc!=null?'–'+r.hi.pc.toFixed(2):'')+'×':'–';
      return '<tr><td>'+esc(r.j.nombre)+'</td><td class="r mono">'+(k?'<b class="ld-kg">'+k+'</b>':'<span class="tiny warn-t">'+why+'</span>')+'</td>'+
        '<td class="r mono">'+(over?'<span class="pill bad" title="Supera su 1RM">'+pctT+'</span>':pctT)+'</td><td class="r mono">'+pcT+'</td>'+
        '<td class="r mono">'+(r.rm?fmtN(r.rm)+' kg':'–')+'</td><td class="r mono">'+(r.bw?fmtN(r.bw)+' kg':'–')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  return h;
}
function openLoads(s,tipo,fecha,only){
  const items=[];

  toBloques(s,tipo).filter(b=>(b.ejercicios||[]).some(e=>e.n)||b.nota).forEach((b,bi)=>(b.ejercicios||[]).filter(e=>e.n).forEach((e,ei)=>{if(parseLoad(e.c))items.push({e,b,label:String.fromCharCode(65+bi)+(ei+1),id:bi+':'+ei});}));

      Store.put('ejercicios',k,d);

  body.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;

  mw.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}if(e.key==='ArrowRight'){e.preventDefault();go(1);}});
  const md=mw.querySelector('.modal');if(md){md.tabIndex=-1;if(!document.activeElement||!mw.contains(document.activeElement))md.focus({preventScroll:true});}

  else if(cur&&cur.src==='rut'){rut=cur.rut;asg=cur.asig;const w=weekIdx(asg,fecha);s=resolveDay(cur.dia,w);s.hora=cur.hora;s.rutDia=cur.dia.nombre;s.semana=w+1;s.semTot=asg.semanas||0;}

    fb+=S.par.filter(p=>p.fecha===fecha).map(p=>'<div class="day-match">Partido: vs '+esc(p.rival)+(p.hora?' · '+esc(p.hora)+' h':'')+'</div>').join('');
    const pend=Draft.get('ses-'+docId);
    if(pend)fb+='<div class="draft-note"><span>Tenés cambios sin guardar en este día.</span><button type="button" class="btn sm pri" id="goDraft">Seguir editando</button></div>';
    {const wk=rut&&asg?addDays(asg.desde,7*weekIdx(asg,fecha)):addDays(fecha,-wdOf(fecha));
     ATLCTX={desde:wk,hasta:addDays(wk,6),sem:rut&&asg?weekIdx(asg,fecha)+1:null,back:()=>openDay(fecha,tipo)};}
    fb+=fichaHtml(s,tipo,fecha,rut);ATLCTX_LAST=ATLCTX;ATLCTX=null;
    {const dl=lesOf().filter(l=>activeInj(l)&&l.rutina&&rutById(l.rutina));
     if(dl.length)fb+='<div class="rut-note"><span><b>Trabajo diferenciado:</b> '+dl.map(l=>esc(jugName(l.jugador))+(rutById(l.rutina).dif?'':' ('+esc(rutById(l.rutina).nombre)+')')).join(' · ')+'</span></div>';}

    foot='<div class="modal-f"><div class="grow"></div><button class="btn" data-close>Cerrar</button></div>';
  } else {
    if(rut&&!exists) b+='<div class="rut-note">Viene de la rutina <b>'+esc(rut.nombre)+'</b>'+(s.rutDia?' · <b>'+esc(s.rutDia)+'</b>':'')+' ('+esc(vigText(asg||{}))+'). Si cambiás algo acá, se guarda solo para este día.<div class="rut-acts"><button type="button" class="btn sm" id="editRut">Editar la rutina</button><button type="button" class="btn sm" id="suspend">Suspender este día</button></div></div>';

    if(q('editRut'))q('editRut').onclick=()=>openRut(rut.id);

/* ---------- imprimir rutina como planilla ---------- */
function printRut(rid,aid){const r=rutById(rid);if(!r)return;printRutObj(r,aid?S.asigAll.find(x=>x.id===aid):null);}
function printRutObj(r,a){
  const ds=rutDays(r);
  const W=(a&&a.semanas)||r.semanas||4;
  const anyProg=ds.some(d=>(d.bloques||[]).some(b=>(b.ejercicios||[]).some(e=>(e.prog||[]).some(Boolean))));
  const weeks=anyProg?W:1;
  const meta=[r.tipo==='cancha'?'Cancha':'Gimnasio'];
  if(a){meta.push(catName(a.cat));meta.push(vigText(a));}else meta.push(W+(W===1?' semana':' semanas'));
  let h='<header class="p-head"><h1>'+esc(r.nombre||'Rutina')+'</h1><div class="p-meta">'+meta.map(esc).join(' · ')+'</div></header>';
  ds.forEach((d,di)=>{
    const h0=a&&(a.horario||[])[di];
    const res=[];for(let w=0;w<weeks;w++)res.push(resolveDay(d,w));
    h+='<section class="p-day"><h2>'+esc(d.nombre||('Día '+(di+1)))+(h0&&h0.d!=null?' <span>· '+WDL[h0.d]+(h0.hora?' '+esc(h0.hora):'')+'</span>':'')+'</h2>';
    const info=[];if(d.objetivo)info.push('<b>Objetivo:</b> '+esc(d.objetivo));if(d.duracion)info.push('<b>Duración:</b> '+esc(d.duracion)+'′');if(d.rpe)info.push('<b>RPE:</b> '+esc(d.rpe));
    if(info.length)h+='<p class="p-info">'+info.join(' &nbsp;·&nbsp; ')+'</p>';
    if(d.calor)h+='<p class="p-info"><b>Entrada en calor:</b> '+esc(d.calor).replace(/\n/g,'<br>')+'</p>';
    const bl=(d.bloques||[]);
    if(bl.some(b=>(b.ejercicios||[]).some(e=>e.n))){
      const hasC=bl.some(b=>(b.ejercicios||[]).some(e=>e.n&&e.c));
      const nCols=2+(anyProg?weeks:1)+(hasC?1:0);
      h+='<table class="p-t"><thead><tr><th class="p-i"></th><th>Ejercicio</th>'+(anyProg?Array.from({length:weeks},(_,w)=>'<th class="p-w">Sem '+(w+1)+'</th>').join(''):'<th class="p-w">Series × reps</th>')+(hasC?'<th class="p-c">'+(anyProg?'Carga (sem 1)':'Carga')+'</th>':'')+'</tr></thead><tbody>';
      let L=0;
      bl.forEach((b,bi)=>{
        const ex=(b.ejercicios||[]).map((e,ei)=>({e,ei})).filter(x=>x.e.n);if(!ex.length)return;
        const letter=String.fromCharCode(65+L++);
        h+='<tr class="p-blk"><td colspan="'+nCols+'"><b>'+letter+' · '+esc(b.nombre||('Bloque '+(bi+1)))+'</b>'+(b.series?' — '+esc(b.series)+' series':'')+(b.nota?' — <i>'+esc(b.nota)+'</i>':'')+'</td></tr>';
        ex.forEach(({e,ei},k)=>{
          let prev='';
          const cells=res.map((rd,w)=>{
            const rb=rd.bloques[bi],re=rb.ejercicios[ei];
            const txt=presText(re,rb)||'—';const cg=re.c!==e.c&&re.c?' <small>'+esc(re.c)+'</small>':'';
            const chg=w>0&&txt+cg!==prev;prev=txt+cg;
            return '<td class="p-w'+(chg?' chg':'')+'">'+esc(txt)+cg+'</td>';
          }).join('');
          h+='<tr><td class="p-i">'+letter+(k+1)+'</td><td class="p-n">'+esc(e.n)+(e.obs?'<i class="p-ob">'+esc(e.obs)+'</i>':'')+'</td>'+cells+(hasC?'<td class="p-c">'+esc(e.c||'')+'</td>':'')+'</tr>';
        });
      });
      h+='</tbody></table>';
    }
    if(r.tipo==='cancha'){if(d.principal)h+='<p class="p-info"><b>Parte principal:</b> '+esc(d.principal).replace(/\n/g,'<br>')+'</p>';if(d.calma)h+='<p class="p-info"><b>Vuelta a la calma:</b> '+esc(d.calma).replace(/\n/g,'<br>')+'</p>';}
    if(d.notas)h+='<p class="p-info"><b>Notas:</b> '+esc(d.notas).replace(/\n/g,'<br>')+'</p>';
    h+='</section>';
  });
  if(anyProg)h+='<p class="p-foot">En negrita: lo que cambia respecto de la semana anterior.</p>';
  /* sin márgenes del navegador (ahí van fecha, título y link): el margen lo pone la tabla de abajo,
     cuyo encabezado y pie vacíos se repiten en cada hoja */
  const pa=$('#printArea');pa.innerHTML='<table class="p-wrap"><thead><tr><td><div class="p-sp"></div></td></tr></thead><tbody><tr><td>'+h+'</td></tr></tbody><tfoot><tr><td><div class="p-sp"></div></td></tr></tfoot></table>';
  document.body.classList.add('printing');
  const oldTitle=document.title;document.title=r.nombre||'Rutina';   /* nombre del PDF al guardar */
  const done=()=>{document.body.classList.remove('printing');pa.innerHTML='';document.title=oldTitle;window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print();}catch(e){toast('No se pudo abrir la impresión en este navegador');done();}},80);
}

/* ---------- rutinas: biblioteca + asignaciones ---------- */
const rutById=id=>S.rutAll.find(r=>r.id===id)||null;
const asigOfCat=c=>S.asigAll.filter(a=>a.cat===c);
const catName=id=>(S.cats.find(c=>c.id===id)||{}).nombre||id;
function asigState(a){if(a.hasta&&a.hasta<TODAY)return 'fin';if(a.desde>TODAY)return 'prox';return 'vig';}
function schedText(r,a){
  const ds=r?rutDays(r):[];
  return ds.map((d,i)=>{const h=(a.horario||[])[i]||{};return '<span><b>'+esc(d.nombre||('Día '+(i+1)))+'</b> '+(h.d!=null?WD[h.d]:'sin día')+(h.hora?' '+esc(h.hora):'')+'</span>';}).join('');
}

/* Pasa las rutinas viejas (guardadas dentro de una categoría) a la biblioteca + una asignación. Corre una vez. */
let migrated=false;
async function migrateRutinas(){
  if(migrated)return;migrated=true;
  try{
    const R=await Store.getAll('rutinas'),A=await Store.getAll('asignaciones');
    for(const id of Object.keys(R)){
      const r=R[id];if(!r.cat)continue;
      const ds=rutDays(r);
      if(!A['mig_'+id])await Store.put('asignaciones','mig_'+id,{cat:r.cat,rutina:id,desde:r.desde||TODAY,semanas:r.semanas==null?4:r.semanas,hasta:r.hasta||'',finalizada:!!r.finalizada,horario:ds.map(d=>({d:d.d==null?null:d.d,hora:d.hora||''}))});
      await Store.put('rutinas',id,{nombre:r.nombre||'Rutina',tipo:r.tipo||'gym',semanas:r.semanas||4,sesiones:ds.map(d=>{const c=Object.assign({},d);delete c.d;delete c.hora;return c;})});
    }
  }catch(e){console.warn('migración rutinas',e);}
}

/* ----- pestaña Rutinas dentro de una categoría ----- */
function vRut(){
  const mine=asigOfCat(S.cat);
  let h='<div class="bar"><h2>Rutinas asignadas</h2><div class="grow"></div><button class="btn" data-act="atlLink">Link para los atletas</button><button class="btn" data-act="goLib">Ver biblioteca</button><button class="btn pri" data-act="newAsig">+ Asignar rutina</button></div>'+
    '<p class="tiny" style="margin:-6px 0 12px">Las rutinas se cargan en la <b>biblioteca</b> (menú lateral) y se asignan a una o varias categorías, cada una con sus días y horarios.</p>';
  if(!mine.length)return h+'<div class="empty"><b>Sin rutinas asignadas</b>Asigná una de la biblioteca o creá una nueva.<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-act="newAsig">Asignar rutina</button><button class="btn" data-act="newRutHere">Crear rutina nueva</button></div></div>';
  const groups={vig:[],prox:[],fin:[]};mine.forEach(a=>groups[asigState(a)].push(a));
  const titles={vig:'Vigentes',prox:'Próximas',fin:'Finalizadas'};
  ['vig','prox','fin'].forEach(k=>{
    const arr=groups[k].sort((a,b)=>k==='fin'?b.desde.localeCompare(a.desde):a.desde.localeCompare(b.desde));if(!arr.length)return;
    h+='<h3 style="margin-top:14px">'+titles[k]+'</h3><div class="rut-cards">'+arr.map(a=>{
      const r=rutById(a.rutina);
      if(!r)return '<div class="rut-card fin"><div class="rut-name">Rutina borrada</div><div class="rut-acts"><button class="btn sm" data-asig="'+esc(a.id)+'">Quitar</button></div></div>';
      const others=S.asigAll.filter(x=>x.rutina===r.id&&x.cat!==S.cat&&asigState(x)!=='fin').map(x=>catName(x.cat));
      return '<div class="rut-card'+(k==='fin'?' fin':'')+'"><div style="display:flex;gap:8px;align-items:start;justify-content:space-between"><div class="rut-name">'+esc(r.nombre)+'</div><span class="chip '+r.tipo+'">'+(r.tipo==='gym'?'Gym':'Cancha')+'</span></div>'+
        '<div class="rut-daylist">'+schedText(r,a)+'</div><div class="tiny">'+esc(vigText(a))+(r.editada?' · <span class="mod-t">'+modTxt(r)+'</span>':'')+'</div>'+
        (others.length?'<div class="tiny">También la hacen: '+others.map(esc).join(', ')+'</div>':'')+
        '<div class="rut-acts"><button class="btn sm" data-rut="'+esc(r.id)+'">Ver rutina</button><button class="btn sm ghost" data-asig="'+esc(a.id)+'">Días y fechas</button><button class="btn sm ghost" data-rutprint="'+esc(r.id)+'" data-asigid="'+esc(a.id)+'">Imprimir planilla</button>'+(k==='vig'?'<button class="btn sm ghost" data-asigend="'+esc(a.id)+'">Finalizar hoy</button>':'')+'</div></div>';
    }).join('')+'</div>';
  });
  return h;
}

/* ----- biblioteca (vista general, desde el menú lateral) ----- */
/* "últ. mod. 14/10" (con año solo si no es este año) */
function modTxt(r){if(!r||!r.editada)return '';const d=new Date(r.editada);const y=d.getFullYear();
  return 'últ. mod. '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+(y!==new Date().getFullYear()?'/'+String(y).slice(-2):'');}
function rutEstado(r){
  if(r.archivada)return 'arch';if(r.borrador)return 'pend';
  const as=S.asigAll.filter(a=>a.rutina===r.id);
  if(as.some(a=>asigState(a)!=='fin'))return 'vig';
  if(as.length)return 'venc';return 'libre';
}

      }catch(e){}
    };
  });
}

  b+='<div class="form-grid"><div class="field"><label for="a_d">Empieza</label><input type="date" id="a_d" value="'+esc(a.desde||TODAY)+'"></div>'+
    '<div class="field"><label for="a_w">Duración</label><select id="a_w">'+[1,2,3,4,5,6,8,10,12].map(n=>'<option value="'+n+'"'+(a.semanas==n?' selected':'')+'>'+n+(n===1?' semana':' semanas')+'</option>').join('')+'<option value="0"'+(a.semanas===0?' selected':'')+'>Hasta nuevo aviso</option></select></div>'+
    '<div class="field" style="grid-column:1/-1"><span class="tiny" id="a_end"></span></div></div>'+
    '<div><h3>Días y horarios</h3><div id="a_sched"></div></div>';
  const foot='<div class="modal-f">'+(a0?'<button class="btn danger" id="a_del">Quitar de la categoría</button>':'')+'<div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="a_save">'+(a0?'Guardar':'Asignar')+'</button></div>';
  openModal(modalHead('Asignar rutina',a0?'Días y fechas':(r?r.nombre:'Asignar rutina'))+'<div class="modal-b">'+b+'</div>'+foot,mw=>{
    const q=id=>mw.querySelector('#'+id);
    const drawSched=()=>{

      const ds=rutDays(rr);
      box.innerHTML='<div class="sched">'+ds.map((d,i)=>{const h=(a.horario||[])[i]||{};
        return '<div class="sched-row" data-i="'+i+'"><div class="sched-n"><b>'+esc(d.nombre||('Día '+(i+1)))+'</b></div><div class="wd-pick">'+WD.map((w,k)=>'<button type="button" class="wdb'+(h.d===k?' on':'')+'" data-k="'+k+'">'+w+'</button>').join('')+'</div><input type="time" class="sched-h" aria-label="Horario de '+esc(d.nombre||'')+'" value="'+esc(h.hora||'')+'"></div>';}).join('')+'</div>';

    });
    mw.querySelectorAll('.cat-pick input').forEach(cb=>cb.onchange=()=>cb.parentElement.classList.toggle('on',cb.checked));
    if(q('a_r'))q('a_r').onchange=()=>{a.horario=readSched();rid=q('a_r').value;const rr=getR();if(rr&&!a0){q('a_w').value=String(rr.semanas||4);endTxt();}drawSched();};

    q('a_w').onchange=endTxt;q('a_d').onchange=endTxt;endTxt();
    if(q('a_del'))armDelete(q('a_del'),async()=>{await Store.remove('asignaciones',a0.id);closeModal();toast('Rutina quitada de '+catName(a0.cat));});

      const rr=getR();if(!rr){toast('Elegí una rutina');return;}

      if(!targets.length){toast('Elegí al menos una categoría');return;}
      const horario=readSched();
      const sin=horario.findIndex(h=>h.d==null);
      if(sin>=0){toast('Elegí el día de la semana de '+(rutDays(rr)[sin].nombre||'Día '+(sin+1)));return;}
      const seen={};if(horario.some(h=>{if(seen[h.d])return true;seen[h.d]=1;return false;})){toast('Dos días de la rutina caen el mismo día de la semana. Cambiá uno.');return;}
      const desde=q('a_d').value;if(!desde){toast('Elegí la fecha de inicio');return;}
      const semanas=+q('a_w').value;
      const keepEnd=a0&&a0.finalizada&&a0.hasta;
      for(const c of targets){
        const data={cat:c,rutina:rr.id,desde,semanas,hasta:keepEnd?a0.hasta:(semanas?addDays(desde,semanas*7-1):''),finalizada:!!keepEnd,horario};
        await Store.put('asignaciones',a0?a0.id:uid(),data);
      }
      closeModal();toast(a0?'Guardado':'Asignada a '+targets.map(catName).join(', '));
    };
  });
}

/* ---------- RM indirecto ---------- */
const RM_F={
  epley:{n:'Epley',f:(w,r)=>w*(1+r/30)},
  brzycki:{n:'Brzycki',f:(w,r)=>r>=37?null:w*36/(37-r)},
  lombardi:{n:'Lombardi',f:(w,r)=>w*Math.pow(r,0.10)}
};
function rmEst(w,r,f){if(!(w>0))return null;if(!(r>1))return w;const x=(RM_F[f]||RM_F.epley).f(w,r);return x==null?null:Math.round(x*10)/10;}

/* ---------- DNI: nunca se guarda escrito, solo un código (SHA-256) para emparejar ---------- */
function cleanDni(v){return String(v||'').replace(/\D/g,'');}
function sha256(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const K=[],H=[];let n=2,c=0;
  const isP=x=>{for(let f=2;f*f<=x;f++)if(x%f===0)return false;return true;};
  while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c]=(Math.pow(n,1/3)*4294967296)|0;c++;}n++;}
  const bytes=unescape(encodeURIComponent(ascii));const words=[];const bl=bytes.length*8;
  let m=bytes+'\x80';while(m.length%64-56)m+='\x00';
  for(let i=0;i<m.length;i++)words[i>>2]|=m.charCodeAt(i)<<((3-i)%4)*8;
  words[words.length]=(bl/4294967296)|0;words[words.length]=bl;
  const h=H.slice();
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16);const o=h.slice();
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2];const a=h[0],e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;h.pop();
    }
    for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0;
  }
  return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
function dniHash(v){const d=cleanDni(v);return d?sha256('pizarra-pf|dni|'+d).slice(0,32):'';}

/* ---------- ideales de testeo ---------- */
const catRama=c=>{c=c||S.cats.find(x=>x.id===S.cat)||{};return c.rama||(/fem/i.test(c.nombre||'')?'f':'m');};
function idealOf(k){
  const d=S.ideales.find(x=>x.id===k);if(!d)return null;
  const r=catRama();const v=r==='f'?(d.f??d.m):(d.m??d.f);
  if(v==null||v==='')return null;
  return {tipo:d.tipo||'abs',v:Number(v),doc:d};
}
function idealLabel(id,ex){
  if(!id)return '';
  return id.tipo==='rel'?fmtN(id.v)+'× peso corporal':(ex.low?'≤ ':'')+fmtN(id.v)+' '+(ex.u||'');
}
/* valor + peso corporal → cuán cerca del ideal */
function evalIdeal(val,bw,ex,id){
  if(val==null||!id)return null;
  if(id.tipo==='rel'){
    if(!bw)return {nobw:true};
    const target=id.v*bw;return {target,pct:val/target,falta:Math.max(0,target-val),rel:val/bw};
  }
  if(ex.low)return {target:id.v,pct:val>0?id.v/val:0,falta:Math.max(0,val-id.v)};
  return {target:id.v,pct:val/id.v,falta:Math.max(0,id.v-val)};
}
const pctCls=p=>p>=1?'good':p>=.8?'warn':'bad';
function bwOf(jid,t){const s=t&&t.pc&&t.pc[jid];if(s)return Number(s);const j=S.jug.find(x=>x.id===jid);return j&&j.peso?Number(j.peso):null;}

const STATS=[['min','Min'],['pts','Pts'],['reb','Reb'],['ast','Asis'],['rec','Rec'],['per','Pérd'],['tap','Tap'],['fal','Faltas'],['val','Val']];
const ST_ALIAS={
  min:['min','mins','minutos','mj','mp','tj','tiempo'],
  pts:['pts','pt','puntos','p','ptos'],
  reb:['reb','rt','rb','rebotes','tr','rbt','tot','rebt'],
  ast:['as','ast','asis','asist','asistencias','a','asi'],
  rec:['rec','re','rob','robos','st','recuperos','br','recup','stl','rcp'],
  per:['per','pér','pe','perd','pérd','perdidas','pérdidas','to','bp','tov'],
  tap:['tap','ta','blk','tapones','tapas','bs','tf','tc'],
  val:['val','valoracion','eff','pir','v'],
  fal:['fp','fc','fal','faltas','pf','f','fouls']
};
const jugW=(pl)=>catRama()==='f'?(pl?'jugadoras':'jugadora'):(pl?'jugadores':'jugador');
const recCfg=()=>{const c=S.cfg.find(x=>x.id==='recup')||{};return {reg:c.reg!=null?+c.reg:20,comp:c.comp!=null?+c.comp:15};};
/* "25:30" → 25,5 · "25" → 25 */
function parseMin(v){v=String(v??'').trim();if(!v)return null;const m=v.match(/^(\d{1,3}):(\d{1,2})$/);if(m)return +m[1]+(+m[2])/60;const n=Number(v.replace(',','.'));return isNaN(n)?null:n;}
const fmtMin=m=>{if(m==null)return '–';let mm=Math.floor(m),ss=Math.round((m-mm)*60);if(ss===60){mm++;ss=0;}return ss?mm+':'+String(ss).padStart(2,'0'):String(mm);};
function recClass(min,cfg){if(min==null)return 'nc';if(min<=0)return 'nj';if(min>cfg.reg)return 'reg';if(min>=cfg.comp)return 'ask';return 'comp';}

/* ---------- leer texto de una planilla (pegado o de una foto) ---------- */
const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();
/* Reconoce por NOMBRE. Los dos equipos usan los mismos dorsales, así que el dorsal nunca alcanza solo:
   solo desempata o confirma una coincidencia débil (un único nombre en común). */
function matchPlayer(dorsal,name,info){
  const raw=String(name||'');const comma=raw.indexOf(',');
  const nt=normTxt(raw).split(' ').filter(w=>w.length>1);if(!nt.length)return null;
  const sur=comma>0?normTxt(raw.slice(0,comma)).split(' ').filter(w=>w.length>1):[];
  const cands=S.jug.map(j=>{
    const jt=normTxt(j.nombre).split(' ').filter(w=>w.length>1);
    const shared=nt.filter(w=>jt.includes(w));
    const pref=nt.filter(w=>!jt.includes(w)&&jt.some(x=>x.length>3&&w.length>3&&(x.startsWith(w)||w.startsWith(x)))).length;
    const dOk=dorsal!=null&&String(j.dorsal||'').trim()!==''&&String(j.dorsal).trim()===String(dorsal);
    let lvl=0;
    if(shared.length+pref>=2)lvl=3;                                  /* fuerte: dos partes del nombre */
    else if(shared.length===1&&sur.includes(shared[0]))lvl=2;         /* el apellido de la planilla */
    else if(shared.length===1&&dOk)lvl=2;                             /* un nombre + mismo dorsal */
    return {j,lvl,sc:shared.length*2+pref+(dOk?0.5:0)};
  }).filter(c=>c.lvl>=2).sort((a,b)=>b.lvl-a.lvl||b.sc-a.sc);
  if(!cands.length)return null;
  if(cands.length>1&&cands[0].lvl===cands[1].lvl&&cands[0].sc===cands[1].sc)return null; /* empate: mejor no adivinar */
  if(info)info.lvl=cands[0].lvl;
  return cands[0].j;
}
const isNumTok=t=>/^[-+]?\d+(?:[.,]\d+)?%?$|^\d{1,3}:\d{2}$|^\d+\/\d+$|^\d+-\d+$/.test(t);
const NAME_HDR=['n','nro','no','num','jugador','jugadora','nombre','dorsal','apellido'];
const isPM=t=>/^\+\/[-­–−]$/.test(t);
const hdrKey=t=>isPM(t)?null:(Object.keys(ST_ALIAS).find(k=>ST_ALIAS[k].includes(normTxt(t)))||null);
const hdrToks=f=>String(f||'').split(/[\s,;|]+/).filter(t=>t&&t!=='#'&&!NAME_HDR.includes(normTxt(t)));
/* si dos columnas se parecen al mismo dato (ej. "Tot." y "TR"), vale la primera */
function fmtToOrder(f){const used={};return hdrToks(f).map((t,i)=>{const k=hdrKey(t);if(!k||used[k])return '_'+i;used[k]=1;return k;});}
/* Actas CABB: el PDF pierde el signo menos; la valoración se recalcula con sus componentes para recuperar el signo */
function cabbVal(toks,nums){
  const T=toks.map(t=>t.toLowerCase().replace(/\.$/,''));const ai=[];T.forEach((t,i)=>{if(t==='a/i')ai.push(i);});
  const ix=n=>T.indexOf(n);const need=['pts','tot','ast','rec','per','tc','tr','fc','fr','val'];
  if(ai.length!==3||need.some(n=>ix(n)<0))return null;
  const N=i=>Number(nums[i])||0;const miss=i=>{const m=String(nums[i]||'').match(/^(\d+)\/(\d+)$/);return m?(+m[2])-(+m[1]):0;};
  return N(ix('pts'))+N(ix('tot'))+N(ix('ast'))+N(ix('rec'))+N(ix('tc'))+N(ix('fr'))-miss(ai[0])-miss(ai[1])-miss(ai[2])-N(ix('per'))-N(ix('tr'))-N(ix('fc'));
}
/* lo que una foto suele confundir: "o" por 0, "l"/"I" por 1 */
const fixNum=t=>/^[0-9oOlI|:\/.,+\-]+$/.test(t)&&/[0-9]/.test(t)||/^[oO]$/.test(t)?t.replace(/[oO]/g,'0').replace(/[lI|]/g,'1'):t;
/* Lee planillas pegadas, de PDF o de fotos. Si vienen los dos equipos (cada uno con su fila de títulos),
   se queda con el bloque que más coincide con el plantel. */
function parseStatsText(txt,fmt){
  const lines=String(txt).replace(/\r/g,'').replace(/[­–−]/g,'-').split('\n').map(l=>l.replace(/\t/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  let order=fmt?fmtToOrder(fmt):STATS.map(s=>s[0]);let header=null;let htoks=fmt?hdrToks(fmt):[];
  const blocks=[{rows:[],tot:null,team:''}];let lastTitle='';
  lines.forEach(line=>{
    const toks=line.split(' ');
    if(/^entrenador/i.test(line))return;
    if(/^\d+\s*[°º]\s*\S/.test(line)&&!/\bvs\b/i.test(line)&&toks.filter(isNumTok).length<2){lastTitle=line.replace(/^\d+\s*[°º]\s*/,'').trim();return;}
    const keys=toks.map(hdrKey);
    if(keys.filter(Boolean).length>=3&&(keys.includes('min')||keys.includes('pts'))&&toks.filter(isNumTok).length<2){
      header=toks.filter(t=>t!=='#'&&!NAME_HDR.includes(normTxt(t))).join(' ');
      order=fmtToOrder(header);htoks=hdrToks(header);
      if(blocks[blocks.length-1].rows.length)blocks.push({rows:[],tot:null,team:lastTitle});else blocks[blocks.length-1].team=lastTitle;
      return;
    }
    let i=0,dorsal=null;
    if(/^\d{1,3}$/.test(toks[0])&&toks.length>2&&!isNumTok(toks[1])){dorsal=toks[0];i=1;}
    const nameT=[];while(i<toks.length&&!isNumTok(toks[i])){nameT.push(toks[i]);i++;}
    const nums=toks.slice(i).map(fixNum);
    if(!nameT.length||nums.filter(isNumTok).length<3)return;
    const nm=nameT.join(' ').replace(/^\*/,'').replace(/\s*\((cap|c)\)\s*/i,' ').trim();
    const st={};nums.forEach((v,k)=>{const key=order[k];if(!key||key[0]==='_')return;
      if(key==='min'){const m=parseMin(v);if(m!=null)st.min=m;}
      else{const n=Number(String(v).replace(',','.'));if(!isNaN(n))st[key]=n;}});
    if(st.val!=null){const cv=cabbVal(htoks,nums);if(cv!=null&&Math.abs(cv)===Math.abs(st.val))st.val=cv;}
    if(/^(total|totales|equipo|team)$/i.test(normTxt(nm))){blocks[blocks.length-1].tot=st;return;}
    const inf={};const j=matchPlayer(dorsal,nm,inf);
    blocks[blocks.length-1].rows.push({raw:line,dorsal,nombre:nm,jid:j?j.id:null,st});
  });
  const teams=blocks.filter(b=>b.rows.length);
  teams.forEach(b=>{b.score=b.rows.filter(r=>r.jid).length;});
  /* tu equipo = el que tiene más nombres reconocidos (nunca el orden en la planilla) */
  let bi=0;teams.forEach((b,i)=>{if(b.score>teams[bi].score)bi=i;});
  const best=teams[bi]||{rows:[],tot:null};const other=teams.find(b=>b!==best&&b.tot);
  const tie=teams.length>1&&teams.filter(b=>b.score===best.score).length>1;
  return {rows:best.rows,header,tot:best.tot,rivalTot:other?other.tot:null,teams,chosen:bi,tie};
}
/* PDF con texto (actas CABB / Gesdeportiva): se reconstruyen las filas por posición */
let pdfLib=null;
function loadPDF(){
  if(pdfLib)return pdfLib;
  pdfLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};
    sc.onerror=()=>{pdfLib=null;rej(new Error('no se pudo cargar el lector de PDF'));};document.head.appendChild(sc);});
  return pdfLib;
}
async function pdfToText(file){
  const L=await loadPDF();const doc=await L.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let pn=1;pn<=doc.numPages;pn++){
    const pg=await doc.getPage(pn);const tc=await pg.getTextContent();
    const rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r);}r.items.push({x,s:it.str.trim()});});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')));
  }
  return out.join('\n');
}

}
async function ocrImage(file,onProg){
  const T=await loadOCR();

  return r.data.text;
}

    const saveFmt=f=>{f=f.trim();q('stFmt').value=f;const cur=(S.cfg.find(x=>x.id==='stfmt')||{}).cols||'';if(f&&f!==cur){Store.put('config','stfmt',{cols:f});const i=S.cfg.findIndex(x=>x.id==='stfmt');if(i>=0)S.cfg[i]={id:'stfmt',cols:f};else S.cfg.push({id:'stfmt',cols:f});}};
    q('stFmt').onchange=()=>saveFmt(q('stFmt').value);

    const useTeam=i=>{

      fill(t.rows);

        box.insertAdjacentHTML('afterbegin','<div class="team-pick"><span class="tiny">La planilla trae los dos equipos. '+(r.tie?'<b class="warn-t">No pude distinguir cuál es el tuyo: elegilo.</b>':'Tomé el que más coincide con tu plantel:')+'</span><div class="rut-acts">'+
          r.teams.map((x,k)=>'<button type="button" class="btn sm'+(k===i?' pri':'')+'" data-team="'+k+'">'+esc(x.team||('Equipo '+(k+1)))+' · '+x.score+'/'+x.rows.length+' reconocidos</button>').join('')+'</div></div>');
      }
      detRes=null;
      if(t.tot&&t.tot.pts!=null&&o&&o.tot&&o.tot.pts!=null){
        detRes={gf:t.tot.pts,gc:o.tot.pts};
        const had=!(p.gf===''||p.gf==null);const same=had&&String(p.gf)===String(detRes.gf)&&String(p.gc)===String(detRes.gc);
        box.insertAdjacentHTML('beforeend','<p class="tiny" style="margin:6px 0 0">Resultado según la planilla: <b>'+detRes.gf+' – '+detRes.gc+'</b>'+(same?' (igual al guardado).':' <label class="check" style="display:inline-flex"><input type="checkbox" id="stRes" checked> '+(had?'reemplazar el guardado ('+esc(p.gf)+' – '+esc(p.gc)+')':'cargarlo en el partido')+'</label>')+'</p>');
      }
    };
    const runParse=txt=>{const r=parseStatsText(txt,q('stFmt').value);if(r.header)saveFmt(r.header);if(!r.rows.length){toast('No encontré filas de '+jugW(1)+' en el texto');return false;}
      lastParse=r;useTeam(r.chosen||0);return true;};
    q('stParseRes').addEventListener('click',e=>{const b=e.target.closest('[data-team]');if(b&&lastParse)useTeam(+b.dataset.team);});
    q('stParse').onclick=()=>runParse(q('stPaste').value);
    q('stImg').onchange=async e=>{
      const f=e.target.files[0];e.target.value='';if(!f)return;
      q('stPasteBox').hidden=false;const msg=q('stOcrMsg');
      if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){
        msg.textContent='Leyendo el PDF…';
        try{const txt=await pdfToText(f);q('stPaste').value=txt;msg.textContent='Listo: leí el PDF. Revisá los números antes de guardar.';runParse(txt);}
        catch(err){msg.textContent='No pude leer el PDF ('+(err.message||'error')+'). Probá copiando el texto del PDF y pegándolo acá.';}
        return;
      }
      msg.textContent='Leyendo la foto… (la primera vez tarda un poco más)';
      try{const txt=await ocrImage(f,p=>{msg.textContent='Leyendo la foto… '+p+'%';});
        q('stPaste').value=txt;msg.textContent='Listo. Esto es lo que leí: corregí lo que haga falta y tocá “Completar la planilla”.';
        runParse(txt);
      }catch(err){msg.textContent='No pude leer la foto ('+(err.message||'error')+'). Probá pegando el texto o cargando a mano.';}
    };
