function recClass(min,cfg){if(min==null)return 'nc';if(min<=0)return 'nj';if(min>cfg.reg)return 'reg';if(min>=cfg.comp)return 'ask';return 'comp';}

/* ---------- leer texto de una planilla (pegado o de una foto) ---------- */
const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();
/* Reconoce por NOMBRE. Los dos equipos usan los mismos dorsales, así que el dorsal nunca alcanza solo:
   solo desempata o confirma una coincidencia débil (un único nombre en común). */
function matchPlayer(dorsal,name,info){
  const raw=String(name||'');const comma=raw.indexOf(',');
  const nt=normTxt(raw).split(' ').filter(w=>w.length>1);if(!nt.length)return null;
  const sur=comma>0?normTxt(raw.slice(0,comma)).split(' ').filter(w=>w.length>1):[];
  const cands=S.jug.map(j=>{
    const jt=normTxt(j.nombre).split(' ').filter(w=>w.length>1);
    const shared=nt.filter(w=>jt.includes(w));
    const pref=nt.filter(w=>!jt.includes(w)&&jt.some(x=>x.length>3&&w.length>3&&(x.startsWith(w)||w.startsWith(x)))).length;
    const dOk=dorsal!=null&&String(j.dorsal||'').trim()!==''&&String(j.dorsal).trim()===String(dorsal);
    let lvl=0;
    if(shared.length+pref>=2)lvl=3;                                  /* fuerte: dos partes del nombre */
    else if(shared.length===1&&sur.includes(shared[0]))lvl=2;         /* el apellido de la planilla */
    else if(shared.length===1&&dOk)lvl=2;                             /* un nombre + mismo dorsal */
    return {j,lvl,sc:shared.length*2+pref+(dOk?0.5:0)};
  }).filter(c=>c.lvl>=2).sort((a,b)=>b.lvl-a.lvl||b.sc-a.sc);
  if(!cands.length)return null;
  if(cands.length>1&&cands[0].lvl===cands[1].lvl&&cands[0].sc===cands[1].sc)return null; /* empate: mejor no adivinar */
  if(info)info.lvl=cands[0].lvl;
  return cands[0].j;
}
const isNumTok=t=>/^[-+]?\d+(?:[.,]\d+)?%?$|^\d{1,3}:\d{2}$|^\d+\/\d+$|^\d+-\d+$/.test(t);
const NAME_HDR=['n','nro','no','num','jugador','jugadora','nombre','dorsal','apellido'];
const isPM=t=>/^\+\/[-­–−]$/.test(t);
const hdrKey=t=>isPM(t)?null:(Object.keys(ST_ALIAS).find(k=>ST_ALIAS[k].includes(normTxt(t)))||null);
const hdrToks=f=>String(f||'').split(/[\s,;|]+/).filter(t=>t&&t!=='#'&&!NAME_HDR.includes(normTxt(t)));
/* si dos columnas se parecen al mismo dato (ej. "Tot." y "TR"), vale la primera */
function fmtToOrder(f){const used={};return hdrToks(f).map((t,i)=>{const k=hdrKey(t);if(!k||used[k])return '_'+i;used[k]=1;return k;});}
/* Actas CABB: el PDF pierde el signo menos; la valoración se recalcula con sus componentes para recuperar el signo */
function cabbVal(toks,nums){
  const T=toks.map(t=>t.toLowerCase().replace(/\.$/,''));const ai=[];T.forEach((t,i)=>{if(t==='a/i')ai.push(i);});
  const ix=n=>T.indexOf(n);const need=['pts','tot','ast','rec','per','tc','tr','fc','fr','val'];
  if(ai.length!==3||need.some(n=>ix(n)<0))return null;
  const N=i=>Number(nums[i])||0;const miss=i=>{const m=String(nums[i]||'').match(/^(\d+)\/(\d+)$/);return m?(+m[2])-(+m[1]):0;};
  return N(ix('pts'))+N(ix('tot'))+N(ix('ast'))+N(ix('rec'))+N(ix('tc'))+N(ix('fr'))-miss(ai[0])-miss(ai[1])-miss(ai[2])-N(ix('per'))-N(ix('tr'))-N(ix('fc'));
}
/* lo que una foto suele confundir: "o" por 0, "l"/"I" por 1 */
const fixNum=t=>/^[0-9oOlI|:\/.,+\-]+$/.test(t)&&/[0-9]/.test(t)||/^[oO]$/.test(t)?t.replace(/[oO]/g,'0').replace(/[lI|]/g,'1'):t;
/* Lee planillas pegadas, de PDF o de fotos. Si vienen los dos equipos (cada uno con su fila de títulos),
   se queda con el bloque que más coincide con el plantel. */
function parseStatsText(txt,fmt){
  const lines=String(txt).replace(/\r/g,'').replace(/[­–−]/g,'-').split('\n').map(l=>l.replace(/\t/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  let order=fmt?fmtToOrder(fmt):STATS.map(s=>s[0]);let header=null;let htoks=fmt?hdrToks(fmt):[];
  const blocks=[{rows:[],tot:null,team:''}];let lastTitle='';
  lines.forEach(line=>{
    const toks=line.split(' ');
    if(/^entrenador/i.test(line))return;
    if(/^\d+\s*[°º]\s*\S/.test(line)&&!/\bvs\b/i.test(line)&&toks.filter(isNumTok).length<2){lastTitle=line.replace(/^\d+\s*[°º]\s*/,'').trim();return;}
    const keys=toks.map(hdrKey);
    if(keys.filter(Boolean).length>=3&&(keys.includes('min')||keys.includes('pts'))&&toks.filter(isNumTok).length<2){
      header=toks.filter(t=>t!=='#'&&!NAME_HDR.includes(normTxt(t))).join(' ');
      order=fmtToOrder(header);htoks=hdrToks(header);
      if(blocks[blocks.length-1].rows.length)blocks.push({rows:[],tot:null,team:lastTitle});else blocks[blocks.length-1].team=lastTitle;
      return;
    }
    let i=0,dorsal=null;
    if(/^\d{1,3}$/.test(toks[0])&&toks.length>2&&!isNumTok(toks[1])){dorsal=toks[0];i=1;}
    const nameT=[];while(i<toks.length&&!isNumTok(toks[i])){nameT.push(toks[i]);i++;}
    const nums=toks.slice(i).map(fixNum);
    if(!nameT.length||nums.filter(isNumTok).length<3)return;
    const nm=nameT.join(' ').replace(/^\*/,'').replace(/\s*\((cap|c)\)\s*/i,' ').trim();
    const st={};nums.forEach((v,k)=>{const key=order[k];if(!key||key[0]==='_')return;
      if(key==='min'){const m=parseMin(v);if(m!=null)st.min=m;}
      else{const n=Number(String(v).replace(',','.'));if(!isNaN(n))st[key]=n;}});
    if(st.val!=null){const cv=cabbVal(htoks,nums);if(cv!=null&&Math.abs(cv)===Math.abs(st.val))st.val=cv;}
    if(/^(total|totales|equipo|team)$/i.test(normTxt(nm))){blocks[blocks.length-1].tot=st;return;}
    const inf={};const j=matchPlayer(dorsal,nm,inf);
    blocks[blocks.length-1].rows.push({raw:line,dorsal,nombre:nm,jid:j?j.id:null,st});
  });
  const teams=blocks.filter(b=>b.rows.length);
  teams.forEach(b=>{b.score=b.rows.filter(r=>r.jid).length;});
  /* tu equipo = el que tiene más nombres reconocidos (nunca el orden en la planilla) */
  let bi=0;teams.forEach((b,i)=>{if(b.score>teams[bi].score)bi=i;});
  const best=teams[bi]||{rows:[],tot:null};const other=teams.find(b=>b!==best&&b.tot);
  const tie=teams.length>1&&teams.filter(b=>b.score===best.score).length>1;
  return {rows:best.rows,header,tot:best.tot,rivalTot:other?other.tot:null,teams,chosen:bi,tie};
}
/* PDF con texto (actas CABB / Gesdeportiva): se reconstruyen las filas por posición */
let pdfLib=null;
function loadPDF(){
  if(pdfLib)return pdfLib;
  pdfLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};
    sc.onerror=()=>{pdfLib=null;rej(new Error('no se pudo cargar el lector de PDF'));};document.head.appendChild(sc);});
  return pdfLib;
}
async function pdfToText(file){
  const L=await loadPDF();const doc=await L.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let pn=1;pn<=doc.numPages;pn++){
    const pg=await doc.getPage(pn);const tc=await pg.getTextContent();
    const rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r);}r.items.push({x,s:it.str.trim()});});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')));
  }
  return out.join('\n');
}

/* ---------- foto: lectura automática (OCR) ---------- */
let ocrLib=null;
function loadOCR(){
  if(ocrLib)return ocrLib;
  ocrLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=()=>res(window.Tesseract);sc.onerror=()=>{ocrLib=null;rej(new Error('no se pudo cargar'));};document.head.appendChild(sc);});
  return ocrLib;
}
async function ocrImage(file,onProg){
  const T=await loadOCR();
  const r=await T.recognize(file,'spa',{logger:m=>{if(m.status==='recognizing text'&&onProg)onProg(Math.round(m.progress*100));}});
  return r.data.text;
}

    /* el promedio de cada dato se hace sobre los partidos donde ese dato está cargado */
    const tot={},avg={};STATS.forEach(([k])=>{const vs=g.filter(x=>x[k]!=null).map(x=>+x[k]);tot[k]=vs.reduce((t,v)=>t+v,0);avg[k]=vs.length?tot[k]/vs.length:null;});
    return {j,pj:g.length,ent:g.filter(x=>x.min>0).length,tot,avg};
  });
  const key=S.stSort||'min';
  rows.sort((a,b)=>key==='pj'?b.pj-a.pj:key==='ent'?b.ent-a.ent:((mode==='tot'?b.tot[key]:b.avg[key])??-1)-((mode==='tot'?a.tot[key]:a.avg[key])??-1));
  const val=(r,k)=>{if(!r.pj)return '<span class="tiny">–</span>';const v=mode==='tot'?r.tot[k]:r.avg[k];if(v==null)return '<span class="tiny">–</span>';return k==='min'?fmtMin(v):fmtN(Math.round(v*10)/10);};
  h+='<div class="tbl-wrap"><table><thead><tr><th>Jugador</th><th class="r"><button class="linkish" data-stsort="pj">PJ</button></th><th class="r"><button class="linkish" data-stsort="ent">Entró</button></th>'+STATS.map(([k,l])=>'<th class="r"><button class="linkish'+(key===k?' on':'')+'" data-stsort="'+k+'">'+l+(key===k?' ↓':'')+'</button></th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.j.nombre)+'</td><td class="r mono">'+r.pj+'</td><td class="r mono">'+r.ent+'</td>'+STATS.map(([k])=>'<td class="r mono'+(k==='min'?' st-min':'')+'">'+val(r,k)+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div><p class="tiny" style="margin-top:6px">PJ = partidos convocado (incluye los que estuvo en el banco con 0 minutos) · Entró = partidos en los que jugó minutos. '+(mode==='prom'?'Promedios por partido convocado.':'Totales de la temporada.')+' Tocá un título para ordenar.</p>';
  h+='<h3 style="margin-top:18px">Partidos</h3><div class="match-list">'+games.slice().reverse().map(p=>'<button class="match" data-stats="'+esc(p.id)+'" style="text-align:left;color:inherit;font:inherit"><div class="when"><div class="d">'+pISO(p.fecha).getDate()+'</div><div class="m">'+esc(pISO(p.fecha).toLocaleDateString('es-AR',{month:'short'}))+'</div></div><div><div class="vs">vs '+esc(p.rival)+'</div><div class="tiny">'+Object.keys(p.stats).length+' '+jugW(1)+' con datos</div></div><div class="right">'+postSummary(p)+'</div></button>').join('')+'</div>';
  return h;
}

  return h;

const idT=id=>{const n=parseInt(String(id||'').slice(0,8),36);return n>1.5e12&&n<4e12?n:0;};
function avList(){
  const AV=avState();const out=[];const lim=Date.now()-45*864e5;
  (S.pAtl||[]).forEach(d=>{if(AV.desc[d.id])return;const nm=d.nombre||'Un alumno';
    const ta=d.alta||d.upd||0;if(ta>lim)out.push({id:'reg|'+d.id,t:ta,ic:'👋',txt:'<b>'+esc(nm)+'</b> se registró en la app',did:d.id});
    const G={};Object.keys(d.log||{}).forEach(x=>(d.log[x]||[]).forEach(e=>{if(!e||!e.f)return;const k=e.f+'|'+(e.a||'');(G[k]=G[k]||{f:e.f,rn:e.rn||'',n:0,t:0,ex:new Set()}).n++;G[k].ex.add(x);G[k].t=Math.max(G[k].t,idT(e.id)||pISO(e.f).getTime()+12*36e5);}));
    Object.keys(G).forEach(k=>{const g=G[k];if(g.t<lim)return;out.push({id:'pes|'+d.id+'|'+k,t:g.t,ic:'🏋️',txt:'<b>'+esc(nm)+'</b> anotó '+g.n+(g.n===1?' peso':' pesos')+(g.rn?' en <b>'+esc(g.rn)+'</b>':''),sub:fmtD(g.f,{weekday:'long',day:'numeric',month:'short'})+' · '+[...g.ex].slice(0,3).join(', ')+(g.ex.size>3?'…':''),did:d.id});});
    (d.mol||[]).forEach(m=>{if((m.t||0)<lim)return;out.push({id:'mol|'+d.id+'|'+m.id,t:m.t,ic:'🤕',alert:true,txt:'<b>'+esc(nm)+'</b> avisó una molestia'+(m.zona?': <b>'+esc(m.zona.toLowerCase())+(m.lado&&m.lado!=='No aplica'?' '+esc(m.lado.toLowerCase()):'')+'</b>':' en <b>'+esc(m.ej||'un ejercicio')+'</b>')+(m.int?' ('+m.int+'/10)':''),sub:[m.zona?m.ej:'',m.rn].filter(Boolean).join(' · ')+(m.txt?' · “'+m.txt+'”':''),did:d.id});});
    const F=d.ficha;if(F&&F.upd&&F.upd>lim){const al=Object.keys(F.q||{}).some(k=>F.q[k].v==='si')||(F.les||[]).some(l=>l.mol==='Sí');

  });
  return out.sort((a,b)=>b.t-a.t);

  if(x.multi&&x.multi.length>1)return x.multi.map((m,i)=>({n:SSL(i),hora:m.hora||'',jug:m.jug||[],content:m}));
  if(x.src==='rut'&&x.trab&&x.asig&&x.rut){const fe=f||x._f;const all=rutDays(x.rut);const w=fe?weekIdx(x.asig,fe):0;const wdx=fe?wdOf(fe):null;const out=[];
    (x.asig.horario||[]).forEach((h,i)=>{if(h&&h.d===wdx&&all[i])out.push({n:SSL(out.length),dn:all[i].nombre||'',hora:h.hora||'',jug:h.jug||[],content:resolveDay(all[i],w)});});
    return out.length>1?out:null;}

const TOMORROW=addDays(TODAY,1);
/* qué entrena cada categoría en la fecha f: sesiones sueltas + rutinas asignadas + partidos */
function agendaFor(f){
  const ses=f===TODAY?S.sesHoy:S.sesMan,par=f===TODAY?S.parHoy:S.parMan;
  const wd=wdOf(f);const out=[];
  S.cats.forEach(c=>{
    const conc=ses.filter(s=>s.cat===c.id&&s.fecha===f);
    conc.forEach(s=>{const r=s.rutina?rutById(s.rutina):null;
      out.push({cat:c,tipo:s.tipo,hora:s.hora||'',susp:!!s.suspendida,txt:s.objetivo||(s.rutDia?s.rutDia+' · ':'')+(r?r.nombre:'')});});
    S.asigAll.forEach(a=>{
      if(a.cat!==c.id||!rutActive(a,f))return;const r=rutById(a.rutina);if(!r)return;
      const on=rutDayOn(a,r,wd);if(!on)return;const dd=on.dd;
      if(conc.some(s=>s.tipo===r.tipo&&(s.rutina===r.id||!s.rutina)))return;
      out.push({cat:c,tipo:r.tipo,hora:on.hora,txt:(dd.nombre||'')+' · '+r.nombre});
    });
    par.filter(p=>p.cat===c.id&&p.fecha===f).forEach(p=>out.push({cat:c,tipo:'match',hora:p.hora||'',txt:'vs '+(p.rival||'')+(p.condicion?' · '+p.condicion:'')}));
  });
  return out.sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99')||(a.cat.orden||0)-(b.cat.orden||0));
}

function vidUrl(u){u=String(u||'').trim();return (/^https?:\/\//i.test(u)||!/^(videos\/|\.\/|\/)/.test(u))?fixUrl(u):u;}
function vidInfo(u){
  u=String(u||'').trim();let m;
  /* YouTube: en bucle, sin sonido y SIN botones encima (tocar = pausa) */
  const yt=(id,vert)=>({yt:id,src:'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&controls=0&loop=1&playlist='+id+'&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1',thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg',vert:!!vert});
  if((m=u.match(/youtube\.com\/shorts\/([\w-]{6,})/)))return yt(m[1],true);
  if((m=u.match(/youtu\.be\/([\w-]{6,})/)||u.match(/[?&]v=([\w-]{6,})/)||u.match(/youtube\.com\/(?:embed|live)\/([\w-]{6,})/)))return yt(m[1],false);
  /* archivo de video directo (por ej. subido a la app): reproductor propio, sin botones */
  if(/\.(mp4|m4v|mov|webm)(\?|#|$)/i.test(u))return {file:u};
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/open\?id=([\w-]+)/)))return {src:'https://drive.google.com/file/d/'+m[1]+'/preview',thumb:'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w320',vert:true,probe:true};
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return {src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1&muted=1&loop=1&controls=0&playsinline=1'};
  if((m=u.match(/instagram\.com\/(?:p|reel|reels|tv)\/([\w-]+)/)))return {src:'https://www.instagram.com/p/'+m[1]+'/embed',vert:true};
  return null;
}

function ejPut(id,patch){
  const cur=S.lib.find(x=>x.id===id)||{};const d=Object.assign({},cur,patch);delete d.id;
  Object.keys(d).forEach(k=>{if(d[k]===null)delete d[k];});
  const i=S.lib.findIndex(x=>x.id===id);if(i>=0)S.lib[i]=Object.assign({id},d);else S.lib.push(Object.assign({id},d));
  EJC.t=0;
  return Store.put('ejercicios',id,d);
}
/* fotos: van aparte (colección ejImg) y se bajan recién cuando abrís la biblioteca, así la app arranca igual de rápido */
const EJIMG={on:false,m:{}};
function ejImgStart(){if(EJIMG.on)return;EJIMG.on=true;
  Store.watch('ejImg',null,null,a=>{const m={};a.forEach(x=>{if(x.d)m[x.id]=x.d;});EJIMG.m=m;
    if(S.view==='ejs')render();if(EJP.box)EJP.draw();});}
function ejThumb(e,cls){
  const own=EJIMG.m[e.id];const v=e.link?vidInfo(e.link):null;const src=own||(v&&v.thumb)||'';
  if(src)return '<span class="'+(cls||'ej-th')+'"><img alt="" loading="lazy" src="'+esc(src)+'">'+(!own&&v?'<i class="ej-vb">▶</i>':'')+'</span>';
  const ini=e.nombre.split(/\s+/).filter(w=>w.length>2||/^\d/.test(w)).slice(0,2).map(w=>w[0]).join('')||e.nombre.slice(0,2);
  return '<span class="'+(cls||'ej-th')+' ej-ini" style="--rc:'+(ROLC[e.rol]||ROLC.x)+'">'+esc(ini)+'</span>';
}
/* achica la foto a 360 px (pesa ~15-30 KB) para guardarla gratis */
function ejShrink(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{
    const M=360;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>90000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q);}res(d);};im.src=fr.result;};fr.readAsDataURL(file);});}

/* filtros (los usa la biblioteca y el panel del editor) */
function ejFilter(list,f){
  const q=normTxt(f.q||'');
  return list.filter(e=>(!q||normTxt(e.nombre).includes(q))&&(!f.rol||e.rol===f.rol)&&(!f.pat||e.pat===f.pat)&&(!f.impl||(e.impl||[]).includes(f.impl))&&(!f.sin||e.auto));
}
const rolBadge=(r,auto)=>r?'<i class="rol-b'+(auto?' auto':'')+'" style="--rc:'+ROLC[r]+'">'+esc(ROL[r])+'</i>':'';
function ejFiltersHtml(f,list){
  const cnt=k=>list.filter(e=>e.rol===k).length;
  return '<div class="ej-filt"><input class="inp ej-q" data-ejq placeholder="Buscar ejercicio…" value="'+esc(f.q||'')+'" autocomplete="off">'+
    '<div class="ej-chips"><button type="button" class="ej-chip'+(!f.rol?' on':'')+'" data-ejr="">Todo</button>'+ROLS.map(r=>'<button type="button" class="ej-chip rc'+(f.rol===r?' on':'')+'" style="--rc:'+ROLC[r]+'" data-ejr="'+r+'">'+ROL[r]+' <small>'+cnt(r)+'</small></button>').join('')+'</div>'+
    '<div class="ej-sels"><select class="inp" data-ejp aria-label="Patrón"><option value="">Patrón: todos</option>'+PATS.map(p=>'<option value="'+p[0]+'"'+(f.pat===p[0]?' selected':'')+'>'+esc(p[1])+'</option>').join('')+'</select>'+
    '<select class="inp" data-eji aria-label="Implemento"><option value="">Implemento: todos</option>'+EJ_IMPL.map(t=>'<option'+(f.impl===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'+
    ((f.q||f.rol||f.pat||f.impl||f.sin)?'<button type="button" class="btn sm ghost" data-ejclr>Limpiar filtros</button>':'')+'</div></div>';
}
/* un mismo manejador de filtros para la vista y el panel */
function ejFiltEvents(root,f,redraw){
  root.addEventListener('input',e=>{if(e.target.matches('[data-ejq]')){f.q=e.target.value;redraw(true);}});
  root.addEventListener('change',e=>{if(e.target.matches('[data-ejp]')){f.pat=e.target.value;redraw();}if(e.target.matches('[data-eji]')){f.impl=e.target.value;redraw();}});
  root.addEventListener('click',e=>{const z=e.target.closest('[data-ejr]');if(z){f.rol=z.dataset.ejr;redraw();return;}
    if(e.target.closest('[data-ejclr]')){f.q='';f.rol='';f.pat='';f.impl='';f.sin=false;redraw();return;}
    if(e.target.closest('[data-ejsin]')){f.sin=!f.sin;redraw();}});
}

/* ficha del ejercicio */
function openEj(id,onSaved){
  const e0=id?ejAll(true).find(x=>x.id===id):null;
  const e=e0?Object.assign({},e0):{id:'',nombre:'',link:'',impl:[],rol:'',pat:'',uni:false};
  const auto=!!(e0&&e0.auto);
  const st={rol:e.rol||'',pat:e.pat||'',uni:!!e.uni,impl:(e.impl||[]).slice(),img:EJIMG.m[e.id]||'',imgCh:false,prep:prepOf(e).slice(),prepCh:false};
  const chip=(attr,v,on,txt,col)=>'<button type="button" class="ej-chip'+(col?' rc':'')+(on?' on':'')+'"'+(col?' style="--rc:'+col+'"':'')+' '+attr+'="'+esc(v)+'">'+esc(txt)+'</button>';
  const draw=()=>{
    const th=st.img?'<img alt="" src="'+esc(st.img)+'">':(e.link&&vidInfo(e.link)&&vidInfo(e.link).thumb?'<img alt="" src="'+esc(vidInfo(e.link).thumb)+'"><small>portada del video</small>':'<span>Sin foto</span>');
    return '<div class="ej-ficha"><div class="ej-ph">'+th+'</div><div class="ej-phb">'+
      (RO?'':'<label class="btn sm">'+(st.img?'Cambiar foto':'Subir foto')+'<input type="file" accept="image/*" id="ej_f" hidden></label>'+(st.img?'<button type="button" class="btn sm ghost" id="ej_fx">Quitar foto</button>':''))+
      (e.link?'<button type="button" class="btn sm" data-vplay="'+esc(fixUrl(e.link))+'">'+(/musclewiki\.com/i.test(e.link)?'Ver en MuscleWiki ↗':'▶ Ver video')+'</button>':'')+'</div></div>'+
      '<div class="ej-nr"><div class="field"><label for="ej_n">Nombre</label><input id="ej_n" value="'+esc(e.nombre)+'" placeholder="Ej: SENTADILLA TRASERA" style="text-transform:uppercase"></div>'+
      '<div class="field"><label for="ej_o">Observaciones <small class="tiny">(opcional)</small></label><input id="ej_o" value="'+esc(e.obs||'')+'" placeholder="Ej: control al bajar, pausa abajo…"></div></div>'+
      '<p class="tiny" style="margin:-6px 0 0">La observación se copia sola cuando sumás este ejercicio a una rutina (después la podés cambiar ahí).</p>'+
      '<div class="field"><label for="ej_l">Link de video (YouTube o Drive)</label><input id="ej_l" type="url" inputmode="url" value="'+esc(e.link||'')+'" placeholder="Pegá el link"></div>'+
      (auto?'<p class="tiny ej-sug">Estas etiquetas las puso la app según el nombre. Revisalas y tocá Guardar.</p>':'')+
      '<div class="field"><label>Rol en la sesión</label><div class="ej-chips">'+ROLS.map(r=>chip('data-fr',r,st.rol===r,ROL[r],ROLC[r])).join('')+'</div></div>'+
      '<div class="field"><label>Patrón de movimiento</label><div class="ej-chips">'+PATS.map(p=>chip('data-fp',p[0],st.pat===p[0],p[1])).join('')+chip('data-fu','1',st.uni,'Unilateral / a una pierna')+'</div></div>'+
      (['m','p','k'].includes(st.rol)?'<div class="field"><label>Prepara para <small class="tiny">(en un bloque de movilidad/activación se sugiere cuando el día tiene estos patrones)</small></label><div class="ej-chips">'+PREP_OPTS.map(p=>chip('data-fprep',p[0],st.prep.includes(p[0]),p[1])).join('')+'</div></div>':'')+
      '<div class="field"><label>Implemento <small class="tiny">(podés marcar varios)</small></label><div class="ej-chips">'+EJ_IMPL.map(t=>chip('data-fi',t,st.impl.includes(t),t)).join('')+'</div></div>'+
      (e.uso?'<p class="tiny">Está en '+e.uso+(e.uso===1?' rutina.':' rutinas.')+'</p>':'');
  };
  const foot='<div class="modal-f">'+(e0&&!RO?'<button class="btn danger" id="ej_del">Sacar de la biblioteca</button>':'')+'<div class="grow"></div><button class="btn" data-close>Cancelar</button>'+(RO?'':'<button class="btn pri" id="ej_save">Guardar</button>')+'</div>';
  openModal(modalHead('Biblioteca de ejercicios',e0?e.nombre:'Nuevo ejercicio')+'<div class="modal-b" id="ej_b">'+draw()+'</div>'+foot,mw=>{
    const body=mw.querySelector('#ej_b');
    const keep=()=>{e.nombre=body.querySelector('#ej_n').value;e.link=body.querySelector('#ej_l').value;e.obs=body.querySelector('#ej_o').value;};
    const redraw=()=>{keep();body.innerHTML=draw();};
    body.addEventListener('click',ev=>{const t=ev.target;
      const r=t.closest('[data-fr]');if(r){st.rol=st.rol===r.dataset.fr?'':r.dataset.fr;return redraw();}
      const p=t.closest('[data-fp]');if(p){st.pat=st.pat===p.dataset.fp?'':p.dataset.fp;if(!st.prepCh)st.prep=(PREP[st.pat]||[]).slice();return redraw();}
      if(t.closest('[data-fu]')){st.uni=!st.uni;return redraw();}
      const pp=t.closest('[data-fprep]');if(pp){const v=pp.dataset.fprep;st.prep=st.prep.includes(v)?st.prep.filter(x=>x!==v):st.prep.concat(v);st.prepCh=true;return redraw();}
      const im=t.closest('[data-fi]');if(im){const v=im.dataset.fi;st.impl=st.impl.includes(v)?st.impl.filter(x=>x!==v):st.impl.concat(v);return redraw();}
      if(t.closest('#ej_fx')){st.img='';st.imgCh=true;return redraw();}
    });
    body.addEventListener('change',async ev=>{if(ev.target.id!=='ej_f')return;const fl=ev.target.files&&ev.target.files[0];if(!fl)return;
      try{st.img=await ejShrink(fl);st.imgCh=true;redraw();}catch(err){toast('No pude leer esa imagen');}});
    body.addEventListener('input',ev=>{if(ev.target.id==='ej_l'){keep();}});
    body.addEventListener('focusout',ev=>{if(ev.target.id==='ej_l')redraw();});
    if(RO)body.querySelectorAll('input').forEach(i=>i.disabled=true);
    const del=mw.querySelector('#ej_del');if(del)armDelete(del,()=>{ejPut(e.id,{nombre:e.nombre,oculto:true});closeModal();ejRedrawView();toast('Lo saqué de la biblioteca (las rutinas no cambian)');});
    const sv=mw.querySelector('#ej_save');if(sv)sv.onclick=()=>{
      keep();const n=e.nombre.trim().replace(/\s+/g,' ').toLocaleUpperCase('es');if(!n){toast('Poné el nombre');return;}
      let nid=e.id||slug(n);
      /* si le cambiaste el nombre, queda como ejercicio nuevo y el viejo se oculta */
      if(e0&&slug(n)!==e.id){nid=slug(n);ejPut(e.id,{oculto:true});if(EJIMG.m[e.id]&&!st.imgCh){st.imgCh=true;}}
      ejPut(nid,{nombre:n,link:e.link.trim(),obs:String(e.obs||'').trim()||null,rol:st.rol,pat:st.pat,uni:st.uni,impl:st.impl,prep:(st.prepCh&&['m','p','k'].includes(st.rol))?st.prep:(e.prep||null),oculto:false,foto:!!st.img,zona:null,tipo:null});
      if(st.imgCh){if(st.img){EJIMG.m[nid]=st.img;Store.put('ejImg',nid,{d:st.img});}else{delete EJIMG.m[nid];Store.remove('ejImg',nid);}}
      closeModal();ejRedrawView();if(EJP.box)EJP.draw();toast('Ejercicio guardado');if(onSaved)onSaved(nid);
    };
  });
}

/* ---------- panel de la biblioteca adentro del editor: tocás y se agrega al bloque ---------- */
const EJP={box:null,f:{q:'',rol:'',pat:'',impl:'',sin:false},blk:null,
  blocks(){const mw=$('#mw');return mw?[...mw.querySelectorAll('#blocks .blk')]:[];},
  open(){const mw=$('#mw');if(!mw)return;ejImgStart();this.close();
    const bs=this.blocks();if(!this.blk||!bs.includes(this.blk))this.blk=bs[bs.length-1]||null;
    const box=document.createElement('aside');box.className='ejp';box.setAttribute('aria-label','Biblioteca de ejercicios');
    box.innerHTML='<div class="ejp-h"><b>Biblioteca</b><span class="grow"></span><button type="button" class="x" data-ejpx aria-label="Cerrar">×</button></div><div class="ejp-to"></div><div class="ejp-f"></div><div class="ejp-l"></div>';
    mw.appendChild(box);this.box=box;document.body.classList.add('ejp-on');
    ejFiltEvents(box,this.f,k=>this.draw(k));
    box.addEventListener('click',e=>{
      if(e.target.closest('[data-ejpx]'))return this.close();
      const a=e.target.closest('[data-ejadd]');if(a)return this.add(a.dataset.ejadd);
    });
    box.addEventListener('change',e=>{if(e.target.matches('[data-ejpto]')){this.blk=this.blocks()[+e.target.value]||null;}});
    this.draw();},
  close(){if(this.box)this.box.remove();this.box=null;document.body.classList.remove('ejp-on');},
  draw(keepFocus){if(!this.box)return;const bs=this.blocks();
    if(!this.blk||!bs.includes(this.blk))this.blk=bs[bs.length-1]||null;
    this.box.querySelector('.ejp-to').innerHTML=bs.length?'<label>Se agrega a <select class="inp" data-ejpto>'+bs.map((b,i)=>'<option value="'+i+'"'+(b===this.blk?' selected':'')+'>'+esc(b.querySelector('.blk-name').value||('Bloque '+(i+1)))+'</option>').join('')+'</select></label>':'<p class="tiny">Agregá un bloque primero.</p>';
    const all=ejAll(),list=ejFilter(all,this.f);
    const fo=keepFocus&&document.activeElement&&document.activeElement.matches('.ejp [data-ejq]');
    this.box.querySelector('.ejp-f').innerHTML=ejFiltersHtml(this.f,all);
    if(fo){const i=this.box.querySelector('[data-ejq]');i.focus();i.setSelectionRange(i.value.length,i.value.length);}
    this.box.querySelector('.ejp-l').innerHTML=list.length?list.map(e=>'<button type="button" class="ejp-it" data-ejadd="'+esc(e.id)+'">'+ejThumb(e,'ej-th sm')+'<span class="ejp-tx"><b>'+esc(e.nombre)+'</b><small>'+[e.rol?ROL[e.rol]:'',patName(e.pat)].filter(Boolean).map(esc).join(' · ')+'</small></span><i class="ejp-plus">+</i></button>').join(''):'<p class="muted" style="padding:10px">No hay ejercicios con esos filtros.</p>';},
  add(id){const e=ejAll(true).find(x=>x.id===id);if(!e)return;
    let bk=this.blk;if(!bk||!document.contains(bk)){const bs=this.blocks();bk=bs[bs.length-1];}
    if(!bk){const add=$('#mw [data-addblk]');if(add){add.click();bk=this.blocks().pop();}}
    if(!bk)return;
    let row=[...bk.querySelectorAll('.exr')].find(r=>!r.querySelector('.ex-n').value.trim());
    if(!row){bk.querySelector('.blk-ex').insertAdjacentHTML('beforeend',exRowHtml({},bk.querySelector('.blk-series').value));const rs=bk.querySelectorAll('.exr');row=rs[rs.length-1];}
    const ni=row.querySelector('.ex-n');ni.value=e.nombre;
    const li=row.querySelector('.ex-l');if(li&&!li.value&&e.link){li.value=e.link;}
    const oi=row.querySelector('.ex-o');if(oi&&!oi.value&&e.obs){oi.value=e.obs;}
    ni.dispatchEvent(new Event('input',{bubbles:true}));CB.close();
    row.classList.remove('ej-flash');void row.offsetWidth;row.classList.add('ej-flash');
    if(window.innerWidth>860)row.scrollIntoView({block:'nearest',behavior:'smooth'});
    toast(e.nombre+' → '+(bk.querySelector('.blk-name').value||'bloque'));}
};

/* ---------- lo que anotaron los atletas, por ejercicio de la rutina ---------- */
let ATLCTX=null,ATLCTX_LAST=null;
const atlExMatch=(a,b)=>{a=normTxt(a);b=normTxt(b);return a===b||(a.length>=5&&b.length>=5&&(a.startsWith(b)||b.startsWith(a)));};
function atlEntries(d,name){const out=[];Object.keys(d.log||{}).forEach(k=>{if(atlExMatch(k,name))(d.log[k]||[]).forEach(e=>out.push(Object.assign({ex:k},e)));});return out.sort((a,b)=>(b.f||'').localeCompare(a.f||''));}
const inCtx=(e,c)=>!c||!c.desde||(e.f>=c.desde&&e.f<=c.hasta);
function atlBadge(name){const c=ATLCTX;if(!c||!S.atl.length)return '';
  const n=S.atl.filter(d=>atlEntries(d,name).some(e=>inCtx(e,c))).length;return n?'<span class="atl-n" title="Atletas que anotaron">'+n+'</span>':'';}
function openAtlEx(name,c){
  c=c||{};
  const rows=S.atl.map(d=>({d,m:atlPlayer(d),wk:atlEntries(d,name).filter(e=>inCtx(e,c)).reverse()})).filter(x=>x.wk.length);
  const nmOf=x=>x.m.j?x.m.j.nombre:(x.d.ape?x.d.ape+', '+(x.d.nom||''):x.d.nombre||'Sin nombre');
  rows.sort((a,b)=>nmOf(a).localeCompare(nmOf(b),'es'));
  const rng=c.desde?(c.sem?'Semana '+c.sem+' · ':'')+fmtD(c.desde,{day:'numeric',month:'short'})+' al '+fmtD(c.hasta,{day:'numeric',month:'short'}):'Todo lo anotado';
  let b='<p class="muted" style="margin:0">'+esc(rng)+'</p>';
  if(!rows.length)b+='<div class="empty"><b>Nadie anotó '+esc(name)+(c.desde?' esta semana':'')+'</b>Cuando los atletas toquen “+ Anotar mi peso” en este ejercicio, aparece acá.</div>';
  else b+='<div class="tbl-wrap"><table class="ax-t"><thead><tr><th>Atleta</th><th>Anotó</th></tr></thead><tbody>'+rows.map(x=>
    '<tr><td><b>'+esc(nmOf(x))+'</b>'+(x.m.j?'':'<div><button class="linkish tiny" data-rok data-atlopen="'+esc(x.d.id)+'">sin vincular · vincular</button></div>')+'</td>'+
    '<td>'+x.wk.map(e=>'<div class="ax-e"><b>'+fmtN(e.kg)+' kg × '+e.r+'</b> <span class="tiny">'+esc(fmtD(e.f,{weekday:'short',day:'numeric'}))+'</span></div>').join('')+'</td></tr>').join('')+'</tbody></table></div>';
  openModal(modalHead('Lo que anotaron los atletas',name)+'<div class="modal-b">'+b+'</div><div class="modal-f">'+(c.back?'<button class="btn" id="axBack" type="button">← Volver a la rutina</button>':'')+'<div class="grow"></div><button class="btn pri" data-close>Cerrar</button></div>',mw=>{
    const bk=mw.querySelector('#axBack');if(bk)bk.onclick=c.back;
    mw.querySelectorAll('[data-atlopen]').forEach(x=>x.onclick=()=>openAtl(x.dataset.atlopen));});
}
$('#modalRoot').addEventListener('click',e=>{const b=e.target.closest('[data-atlex]');if(!b||RO)return;e.stopPropagation();openAtlEx(b.dataset.atlex,ATLCTX_LAST);});

function startData(){
  Store.watch('categorias',null,null,a=>{S.cats=a;S.catsLoaded=true;bootOff();
    if(!S.cat||!a.find(c=>c.id===S.cat)||!catUnsubs.length)selectCat(S.cat);else{renderNav();render();}});
  Store.watch('lesiones',null,null,a=>{S.lesAll=a;renderNav();render();});
  Store.watch('ejercicios',null,null,a=>{S.lib=a;EJC.t=0;migMayus('ejercicios',a);if(S.view==='ejs'&&!$('#mw'))render();});
  Store.watch('rutinas',null,null,a=>{S.tplAll=a.filter(r=>r.plantilla);S.rutAll=a.filter(r=>!r.plantilla&&!r.oculta);S.rutCal=a.filter(r=>r.oculta);EJC.t=0;renderNav();render();migMayus('rutinas',a);});
  Store.watch('asignaciones',null,null,a=>{S.asigAll=a.filter(x=>!x.dif&&!x.oculta);S.asigDif=a.filter(x=>x.dif);S.asigCal=a.filter(x=>x.oculta);render();trabSync();});
  Store.watch('ideales',null,null,a=>{S.ideales=a;render();});
  Store.watch('testeosLista',null,null,a=>{S.testList=a;render();});
  Store.watch('config',null,null,a=>{S.cfg=a;renderNav();avPaint();});
  if(!RO)Store.watch('registrosAtletas','cat','pers',a=>{S.pAtl=a.filter(d=>!d.baja);renderNav();avPaint();if(S.cat==='pers'&&S.view==='cat'&&!$('#mw'))render();});
  /* agenda: lo de hoy y mañana de TODAS las categorías */
  Store.watch('sesiones','fecha',TODAY,a=>{S.sesHoy=a;renderAgenda();});
  Store.watch('partidos','fecha',TODAY,a=>{S.parHoy=a;renderAgenda();});
  Store.watch('sesiones','fecha',TOMORROW,a=>{S.sesMan=a;renderAgenda();});
  Store.watch('partidos','fecha',TOMORROW,a=>{S.parMan=a;renderAgenda();});
  if(!RO)migrateRutinas();
}
async function seedCloud(){
  const snap=await Store.fs.collection('categorias').limit(1).get({source:'server'}).catch(()=>null);
  if(snap&&snap.empty){const b=Store.fs.batch();DEFAULT_CATS.forEach((c,i)=>b.set(Store.fs.collection('categorias').doc(c[0]),{nombre:c[1],grupo:c[2],orden:(i+1)*10}));await b.commit().catch(handleErr);}
}
/* ================= respaldo: exportar / importar ================= */
async function exportData(){
  const btn=$('#expBtn');btn.disabled=true;btn.textContent='Preparando…';
  try{
    const data={};for(const c of COLLS)data[c]=await Store.getAll(c);
    const out={app:'pizarra-pf',version:2,exportado:new Date().toISOString(),datos:data};
    const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trainingpro-cvm-respaldo-'+TODAY+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    const n=Object.values(data).reduce((t,o)=>t+Object.keys(o).length,0);
    toast('Respaldo descargado ('+n+' registros)');
  }catch(e){console.warn(e);toast('No se pudo generar el respaldo. Revisá la conexión.');}
  btn.disabled=false;btn.textContent='Descargar respaldo';
}
const COLL_LBL={dnis:'DNI de jugadores (cifrados)',categorias:'Categorías',rutinas:'Rutinas',asignaciones:'Asignaciones de rutinas',ideales:'Ideales de testeos',testeosLista:'Lista de testeos',config:'Configuración',jugadores:'Jugadores',sesiones:'Sesiones',partidos:'Partidos',asistencia:'Días de asistencia',testeos:'Tomas de testeos',lesiones:'Lesiones',ejercicios:'Ejercicios guardados'};
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let j;try{j=JSON.parse(r.result);}catch(e){toast('El archivo no es un respaldo válido.');return;}
    if(!j||j.app!=='pizarra-pf'||!j.datos){toast('Ese archivo no es un respaldo de Pizarra PF.');return;}
    const colls=COLLS.filter(c=>j.datos[c]&&typeof j.datos[c]==='object');
    const rows=colls.map(c=>'<tr><td>'+COLL_LBL[c]+'</td><td class="r num">'+Object.keys(j.datos[c]).length+'</td></tr>').join('');
    openModal(modalHead('Importar respaldo','¿Cargar estos datos?')+
      '<div class="modal-b"><p class="muted" style="margin:0">Respaldo del '+esc(j.exportado?new Date(j.exportado).toLocaleString('es-AR'):'(sin fecha)')+'.</p>'+
      '<div class="imp-sum"><table>'+rows+'</table></div>'+
      '<p style="margin:0">Los registros del respaldo se suman a los que ya tenés. Si un registro existe en los dos (misma sesión, mismo jugador), queda la versión del respaldo. No se borra nada.</p></div>'+
      '<div class="modal-f"><div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="doImp">Importar</button></div>',mw=>{
      mw.querySelector('#doImp').onclick=async function(){
        this.disabled=true;this.textContent='Importando…';
        try{for(const c of colls)await Store.putMany(c,j.datos[c]);closeModal();toast('Respaldo importado');}
        catch(e){console.warn(e);handleErr(e);this.disabled=false;this.textContent='Importar';}
      };
    });
  };
  r.readAsText(file);
}
$('#expBtn').onclick=exportData;
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f);};

Store.init().then(()=>{
  if(Store.mode==='local'){
    setStatus(RO?'ro':'local');
    if(!RO)$('#banner').innerHTML='<div class="banner">Firebase no está configurado: lo que cargues queda solo en este navegador.</div>';
    if(!RO&&!Store.local.categorias){Store.local.categorias={};DEFAULT_CATS.forEach((c,i)=>Store.local.categorias[c[0]]={nombre:c[1],grupo:c[2],orden:(i+1)*10});}
    startData();return;
  }
  const auth=firebase.auth();let started=false,authSeen=false;
  /* si la sesión de Google no responde en 10 s, mostramos el botón para entrar en vez de quedar en "Cargando…" */
  setTimeout(()=>{if(!authSeen&&!RO){$('#login').hidden=false;$('#loginMsg').textContent='Está tardando en conectar. Tocá “Entrar con Google” o recargá la página.';}},10000);
  auth.getRedirectResult().catch(e=>{$('#loginMsg').textContent='No se pudo entrar: '+(e.message||e.code);});
  auth.onAuthStateChanged(async u=>{
    authSeen=true;
    if(RO){
      if(!u){auth.signInAnonymously().catch(e=>{console.warn(e);roBlocked();});return;}
      if(started)return;started=true;
      if(u.isAnonymous){
        try{await Store.fs.collection('lectores').doc(u.uid).set({token:RO_TOKEN,t:Date.now()});}
        catch(e){console.warn('lector',e);return roBlocked();}
      }
      $('#login').hidden=true;setStatus('ro');startData();return;
    }
    if(!u){$('#login').hidden=false;return;}
    $('#login').hidden=true;setStatus('cloud');
    if(started)return;started=true;
    await seedCloud();startData();
  });
  $('#loginBtn').onclick=()=>{
    const pr=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(pr).catch(e=>{
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return auth.signInWithRedirect(pr);
      if(e.code!=='auth/popup-closed-by-user')$('#loginMsg').textContent='No se pudo entrar: '+(e.message||e.code);
    });
  };
});

.pg-role{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:1px 5px;border-radius:4px;color:#fff}
.r-b{background:#2f6fd6}.r-s{background:#3f9a62}.r-e{background:#e8590c}.r-a{background:#7950f2}.r-p{background:#c2255c}.r-k{background:#5c6b62}.r-m{background:#868e96}.r-o{background:#b8860b}

.pg-vr{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}

.pg-tpl{display:grid;gap:6px;margin-bottom:6px}
