      q('stPost').before(box);q('stCfg').disabled=true;
      box.querySelector('#cfgOk').onclick=()=>{const r=+box.querySelector('#cfgReg').value,c=+box.querySelector('#cfgComp').value;if(!(r>0&&c>0&&c<=r)){toast('Revisá los valores');return;}
        cfg.reg=r;cfg.comp=c;Store.put('config','recup',{reg:r,comp:c});box.remove();q('stCfg').disabled=false;drawPost();toast('Umbrales guardados');};
    };
    q('stSave').onclick=async()=>{
      const o=read();const d=Object.assign({},p);delete d.id;d.stats=o;
      /* las decisiones solo valen para quienes siguen en la franja "a decidir" */
      const rc={};Object.keys(recup).forEach(j=>{if(recClass((o[j]||{}).min,cfg)==='ask')rc[j]=recup[j];});d.recup=rc;
      const useRes=q('stRes');if(detRes&&useRes&&useRes.checked){d.gf=String(detRes.gf);d.gc=String(detRes.gc);}
      try{await Store.put('partidos',p.id,d);closeModal();toast('Estadísticas guardadas');}catch(e){}
    };
  });
}
function postSummary(p){
  if(!p.stats||!Object.keys(p.stats).length)return '';
  const cfg=recCfg();let reg=0,comp=0,ask=0;
  S.jug.forEach(j=>{const c=recClass((p.stats[j.id]||{}).min,cfg);if(c==='reg'||(c==='ask'&&(p.recup||{})[j.id]==='reg'))reg++;else if(c==='ask'&&!(p.recup||{})[j.id])ask++;else if(c!=='nc')comp++;});
  return '<span class="post-pills"><span class="pill good">'+reg+' regen.</span><span class="pill neutral">'+comp+' comp.</span>'+(ask?'<span class="pill warn">'+ask+' a decidir</span>':'')+'</span>';
}

/* ---------- pestaña Estadísticas: promedios ---------- */
function vStats(){
  const games=S.par.filter(p=>p.stats&&Object.keys(p.stats).length).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const mode=S.stMode||'prom';
  let h='<div class="bar"><h2>Estadísticas</h2><span class="muted">'+games.length+(games.length===1?' partido cargado':' partidos cargados')+'</span><div class="grow"></div>'+
    '<div class="seg cal-seg"><button class="'+(mode==='prom'?'on':'')+'" data-stmode="prom">Promedios</button><button class="'+(mode==='tot'?'on':'')+'" data-stmode="tot">Totales</button></div></div>';
  if(!games.length)return h+'<div class="empty"><b>Todavía no hay estadísticas</b>Andá a <b>Partidos</b>, abrí un partido jugado y tocá <b>Estadísticas</b>.</div>';
  const rows=S.jug.map(j=>{
    /* figura en la planilla = convocado (aunque tenga 0 minutos, estuvo en el banco) */
    const g=games.map(p=>p.stats[j.id]).filter(x=>x&&Object.keys(x).length);
    /* el promedio de cada dato se hace sobre los partidos donde ese dato está cargado */
    const tot={},avg={};STATS.forEach(([k])=>{const vs=g.filter(x=>x[k]!=null).map(x=>+x[k]);tot[k]=vs.reduce((t,v)=>t+v,0);avg[k]=vs.length?tot[k]/vs.length:null;});
    return {j,pj:g.length,ent:g.filter(x=>x.min>0).length,tot,avg};
  });
  const key=S.stSort||'min';
  rows.sort((a,b)=>key==='pj'?b.pj-a.pj:key==='ent'?b.ent-a.ent:((mode==='tot'?b.tot[key]:b.avg[key])??-1)-((mode==='tot'?a.tot[key]:a.avg[key])??-1));
  const val=(r,k)=>{if(!r.pj)return '<span class="tiny">–</span>';const v=mode==='tot'?r.tot[k]:r.avg[k];if(v==null)return '<span class="tiny">–</span>';return k==='min'?fmtMin(v):fmtN(Math.round(v*10)/10);};
  h+='<div class="tbl-wrap"><table><thead><tr><th>Jugador</th><th class="r"><button class="linkish" data-stsort="pj">PJ</button></th><th class="r"><button class="linkish" data-stsort="ent">Entró</button></th>'+STATS.map(([k,l])=>'<th class="r"><button class="linkish'+(key===k?' on':'')+'" data-stsort="'+k+'">'+l+(key===k?' ↓':'')+'</button></th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.j.nombre)+'</td><td class="r mono">'+r.pj+'</td><td class="r mono">'+r.ent+'</td>'+STATS.map(([k])=>'<td class="r mono'+(k==='min'?' st-min':'')+'">'+val(r,k)+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div><p class="tiny" style="margin-top:6px">PJ = partidos convocado (incluye los que estuvo en el banco con 0 minutos) · Entró = partidos en los que jugó minutos. '+(mode==='prom'?'Promedios por partido convocado.':'Totales de la temporada.')+' Tocá un título para ordenar.</p>';
  h+='<h3 style="margin-top:18px">Partidos</h3><div class="match-list">'+games.slice().reverse().map(p=>'<button class="match" data-stats="'+esc(p.id)+'" style="text-align:left;color:inherit;font:inherit"><div class="when"><div class="d">'+pISO(p.fecha).getDate()+'</div><div class="m">'+esc(pISO(p.fecha).toLocaleDateString('es-AR',{month:'short'}))+'</div></div><div><div class="vs">vs '+esc(p.rival)+'</div><div class="tiny">'+Object.keys(p.stats).length+' '+jugW(1)+' con datos</div></div><div class="right">'+postSummary(p)+'</div></button>').join('')+'</div>';
  return h;
}

/* qué entrena cada categoría en la fecha f: sesiones sueltas + rutinas asignadas + partidos */
function agendaFor(f){
  const ses=f===TODAY?S.sesHoy:S.sesMan,par=f===TODAY?S.parHoy:S.parMan;
  const wd=wdOf(f);const out=[];
  S.cats.forEach(c=>{
    const conc=ses.filter(s=>s.cat===c.id&&s.fecha===f);
    conc.forEach(s=>{const r=s.rutina?rutById(s.rutina):null;
      out.push({cat:c,tipo:s.tipo,hora:s.hora||'',susp:!!s.suspendida,txt:s.objetivo||(s.rutDia?s.rutDia+' · ':'')+(r?r.nombre:'')});});
    S.asigAll.forEach(a=>{
      if(a.cat!==c.id||!rutActive(a,f))return;const r=rutById(a.rutina);if(!r)return;
      const di=(a.horario||[]).findIndex(x=>x&&x.d===wd);if(di<0)return;const dd=rutDays(r)[di];if(!dd)return;
      if(conc.some(s=>s.tipo===r.tipo&&(s.rutina===r.id||!s.rutina)))return;
      out.push({cat:c,tipo:r.tipo,hora:(a.horario[di]||{}).hora||'',txt:(dd.nombre||'')+' · '+r.nombre});
    });
    par.filter(p=>p.cat===c.id&&p.fecha===f).forEach(p=>out.push({cat:c,tipo:'match',hora:p.hora||'',txt:'vs '+(p.rival||'')+(p.condicion?' · '+p.condicion:'')}));
  });
  return out.sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99')||(a.cat.orden||0)-(b.cat.orden||0));
}

/* La app de atletas lo lee de "asignaciones": va con cat "dif:<categoría>" y solo con los códigos de los celulares de ese jugador */
function syncDif(lid,l){
  const docId='dif__'+lid;const exists=S.asigDif.some(a=>a.id===docId);
  const r=l.rutina&&rutById(l.rutina);
  if(!r){if(exists)Store.remove('asignaciones',docId);return;}
  const uids=S.atl.filter(d=>{const m=atlPlayer(d);return m.j&&m.j.id===l.jugador;}).map(d=>d.id);
  const base=asigOfCat(l.cat).find(a=>asigState(a)==='vig'&&(rutById(a.rutina)||{}).tipo===r.tipo)||asigOfCat(l.cat).find(a=>asigState(a)==='vig');
  Store.put('asignaciones',docId,{dif:true,cat:'dif:'+l.cat,rutina:r.id,jugador:l.jugador,uids,desde:l.difDesde||TODAY,semanas:r.semanas||4,
    horario:base?JSON.parse(JSON.stringify(base.horario||[])):[],hasta:l.estado==='alta'?(l.fechaAlta||TODAY):''});

function difUidsCheck(){if(RO||!S.jug.length)return;S.lesAll.filter(l=>l.cat===S.cat&&l.rutina&&activeInj(l)).forEach(l=>{
  const a=S.asigDif.find(x=>x.id==='dif__'+l.id);if(!a)return;
  const u=S.atl.filter(d=>{const m=atlPlayer(d);return m.j&&m.j.id===l.jugador;}).map(d=>d.id).sort().join(',');

function ejExpected(obj,idx,prev){
  const last=prev[prev.length-1];
  if(obj==='pot'){if(CUR_FORM)return idx===0?'e':idx===1?'s':'k';if(idx===0)return 'b';if(last&&['b','s','k','m','p'].includes(last.rol))return 'e';return 'b';}
  if(obj==='fmax'){if(idx===0)return 'b';if(last&&last.rol==='b')return 'k';return 'b';}

}
const EJPAIR={rod:['trh','trv'],cad:['emh','emv'],emh:['cad','rod'],emv:['cad','rod'],trh:['rod','cad'],trv:['rod','cad']};
const LEGS=['rod','cad'],UPPER=['emh','emv','trh','trv'];
/* secciones de sugerencias según objetivo, lugar en el bloque y lo anterior */
function ejSuggest(obj,idx,prev,all){
  const used=new Set(prev.map(p=>p.id));const ok=e=>!used.has(e.id);
  const last=prev[prev.length-1];const lastB=[...prev].reverse().find(p=>p.rol==='b'||p.rol==='s');
  const S2=[];const add=(t,arr)=>{arr=arr.filter(ok);if(arr.length)S2.push([t,arr]);};
  const role=r=>all.filter(e=>e.rol===r);const pausa=()=>role('k').concat(role('m'),role('p'));
  if(obj==='pot'){
    if(CUR_FORM){
      if(!last){add('Saltos y aterrizajes',role('e').filter(e=>LEGS.includes(e.pat)));add('Core',role('k'));}
      else if(last.rol==='e'){add('Patrón técnico del mismo grupo',all.filter(e=>(e.rol==='s'||e.rol==='b')&&e.pat===last.pat));add('Patrón técnico (otros)',role('s').filter(e=>e.pat!==last.pat));}
      else{add('Core',role('k'));add('Saltos',role('e').filter(e=>LEGS.includes(e.pat)));}
    }else if(!last||!lastB){add('Básicos',role('b'));add('Secundarios',role('s'));add('Explosivos',role('e'));}
    else if(last.rol==='b'||last.rol==='s'){
      add('Transferencia · mismo patrón ('+patName(last.pat).toLowerCase()+')',all.filter(e=>e.rol==='e'&&e.pat===last.pat));
      add('Pausa activa',pausa());
      add('Explosivos parecidos',all.filter(e=>e.rol==='e'&&e.pat!==last.pat&&(LEGS.includes(last.pat)?LEGS.includes(e.pat):UPPER.includes(e.pat))));
    }else if(['k','m','p'].includes(last.rol)){
      add('Transferencia del básico ('+lastB.nombre+')',all.filter(e=>e.rol==='e'&&e.pat===lastB.pat));
      add('Otro básico',role('b').filter(e=>e.pat!==lastB.pat));
    }else{add('Otro básico (siguiente par)',role('b').filter(e=>e.pat!==lastB.pat));add('Pausa activa',pausa());}
  }else if(obj==='fmax'){
    if(!last){add('Básicos',role('b'));add('Secundarios',role('s'));}
    else if(last.rol==='b'){add('Pausa activa',pausa());add('Básico de otro patrón',role('b').filter(e=>e.pat!==last.pat));}
    else{const up=new Set(prev.filter(p=>p.rol==='b').map(p=>p.pat));add('Básico de otro patrón',role('b').filter(e=>!up.has(e.pat)));add('Secundarios',role('s'));}
  }else if(obj==='fh'){
    if(!last){add('Secundarios',role('s'));add('Básicos',role('b'));}
    else{const pr=EJPAIR[last.pat]||[];add('Para la bi-serie (no pisa '+(patName(last.pat)||'el anterior').toLowerCase()+')',all.filter(e=>(e.rol==='s'||e.rol==='b')&&pr.includes(e.pat)));add('Core',role('k'));add('Otros secundarios',role('s').filter(e=>e.pat!==last.pat&&!pr.includes(e.pat)));}
  }else if(obj==='acc'){add('Accesorios'+(last?' (otra zona)':''),role('a').filter(e=>!last||e.pat!==last.pat));add('Prevención',role('p'));add('Core',role('k'));}
  else if(obj==='prev'){add('Prevención'+(last?' (otra zona)':''),role('p').filter(e=>!last||e.pat!==last.pat));add('Core',role('k'));add('Movilidad',role('m'));}
  else if(obj==='act'){add('Explosivos (poco volumen)',role('e').filter(e=>!last||e.pat!==last.pat));add('Core',role('k'));}
  return S2;
}

    ['Movilidad',/movilidad|elongacion|estiramiento|liberacion|miofascial|90 90|psoas|recto|spiderman/],
    ['Prevención',/aductor|copenhag|cophenag|gemelo|soleo|tobillo|manguito|rotador|espinal|isquio|nordic|nordico|y t a/],
    ['Accesorio',/biceps|triceps|frances|vuelo|pullover|cuadriceps|curl/]];
  const ZI=/aductor|copenhag|cophenag|gemelo|soleo|tobillo|isquio|cuadriceps|psoas|nordic|nordico|cadera|gluteo|femoral/,ZS=/biceps|triceps|frances|vuelo|hombro|espinal|manguito|rotador|pullover|pecho|tren sup|brazo/;
  const zOf=t=>({'Sentadilla':'inf','Bisagra':'inf','Unilateral':'inf','Pliometría':'inf','Velocidad / carrera':'inf','Empuje':'sup','Tracción':'sup','Core':'core','Potencia':'full'})[t]||'';
  const parts=String(nombre).split('+').map(x=>normTxt(x)).filter(Boolean).map(x=>' '+x+' ');
  const res=parts.map(p=>{let best=null;
    TIP.forEach(([t,re])=>{const m=p.match(re);if(m&&(!best||m.index<best.i))best={t,i:m.index};});
    let t=best?best.t:'';
    /* sentadilla búlgara / a una pierna = unilateral; peso muerto a una pierna sigue siendo bisagra */
    if(t==='Sentadilla'&&/bulgar|split|una pierna|1 pierna/.test(p))t='Unilateral';
    if(t==='Unilateral'&&/peso muerto|hip thrust/.test(p))t='Bisagra';
    if(t==='Unilateral'&&/biceps|triceps|vuelo|press|remo|halo|pallof/.test(p)&&!/estocada|bulgar|split|step|subida|alcances/.test(p)){const b2=TIP.filter(x=>x[0]!=='Unilateral').map(([tt,re])=>{const m=p.match(re);return m?{t:tt,i:m.index}:null;}).filter(Boolean).sort((a,b)=>a.i-b.i)[0];if(b2)t=b2.t;}
    let z=zOf(t);
    if(t==='Pliometría'&&/flexion|despegue|pecho|tren sup/.test(p))z='sup';
    if(t==='Potencia'&&/lanzamiento.*pecho|pecho|tren sup|1 brazo|un brazo/.test(p)&&!/cargada|arranque|tiempo/.test(p))z='sup';
    if(!z){if(ZI.test(p))z='inf';else if(ZS.test(p))z='sup';}
    if(t==='Accesorio'&&/cuadriceps|femoral|gemelo/.test(p))z='inf';
    return {t,z};});
  const r0=res.find(x=>x.t)||{t:'',z:''};g.tipo=r0.t;
  const zs=[...new Set(res.map(x=>x.z).filter(Boolean))];
  g.zona=zs.length>1?'full':(zs[0]||'');
  const n=' '+full+' ',has=re=>re.test(n);
  const I=[['Barra',/barra|trasera|cargada|segundo tiempo|2do tiempo|push press|rack/],['Mancuerna',/mancuerna|\bmanc\b|\bmc\b/],['Kettlebell',/kettlebell|\bkb\b|pesa rusa|goblet|swing/],
    ['Disco',/disco/],['Banda',/banda|elastic|\bliga\b/],['Polea',/polea|cable|jalon/],['Máquina',/maquina|prensa|extension de cuadriceps|smith|camilla/],
    ['Balón medicinal',/medball|\bmb\b|balon|pelota|lanzamiento/],['TRX',/trx/],['Fitball',/fitball/],['Cajón',/cajon/],['Landmine',/landmine/]];
  I.forEach(([v,re])=>{if(has(re))g.impl.push(v);});
  if(!g.impl.length&&has(/dominada|flexion|push up|plancha|nordic|copenhag|cophenag|salto|cmj|drop|fondos|bicho muerto|sprint|skipping|abdominal|estocada|carpa|sit up|twist|bulgar|step up|vallas|multisaltos|coordinacion|cambios? de direccion|alcances|puente de/))g.impl.push('Peso corporal');
  return g;
}
/* todos los ejercicios: los guardados + los de las rutinas + la lista base */
const EJC={t:0,a:null,h:null};
function ejAll(withHidden){
  if(Date.now()-EJC.t<800&&EJC.a)return withHidden?EJC.h:EJC.a;
  const m={};
  const add=(id,d)=>{m[id]=Object.assign({id,nombre:'',link:'',impl:[],uso:0},m[id]||{},d);};
  DEFAULT_LIB.forEach(n=>add(slug(n),{nombre:n.toLocaleUpperCase('es')}));
  const uso={};
  S.rutAll.forEach(r=>{if(r.archivada)return;const seen={};rutDays(r).forEach(d=>(d.bloques||[]).forEach(b=>(b.ejercicios||[]).forEach(e=>{
    if(!e.n)return;const k=slug(e.n);if(seen[k])return;seen[k]=1;uso[k]=(uso[k]||0)+1;
    if(!m[k])add(k,{nombre:String(e.n).toLocaleUpperCase('es'),link:e.link||''});else if(!m[k].link&&e.link)m[k].link=e.link;})));});
  S.lib.forEach(x=>{if(!x.nombre)return;const d=Object.assign({},x);d.nombre=String(x.nombre).toLocaleUpperCase('es');d.impl=Array.isArray(x.impl)?x.impl.slice():[];
    if(!d.link&&m[x.id]&&m[x.id].link)d.link=m[x.id].link;add(x.id,d);});
  Object.keys(uso).forEach(k=>{if(m[k])m[k].uso=uso[k];});
  const arr=Object.values(m).map(ejEff).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  EJC.t=Date.now();EJC.h=arr;EJC.a=arr.filter(e=>!e.oculto);
  return withHidden?EJC.h:EJC.a;
}

/* achica la foto a 360 px (pesa ~15-30 KB) para guardarla gratis */
function ejShrink(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{
    const M=360;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>90000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q);}res(d);};im.src=fr.result;};fr.readAsDataURL(file);});}

    const ni=row.querySelector('.ex-n');ni.value=e.nombre;
    const li=row.querySelector('.ex-l');if(li&&!li.value&&e.link){li.value=e.link;}
    ni.dispatchEvent(new Event('input',{bubbles:true}));CB.close();
    row.classList.remove('ej-flash');void row.offsetWidth;row.classList.add('ej-flash');
    if(window.innerWidth>860)row.scrollIntoView({block:'nearest',behavior:'smooth'});
    toast(e.nombre+' → '+(bk.querySelector('.blk-name').value||'bloque'));}
};
/* bloque activo = el último donde tocaste */
document.addEventListener('focusin',e=>{const b=e.target.closest&&e.target.closest('#mw #blocks .blk');if(b){EJP.blk=b;if(EJP.box){const s=EJP.box.querySelector('[data-ejpto]');const i=EJP.blocks().indexOf(b);if(s&&i>=0)s.value=i;}}});
document.addEventListener('click',e=>{if(e.target.closest('[data-ejpanel]')){EJP.box?EJP.close():EJP.open();return;}
  if(EJP.box&&(e.target.closest('[data-addblk],[data-rmblk],[data-parse],[data-dtab],[data-dadd]')))setTimeout(()=>EJP.draw(),0);},true);
/* si se cierra el editor, se cierra el panel */
new MutationObserver(()=>{if(EJP.box&&!document.contains(EJP.box))EJP.close();}).observe($('#modalRoot'),{childList:true});

/* ---------- lo que anotaron los atletas, por ejercicio de la rutina ---------- */
let ATLCTX=null,ATLCTX_LAST=null;
const atlExMatch=(a,b)=>{a=normTxt(a);b=normTxt(b);return a===b||(a.length>=5&&b.length>=5&&(a.startsWith(b)||b.startsWith(a)));};
function atlEntries(d,name){const out=[];Object.keys(d.log||{}).forEach(k=>{if(atlExMatch(k,name))(d.log[k]||[]).forEach(e=>out.push(Object.assign({ex:k},e)));});return out.sort((a,b)=>(b.f||'').localeCompare(a.f||''));}
const inCtx=(e,c)=>!c||!c.desde||(e.f>=c.desde&&e.f<=c.hasta);
function atlBadge(name){const c=ATLCTX;if(!c||!S.atl.length)return '';
  const n=S.atl.filter(d=>atlEntries(d,name).some(e=>inCtx(e,c))).length;return n?'<span class="atl-n" title="Atletas que anotaron">'+n+'</span>':'';}
function openAtlEx(name,c){
  c=c||{};
  const rows=S.atl.map(d=>({d,m:atlPlayer(d),wk:atlEntries(d,name).filter(e=>inCtx(e,c)).reverse()})).filter(x=>x.wk.length);
  const nmOf=x=>x.m.j?x.m.j.nombre:(x.d.ape?x.d.ape+', '+(x.d.nom||''):x.d.nombre||'Sin nombre');
  rows.sort((a,b)=>nmOf(a).localeCompare(nmOf(b),'es'));
  const rng=c.desde?(c.sem?'Semana '+c.sem+' · ':'')+fmtD(c.desde,{day:'numeric',month:'short'})+' al '+fmtD(c.hasta,{day:'numeric',month:'short'}):'Todo lo anotado';
  let b='<p class="muted" style="margin:0">'+esc(rng)+'</p>';
  if(!rows.length)b+='<div class="empty"><b>Nadie anotó '+esc(name)+(c.desde?' esta semana':'')+'</b>Cuando los atletas toquen “+ Anotar mi peso” en este ejercicio, aparece acá.</div>';
  else b+='<div class="tbl-wrap"><table class="ax-t"><thead><tr><th>Atleta</th><th>Anotó</th></tr></thead><tbody>'+rows.map(x=>
    '<tr><td><b>'+esc(nmOf(x))+'</b>'+(x.m.j?'':'<div><button class="linkish tiny" data-rok data-atlopen="'+esc(x.d.id)+'">sin vincular · vincular</button></div>')+'</td>'+
    '<td>'+x.wk.map(e=>'<div class="ax-e"><b>'+fmtN(e.kg)+' kg × '+e.r+'</b> <span class="tiny">'+esc(fmtD(e.f,{weekday:'short',day:'numeric'}))+'</span></div>').join('')+'</td></tr>').join('')+'</tbody></table></div>';
  openModal(modalHead('Lo que anotaron los atletas',name)+'<div class="modal-b">'+b+'</div><div class="modal-f">'+(c.back?'<button class="btn" id="axBack" type="button">← Volver a la rutina</button>':'')+'<div class="grow"></div><button class="btn pri" data-close>Cerrar</button></div>',mw=>{
    const bk=mw.querySelector('#axBack');if(bk)bk.onclick=c.back;
    mw.querySelectorAll('[data-atlopen]').forEach(x=>x.onclick=()=>openAtl(x.dataset.atlopen));});
}
$('#modalRoot').addEventListener('click',e=>{const b=e.target.closest('[data-atlex]');if(!b||RO)return;e.stopPropagation();openAtlEx(b.dataset.atlex,ATLCTX_LAST);});

function bootOff(){const b=document.getElementById('boot');if(b&&!b.classList.contains('off')){b.classList.add('off');setTimeout(()=>b.remove(),300);}}
setTimeout(bootOff,12000);
new MutationObserver(()=>{if(!$('#login').hidden)bootOff();}).observe($('#login'),{attributes:true,attributeFilter:['hidden']});
/* ================= arranque ================= */
function startData(){
  Store.watch('categorias',null,null,a=>{S.cats=a;S.catsLoaded=true;bootOff();
    if(!S.cat||!a.find(c=>c.id===S.cat)||!catUnsubs.length)selectCat(S.cat);else{renderNav();render();}});
  Store.watch('lesiones',null,null,a=>{S.lesAll=a;renderNav();render();});
  Store.watch('ejercicios',null,null,a=>{S.lib=a;EJC.t=0;migMayus('ejercicios',a);if(S.view==='ejs'&&!$('#mw'))render();});
  Store.watch('rutinas',null,null,a=>{S.rutAll=a;EJC.t=0;renderNav();render();migMayus('rutinas',a);});
  Store.watch('asignaciones',null,null,a=>{S.asigAll=a.filter(x=>!x.dif);S.asigDif=a.filter(x=>x.dif);render();});
  Store.watch('ideales',null,null,a=>{S.ideales=a;render();});
  Store.watch('testeosLista',null,null,a=>{S.testList=a;render();});
  Store.watch('config',null,null,a=>{S.cfg=a;renderNav();});
  /* agenda: lo de hoy y mañana de TODAS las categorías */
  Store.watch('sesiones','fecha',TODAY,a=>{S.sesHoy=a;renderAgenda();});
  Store.watch('partidos','fecha',TODAY,a=>{S.parHoy=a;renderAgenda();});
  Store.watch('sesiones','fecha',TOMORROW,a=>{S.sesMan=a;renderAgenda();});
  Store.watch('partidos','fecha',TOMORROW,a=>{S.parMan=a;renderAgenda();});
  if(!RO)migrateRutinas();
}
async function seedCloud(){
  const snap=await Store.fs.collection('categorias').limit(1).get({source:'server'}).catch(()=>null);
  if(snap&&snap.empty){const b=Store.fs.batch();DEFAULT_CATS.forEach((c,i)=>b.set(Store.fs.collection('categorias').doc(c[0]),{nombre:c[1],grupo:c[2],orden:(i+1)*10}));await b.commit().catch(handleErr);}
}
/* ================= respaldo: exportar / importar ================= */
async function exportData(){
  const btn=$('#expBtn');btn.disabled=true;btn.textContent='Preparando…';
  try{
    const data={};for(const c of COLLS)data[c]=await Store.getAll(c);
    const out={app:'pizarra-pf',version:2,exportado:new Date().toISOString(),datos:data};
    const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trainingpro-cvm-respaldo-'+TODAY+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    const n=Object.values(data).reduce((t,o)=>t+Object.keys(o).length,0);
    toast('Respaldo descargado ('+n+' registros)');
  }catch(e){console.warn(e);toast('No se pudo generar el respaldo. Revisá la conexión.');}
  btn.disabled=false;btn.textContent='Descargar respaldo';
}
const COLL_LBL={dnis:'DNI de jugadores (cifrados)',categorias:'Categorías',rutinas:'Rutinas',asignaciones:'Asignaciones de rutinas',ideales:'Ideales de testeos',testeosLista:'Lista de testeos',config:'Configuración',jugadores:'Jugadores',sesiones:'Sesiones',partidos:'Partidos',asistencia:'Días de asistencia',testeos:'Tomas de testeos',lesiones:'Lesiones',ejercicios:'Ejercicios guardados'};
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let j;try{j=JSON.parse(r.result);}catch(e){toast('El archivo no es un respaldo válido.');return;}
    if(!j||j.app!=='pizarra-pf'||!j.datos){toast('Ese archivo no es un respaldo de Pizarra PF.');return;}
    const colls=COLLS.filter(c=>j.datos[c]&&typeof j.datos[c]==='object');
    const rows=colls.map(c=>'<tr><td>'+COLL_LBL[c]+'</td><td class="r num">'+Object.keys(j.datos[c]).length+'</td></tr>').join('');
    openModal(modalHead('Importar respaldo','¿Cargar estos datos?')+
      '<div class="modal-b"><p class="muted" style="margin:0">Respaldo del '+esc(j.exportado?new Date(j.exportado).toLocaleString('es-AR'):'(sin fecha)')+'.</p>'+
      '<div class="imp-sum"><table>'+rows+'</table></div>'+
      '<p style="margin:0">Los registros del respaldo se suman a los que ya tenés. Si un registro existe en los dos (misma sesión, mismo jugador), queda la versión del respaldo. No se borra nada.</p></div>'+
      '<div class="modal-f"><div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="doImp">Importar</button></div>',mw=>{
      mw.querySelector('#doImp').onclick=async function(){
        this.disabled=true;this.textContent='Importando…';
        try{for(const c of colls)await Store.putMany(c,j.datos[c]);closeModal();toast('Respaldo importado');}
        catch(e){console.warn(e);handleErr(e);this.disabled=false;this.textContent='Importar';}
      };
    });
  };
  r.readAsText(file);
}
$('#expBtn').onclick=exportData;
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f);};

render();
Store.init().then(()=>{
  if(Store.mode==='local'){
    setStatus(RO?'ro':'local');
    if(!RO)$('#banner').innerHTML='<div class="banner">Firebase no está configurado: lo que cargues queda solo en este navegador.</div>';
    if(!RO&&!Store.local.categorias){Store.local.categorias={};DEFAULT_CATS.forEach((c,i)=>Store.local.categorias[c[0]]={nombre:c[1],grupo:c[2],orden:(i+1)*10});}
    startData();return;
  }
  const auth=firebase.auth();let started=false,authSeen=false;
  /* si la sesión de Google no responde en 10 s, mostramos el botón para entrar en vez de quedar en "Cargando…" */
  setTimeout(()=>{if(!authSeen&&!RO){$('#login').hidden=false;$('#loginMsg').textContent='Está tardando en conectar. Tocá “Entrar con Google” o recargá la página.';}},10000);
  auth.getRedirectResult().catch(e=>{$('#loginMsg').textContent='No se pudo entrar: '+(e.message||e.code);});
  auth.onAuthStateChanged(async u=>{
    authSeen=true;
    if(RO){
      if(!u){auth.signInAnonymously().catch(e=>{console.warn(e);roBlocked();});return;}
      if(started)return;started=true;
      if(u.isAnonymous){
        try{await Store.fs.collection('lectores').doc(u.uid).set({token:RO_TOKEN,t:Date.now()});}
        catch(e){console.warn('lector',e);return roBlocked();}
      }
      $('#login').hidden=true;setStatus('ro');startData();return;
    }
    if(!u){$('#login').hidden=false;return;}
    $('#login').hidden=true;setStatus('cloud');
    if(started)return;started=true;
    await seedCloud();startData();
  });
  $('#loginBtn').onclick=()=>{
    const pr=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(pr).catch(e=>{
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return auth.signInWithRedirect(pr);
      if(e.code!=='auth/popup-closed-by-user')$('#loginMsg').textContent='No se pudo entrar: '+(e.message||e.code);
    });
  };
});
})();
</script>
