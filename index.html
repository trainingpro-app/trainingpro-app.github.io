<style>
:root{
  --bg:#F1F3F1; --surface:#FFFFFF; --surface-2:#E7EBE8; --ink:#0D110E; --ink-2:#4A544D; --ink-3:#7A847D; --line:#D3D9D4;
  --accent:#00963E; --accent-soft:#DCF1E3; --accent-ink:#FFFFFF;
  --match:#0D110E; --match-ink:#FFFFFF; --match-soft:#E4E6E4;
  --gym:#2F55C9; --gym-soft:#E1E7FA; --cancha:#C46A12; --cancha-soft:#F8E9D6;
  --good:#1D8A47; --warn:#B87A06; --bad:#C0352B; --good-soft:#DCF1E3; --warn-soft:#F8EBCB; --bad-soft:#F7DDDA;
  --side:#0B0D0C; --side-ink:#ECEFEC; --side-ink-2:#8E9891; --side-hover:#1A1F1C; --side-line:#232925;
  --shadow:0 12px 40px rgba(13,17,14,.18);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0A0C0B; --surface:#141816; --surface-2:#1C211E; --ink:#ECEFEC; --ink-2:#A6B0A9; --ink-3:#727C75; --line:#28302B;
    --accent:#1FB65C; --accent-soft:#11301D; --accent-ink:#04140A;
    --match:#ECEFEC; --match-ink:#0A0C0B; --match-soft:#232825;
    --gym:#7E98F2; --gym-soft:#1C2444; --cancha:#E39A4C; --cancha-soft:#352512;
    --good:#3CC775; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#11301D; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --side:#050605; --side-hover:#141816; --side-line:#1C211E; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#0A0C0B; --surface:#141816; --surface-2:#1C211E; --ink:#ECEFEC; --ink-2:#A6B0A9; --ink-3:#727C75; --line:#28302B;
    --accent:#1FB65C; --accent-soft:#11301D; --accent-ink:#04140A;
    --match:#ECEFEC; --match-ink:#0A0C0B; --match-soft:#232825;
    --gym:#7E98F2; --gym-soft:#1C2444; --cancha:#E39A4C; --cancha-soft:#352512;
    --good:#3CC775; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#11301D; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --side:#050605; --side-hover:#141816; --side-line:#1C211E; --shadow:0 12px 40px rgba(0,0,0,.5);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}

/* ---------- sidebar ---------- */
.side{width:264px;flex:0 0 264px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin-left .22s ease}
.app.side-off .side{margin-left:-264px}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--side-line)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.tp-row{display:flex;align-items:center;gap:8px;color:var(--side-ink);margin-bottom:12px}
.tp-row .kb{width:22px;height:22px;--kb-cut:var(--side)}
.tp-name{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-ink-2)}
.tp-name b{color:var(--side-ink);font-weight:800}
.esp{display:flex;align-items:center;gap:12px;background:var(--side-hover);border:1px solid var(--side-line);border-radius:10px;padding:10px 12px}
.esp .brand{font-size:28px}
.crest{width:44px;height:auto;flex:0 0 44px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.08))}
.theme-btn{display:flex;align-items:center;justify-content:center;gap:8px;border-style:solid}
.brand-sub{font-size:12px;color:var(--side-ink-2);margin-top:4px}
.grp{padding:10px 10px 4px}
.grp-t{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-ink-2);padding:6px 8px}
.cat-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--side-ink)}
.cat-btn:hover{background:var(--side-hover)}
.cat-btn.on{background:var(--accent);color:var(--accent-ink)}
.cat-btn .nm{flex:1;font-weight:500}
.inj-dot{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px}
.cat-btn.on .inj-dot{background:rgba(0,0,0,.28)}
.side-foot{margin-top:auto;padding:12px 18px 18px;border-top:1px solid var(--side-line);display:grid;gap:8px}
.side-foot input{background:var(--side-hover);border:1px solid var(--side-line);border-radius:6px;padding:7px 9px;width:100%}
.side-foot .row{display:flex;gap:6px}
.side-foot select{background:var(--side-hover);border:1px solid var(--side-line);border-radius:6px;padding:7px 6px}
.btn-side{background:transparent;border:1px dashed var(--side-ink-2);color:var(--side-ink);border-radius:6px;padding:7px 10px;white-space:nowrap}
.ver{font-size:10.5px;color:var(--side-ink-2);font-family:var(--f-mono)}
.status{font-size:11.5px;color:var(--side-ink-2);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.status.ok i{background:var(--good)}
.scrim{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding-inline:24px;padding-block:18px 60px}
.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.burger{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px}
.burger span{display:block;width:18px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
.cat-title{flex:1;min-width:200px}
.eyebrow{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-size:13px}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(32px,5vw,48px);line-height:.95;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:118px}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.view{margin-top:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
h2{font-family:var(--f-disp);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;letter-spacing:.02em}
h3{font-family:var(--f-disp);font-weight:700;font-size:18px;text-transform:uppercase;margin:0 0 8px;letter-spacing:.04em}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-disp);font-size:20px;text-transform:uppercase;color:var(--ink);margin-bottom:4px;letter-spacing:.03em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.gym{background:var(--gym-soft);color:var(--gym)}
.chip.cancha{background:var(--cancha-soft);color:var(--cancha)}
.chip.match{background:var(--match);color:var(--match-ink)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-month{font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;min-width:190px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;min-width:660px}
.dow{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--ink-3);padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;background:none;border-top:0;border-left:0;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch;cursor:pointer}
.day:hover{background:var(--surface-2)}
.day.out{opacity:.38}
.day .n{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.day.today .n span:first-child{background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px}
.day .att{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
th button.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.bar-pct{display:inline-block;width:70px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar-pct i{display:block;height:100%}
.delta-up{color:var(--good)} .delta-down{color:var(--bad)}

/* attendance */
.att-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.P{background:var(--good);color:#fff}
.seg button.on.A{background:var(--bad);color:#fff}
.seg button.on.J{background:var(--warn);color:#fff}
.seg button.on.L{background:var(--ink-2);color:var(--surface)}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.date-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px}
.date-chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}

/* matches */
.match-list{display:grid;gap:8px}
.match{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.match .when{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;line-height:1.05}
.match .when .d{font-size:26px}
.match .when .m{font-size:13px;color:var(--ink-3);letter-spacing:.08em}
.match .vs{font-weight:600;font-size:15px}
.score{font-family:var(--f-disp);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.res{font-family:var(--f-disp);font-weight:800;font-size:14px;width:26px;height:26px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;margin-left:8px;vertical-align:4px}
.res.G{background:var(--good)} .res.E{background:var(--warn)} .res.P{background:var(--bad)}

/* testeos */
.ex-chips{display:flex;gap:6px;flex-wrap:wrap}
.ex-chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13px}
.ex-chip small{color:var(--ink-3);font-weight:500;margin-left:4px}
.ex-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-chip.on small{color:inherit;opacity:.7}
.spark{display:block}

/* injuries */
.inj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.inj{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:6px;text-align:left}
.inj.readapt{border-left-color:var(--warn)}
.inj .who{font-weight:700;font-size:15px}
.inj .days{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1}
.inj .days small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-2)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pl .dor{font-family:var(--f-disp);font-weight:800;font-size:22px;width:34px;text-align:center;color:var(--ink-3)}
.pl .nm{font-weight:600}
.pl .info{flex:1;min-width:0}

/* forms / modal */
.field{display:grid;gap:4px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.field textarea{min-height:74px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.modal-wrap{position:fixed;inset:0;background:rgba(10,14,12,.5);display:flex;justify-content:flex-end;z-index:50}
.modal{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-h{position:sticky;top:0;background:var(--surface);padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;z-index:2}
.modal-h .t{flex:1}
.modal-b{padding:16px 20px;display:grid;gap:14px}
.modal-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
.modal-f .grow{flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-3);padding:2px 6px}
.stype{display:flex;gap:6px}
.stype button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:center;align-items:center;gap:8px}
.stype button.on.gym{border-color:var(--gym);color:var(--gym);background:var(--gym-soft)}
.stype button.on.cancha{border-color:var(--cancha);color:var(--cancha);background:var(--cancha-soft)}
.stype .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plan{background:transparent;border:1.5px dashed currentColor;padding:0 5px}
.chip.susp{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.rut-note{background:var(--surface-2);border-left:3px solid var(--ink-3);border-radius:6px;padding:10px 12px;font-size:13px;display:grid;gap:8px}
.rut-acts{display:flex;gap:6px;flex-wrap:wrap}
.rut-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

.tp-login{display:flex;align-items:center;gap:10px}.tp-login .kb{width:34px;height:34px;color:var(--ink)}
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .25s}
#boot.off{opacity:0;pointer-events:none}
.boot-in{display:grid;justify-items:center;gap:8px;text-align:center}
.boot-in img{width:72px;height:72px;border-radius:16px}
.boot-in b{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.boot-in b span{color:var(--accent)}
.boot-in small{color:var(--ink-3);font-size:13px}
.boot-in i{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.boot-in i::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);border-radius:3px;animation:bootbar 1s ease-in-out infinite}
@keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.boot-in i::after{animation:none}}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;padding-inline:16px}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(380px,100%);display:grid;gap:14px;box-shadow:var(--shadow)}
.status button{background:none;border:0;color:var(--side-ink);text-decoration:underline;padding:0;font-size:11.5px;margin-left:auto}
/* ---- compartir en modo solo lectura ---- */
.sh-on{background:var(--good);color:#fff;border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:800;letter-spacing:.04em;opacity:1}
.sw{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked+i{background:var(--good)}
.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}
.sw b{display:block;font-size:15px}
.sh-link{display:flex;gap:8px}.sh-link .inp{flex:1;min-width:0}
.ro-band{background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.ro-band b{font-weight:800;white-space:nowrap}

body.ro .modal-b button:not([data-stype]):not(.ld-btn):not([data-rok]):not([data-close]){display:none!important}

.sp-badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;font-weight:800;padding:2px 7px;align-self:center}

function clean(o){return JSON.parse(JSON.stringify(o));}
const Store={
  mode:'loading', fs:null, local:ls.get('pfclub-local',{}), lsubs:[], csubs:[],
  async init(){
    if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined'){this.mode='local';return;}
    firebase.initializeApp(FIREBASE_CONFIG);
    this.fs=firebase.firestore();
    /* la pestaña que se abre última es la que manda (si quedó otra abierta y dormida en el celu, ya no traba esta).
       En algunos celulares esto puede quedar colgado: no lo esperamos más de 2,5 s */
    try{await Promise.race([this.fs.enablePersistence({experimentalForceOwningTab:true}),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
    this.mode='cloud';
  },
  watch(coll,field,val,cb){
    if(this.mode==='cloud'){
      let q=this.fs.collection(coll); if(field) q=q.where(field,'==',val);
      const sub={coll,field,val,cb,un:null,dead:false,fails:0};
      sub.start=()=>{sub.dead=false;sub.un=q.onSnapshot(s=>{sub.fails=0;cb(s.docs.map(d=>Object.assign({id:d.id},d.data())));},
        e=>{console.warn(coll,e);sub.dead=true;sub.fails++;sub.code=e&&e.code;

      return ()=>{this.csubs=this.csubs.filter(x=>x!==sub);try{sub.un&&sub.un();}catch(e){}};
    }
    const sub={coll,field,val,cb}; this.lsubs.push(sub); this._emit(sub);
    return ()=>{this.lsubs=this.lsubs.filter(x=>x!==sub);};
  },
  _emit(sub){const c=this.local[sub.coll]||{};const arr=Object.keys(c).map(id=>Object.assign({id},c[id])).filter(x=>!sub.field||x[sub.field]===sub.val);sub.cb(arr);},
  _changed(coll){ls.set('pfclub-local',this.local);this.lsubs.filter(s=>s.coll===coll).forEach(s=>this._emit(s));},
  /* En la nube no esperamos la confirmación del servidor: Firestore aplica el cambio
     al toque en pantalla y lo sube cuando hay señal (sirve en la cancha sin wifi). */
  async put(coll,id,data){
    if(RO){roMsg();return;}
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).set(clean(data)).catch(handleErr); NET.wrote(); return; }
    (this.local[coll]=this.local[coll]||{})[id]=clean(data); this._changed(coll);
  },
  /* cambia solo algunos campos del documento (sin pisar el resto) */
  async patch(coll,id,fields){
    if(RO){roMsg();return;}
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).set(clean(fields),{mergeFields:Object.keys(fields)}).catch(handleErr); NET.wrote(); return; }
    const c=(this.local[coll]=this.local[coll]||{});c[id]=Object.assign({},c[id]||{},clean(fields)); this._changed(coll);
  },
  async getAll(coll){
    if(this.mode==='cloud'){const s=await this.fs.collection(coll).get();const o={};s.docs.forEach(d=>o[d.id]=d.data());return o;}
    return clean(this.local[coll]||{});
  },
  async putMany(coll,obj){
    if(RO){roMsg();return;}
    const ids=Object.keys(obj);
    if(this.mode==='cloud'){
      for(let i=0;i<ids.length;i+=400){const b=this.fs.batch();ids.slice(i,i+400).forEach(id=>b.set(this.fs.collection(coll).doc(id),clean(obj[id])));await b.commit();}
      return;
    }
    this.local[coll]=this.local[coll]||{};ids.forEach(id=>this.local[coll][id]=clean(obj[id]));this._changed(coll);
  },
  async remove(coll,id){
    if(RO){roMsg();return;}
    if(this.mode==='cloud'){ this.fs.collection(coll).doc(id).delete().catch(handleErr); NET.wrote(); return; }
    if(this.local[coll]) delete this.local[coll][id]; this._changed(coll);
  }
};
/* antes de cambiar o borrar una asignación, sus pesos quedan guardados con el nombre de la rutina */
{const _put=Store.put,_rm=Store.remove;

function handleErr(e){
  const c=e&&e.code;
  if(c==='permission-denied'&&RO) return roBlocked();
  if(c==='permission-denied'&&Store.mode==='cloud'){const u=firebase.auth().currentUser;

/* ---- estado de la conexión: lo que muestra el puntito de abajo del menú ---- */
const NET={on:false,cache:true,pend:false,t0:Date.now(),rt:null,wait:4000,
  start(){if(this.on||Store.mode!=='cloud')return;this.on=true;
    Store.fs.collection('config').limit(1).onSnapshot({includeMetadataChanges:true},s=>{this.cache=s.metadata.fromCache;this.upd();},()=>{});
    const wake=()=>{this.t0=Date.now();this.revive();this.upd();setTimeout(()=>this.upd(),6500);};
    window.addEventListener('online',wake);window.addEventListener('offline',()=>this.upd());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
    setTimeout(()=>this.upd(),6000);this.upd();},
  wrote(){if(Store.mode!=='cloud')return;this.pend=true;this.upd();
    Store.fs.waitForPendingWrites().then(()=>{this.pend=false;this.upd();},()=>{});},
  retry(){if(this.rt)return;this.rt=setTimeout(()=>{this.rt=null;this.revive();this.wait=Math.min(this.wait*2,60000);},this.wait);},
  revive(){const d=Store.csubs.filter(x=>x.dead);if(!d.length){this.wait=4000;return;}
    d.forEach(x=>{try{x.un&&x.un();}catch(e){}x.start();});this.upd();},
  upd(){if(!this.on||RO)return;const el=$('#status');const u=firebase.auth().currentUser;
    const off=!navigator.onLine||(this.cache&&Date.now()-this.t0>6000);const dead=Store.csubs.some(x=>x.dead);
    let ok=false,txt;
    if(!navigator.onLine)txt=this.pend?'Sin internet · hay cambios esperando para subirse':'Sin internet · lo que cargues se sube cuando vuelva';

    else if(this.cache)txt='Conectando…';
    else if(this.pend)txt='Subiendo cambios…';
    else{ok=true;txt='Sincronizado · '+(u?u.email:'');}
    el.className='status'+(ok?' ok':'');
    el.innerHTML='<i></i><span>'+esc(txt)+'</span><button id="logout">Salir</button>';
    $('#logout').onclick=()=>firebase.auth().signOut().then(()=>location.reload());}
};

function selectCat(id){

  if(!id) return;
  const changed=id!==S.cat||!catUnsubs.length;
  S.cat=id;ls.set('pf-cat',id);

    catUnsubs.forEach(u=>{try{u();}catch(e){}});
    S.jug=[];S.dni=[];S.ses=[];S.par=[];S.asis=[];S.tes=[];S.atl=[];

      Store.watch('jugadores','cat',id,a=>{S.jug=a;render();migrateDni(a);}),

function statsOn(c){c=c||S.cats.find(x=>x.id===S.cat)||{};if(c.stats===true)return true;if(c.stats===false)return false;return !/^u1[357]/i.test(String(c.grupo||c.nombre||'').trim());}
function openCat(){
  const c=S.cats.find(x=>x.id===S.cat);if(!c)return;
  const groups=[...new Set(S.cats.map(x=>x.grupo).filter(Boolean))];
  const b='<div class="form-grid"><div class="field" style="grid-column:1/-1"><label for="c_n">Nombre</label><input id="c_n" value="'+esc(c.nombre)+'"></div>'+
    '<div class="field" style="grid-column:1/-1"><label for="c_g">Grupo en el menú</label><input id="c_g" list="grpList" value="'+esc(c.grupo||'')+'" placeholder="Ej: U13"><datalist id="grpList">'+groups.map(g=>'<option value="'+esc(g)+'"></option>').join('')+'</datalist></div>'+
    '<div class="field"><label for="c_r">Rama</label><select id="c_r"><option value="f"'+(catRama(c)==='f'?' selected':'')+'>Femenino</option><option value="m"'+(catRama(c)==='m'?' selected':'')+'>Masculino</option></select></div></div>'+
    '<label class="check" style="margin:2px 0"><input type="checkbox" id="c_st"'+(statsOn(c)?' checked':'')+'> Usar <b>Estadísticas</b> de partido en esta categoría</label>'+

    '<p class="tiny" style="margin:0">Cambiar el nombre no afecta nada de lo cargado: plantel, sesiones, asistencia, testeos y lesiones siguen en esta categoría.</p>';
  openModal(modalHead('Categoría','Editar '+c.nombre)+'<div class="modal-b">'+b+'</div><div class="modal-f"><button class="btn danger" id="c_del">Borrar categoría</button><div class="grow"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="c_save">Guardar</button></div>',mw=>{
    const move=dir=>{
      const list=S.cats.slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
      const i=list.findIndex(x=>x.id===c.id),j=i+dir;if(j<0||j>=list.length)return;
      [list[i],list[j]]=[list[j],list[i]];
      list.forEach((x,k)=>{const o=(k+1)*10;if(x.orden!==o){const d=Object.assign({},x,{orden:o});delete d.id;x.orden=o;Store.put('categorias',x.id,d);}});
      renderNav();toast(dir<0?'Subió un lugar':'Bajó un lugar');
    };
    mw.querySelector('#c_up').onclick=()=>move(-1);
    mw.querySelector('#c_dn').onclick=()=>move(1);
    armDelete(mw.querySelector('#c_del'),async()=>{await Store.remove('categorias',c.id);closeModal();toast('Categoría borrada');});

      const n=mw.querySelector('#c_n').value.trim(),g=mw.querySelector('#c_g').value.trim();

function attStats(){
  const st={};S.jug.forEach(j=>st[j.id]={P:0,A:0,J:0,L:0,t:0});
  S.asis.forEach(a=>{const m=a.marcas||{};Object.keys(m).forEach(jid=>{if(st[jid]&&st[jid][m[jid]]!=null){st[jid][m[jid]]++;st[jid].t++;}});});
  Object.values(st).forEach(s=>{s.pct=s.t?Math.round(s.P*100/s.t):null;});
  return st;
}
function renderKpis(){
  if(!S.cat){$('#kpis').innerHTML='';return;}
  if(S.cat===PERS)return kpisPers();
  const st=attStats();const pcts=Object.values(st).map(s=>s.pct).filter(p=>p!=null);
  const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):null;
  const next=S.par.filter(p=>p.fecha>=TODAY).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
  const inj=lesOf().filter(activeInj).length;
  let ses=0;{const d0=pISO(TODAY.slice(0,8)+'01');const m=d0.getMonth();while(d0.getMonth()===m){ses+=sessionsOn(iso(d0)).filter(x=>!x.suspendida).length;d0.setDate(d0.getDate()+1);}}
  $('#kpis').innerHTML=
    kpi('Plantel',S.jug.length,'jug.')+
    kpi('Asistencia prom.',avg==null?'—':avg+'%','')+
    kpi('Sesiones este mes',ses,'')+
    kpi('Lesionados',inj,'activos')+
    kpi('Próximo partido',next?esc(fmtD(next.fecha,{day:'numeric',month:'short'})):'—',next?'vs '+esc(next.rival):'');
}
function kpi(k,v,s){return '<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+(s?' <small>'+s+'</small>':'')+'</div></div>';}

/* ================= calendario: mes / semana / día ================= */
function sesContent(x,fecha){
  if(x.src==='rut'){const w=weekIdx(x.asig,fecha);const s=resolveDay(x.dia,w);s.hora=x.hora;s.rutDia=x.dia.nombre;s.semana=w+1;s.semTot=x.asig.semanas||0;return {s,rut:x.rut,exists:false};}
  return {s:x,rut:x.rutina?rutById(x.rutina):null,exists:true};
}
function presText(e,b){
  const ser=e.series||b.series||'';const reps=(e.reps||[]).filter(v=>v!=='');
  const r=reps.length?(e.dist?reps.join('-'):reps[0]):'';
  return ser&&r?ser+'×'+r:(r||(ser?ser+' series':''));
}
function attOf(f){const a=S.asis.find(x=>x.fecha===f);if(!a)return null;const m=a.marcas||{};return {p:Object.values(m).filter(x=>x==='P').length,t:Object.keys(m).length};}
const calStart=f=>addDays(f,-wdOf(f));
function calTitle(){
  const f=S.calDate;
  if(S.calView==='mes')return pISO(f).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  if(S.calView==='semana'){const a=calStart(f),b=addDays(a,6);const A=pISO(a),B=pISO(b);
    return A.getMonth()===B.getMonth()?A.getDate()+' – '+B.getDate()+' '+B.toLocaleDateString('es-AR',{month:'short',year:'numeric'}):fmtD(a,{day:'numeric',month:'short'})+' – '+fmtD(b,{day:'numeric',month:'short',year:'numeric'});}
  return fmtD(f,{weekday:'long',day:'numeric',month:'long'});
}
function calMove(dir){
  const f=S.calDate;
  if(S.calView==='mes'){const d=pISO(f);S.calDate=iso(new Date(d.getFullYear(),d.getMonth()+dir,1));}
  else S.calDate=addDays(f,dir*(S.calView==='semana'?7:1));
  ls.set('pf-caldate',S.calDate);render();
}
function vCal(){
  const views=[['mes','Mes'],['semana','Semana'],['dia','Día']];
  const unit={mes:'Mes',semana:'Semana',dia:'Día'}[S.calView];
  let h='<div class="bar"><div class="cal-nav"><button class="btn sm" data-act="cprev" aria-label="'+unit+' anterior">←</button><div class="cal-month">'+esc(calTitle())+'</div><button class="btn sm" data-act="cnext" aria-label="'+unit+' siguiente">→</button><button class="btn sm ghost" data-act="ctoday">Hoy</button></div><div class="grow"></div>'+
    '<div class="seg cal-seg" role="group" aria-label="Vista del calendario">'+views.map(v=>'<button class="'+(S.calView===v[0]?'on':'')+'" data-calview="'+v[0]+'" aria-pressed="'+(S.calView===v[0])+'">'+v[1]+'</button>').join('')+'</div></div>';
  if(S.calView==='semana')return h+vWeek();
  if(S.calView==='dia')return h+vDayFull();
  return h+vMonth();
}
function vMonth(){
  const d0=pISO(S.calDate), y=d0.getFullYear(), mo=d0.getMonth();
  const first=new Date(y,mo,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const parBy={};S.par.forEach(p=>{(parBy[p.fecha]=parBy[p.fecha]||[]).push(p);});
  let h='<div class="legend" style="margin:-4px 0 10px"><span><i style="background:var(--gym)"></i>Gym</span><span><i style="background:var(--cancha)"></i>Cancha</span><span><i style="background:var(--match)"></i>Partido</span><span><i style="border:1.5px dashed var(--ink-3)"></i>De una rutina</span><span class="mono">P/T = presentes</span></div>';
  h+='<div class="cal-scroll"><div class="cal">'+WD.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    if(i>=35&&d.getMonth()!==mo)break;
    const at=attOf(k);
    h+='<button class="day'+(d.getMonth()!==mo?' out':'')+(k===TODAY?' today':'')+'" data-day="'+k+'"><div class="n"><span>'+d.getDate()+'</span>'+(at?'<span class="att">'+at.p+'/'+at.t+'</span>':'')+'</div>'+
      (parBy[k]||[]).map(p=>'<span class="chip match">vs '+esc(p.rival)+'</span>').join('')+
      sessionsOn(k).map(sesChip).join('')+'</button>';
  }
  return h+'</div></div><p class="tiny" style="margin-top:10px">Tocá cualquier día para ver o planificar la sesión de gym o de cancha.</p>';
}
function vWeek(){
  const a=calStart(S.calDate);
  let h='<div class="week">';
  for(let i=0;i<7;i++){
    const f=addDays(a,i);const d=pISO(f);const at=attOf(f);
    const ms=S.par.filter(p=>p.fecha===f);const ss=sessionsOn(f);
    h+='<div class="wk-day'+(f===TODAY?' today':'')+(ss.length||ms.length?'':' empty-day')+'">'+
      '<button class="wk-head" data-godia="'+f+'"><span class="wk-dow">'+WD[i]+'</span><span class="wk-n">'+d.getDate()+'</span>'+(at?'<span class="att">'+at.p+'/'+at.t+'</span>':'')+'</button>';
    h+=ms.map(p=>'<div class="chip match wk-match">vs '+esc(p.rival)+(p.hora?' · '+esc(p.hora):'')+'</div>').join('');
    h+=ss.map(x=>{
      const PP=sesParts(x,f);if(PP&&!x.suspendida)return '<div class="wk-ss">'+PP.map((p,i)=>'<button class="wk-ses '+x.tipo+' ss-w c'+(i%4)+'" data-day="'+f+'" data-tipo="'+x.tipo+'" data-si="'+i+'"><div class="wk-ses-h"><span class="ss-n">'+esc(p.n)+'</span>'+(p.hora?'<span class="mono tiny">'+esc(p.hora)+'</span>':'')+'</div>'+(p.content.md||p.content.objetivo?'<div class="tiny">'+esc([p.content.md,p.content.objetivo].filter(Boolean).join(' · '))+'</div>':'')+'<div class="tiny">'+(p.jug.length?p.jug.length+' jug.':'todos')+'</div></button>').join('')+'</div>';
      const c=sesContent(x,f),s=c.s;
      if(s.suspendida)return '<button class="wk-ses susp" data-day="'+f+'" data-tipo="'+x.tipo+'"><span class="chip susp">'+(x.tipo==='gym'?'Gym':'Cancha')+' suspendido</span></button>';
      const bl=toBloques(s,x.tipo).filter(b=>(b.ejercicios||[]).some(e=>e.n));
      const title=x.src==='rut'?(s.rutDia||''):(s.objetivo||(c.rut?c.rut.nombre:''));
      return '<button class="wk-ses '+x.tipo+(x.src==='rut'?' plan':'')+'" data-day="'+f+'" data-tipo="'+x.tipo+'">'+
        '<div class="wk-ses-h"><span class="chip '+x.tipo+'">'+(x.tipo==='gym'?'Gym':'Cancha')+'</span>'+(x.trab?'<span class="tr-tag">'+x.trab.length+' trabajos</span>':'')+(s.hora?'<span class="mono tiny">'+esc(s.hora)+'</span>':'')+(s.semana?'<span class="tiny">Sem '+s.semana+'</span>':'')+'</div>'+
        (title?'<div class="wk-t">'+esc(title)+'</div>':'')+(c.rut&&x.src==='rut'?'<div class="tiny">'+esc(c.rut.nombre)+'</div>':'')+
        (bl.length?'<ol class="wk-ex">'+bl.map((b,bi)=>(b.ejercicios||[]).filter(e=>e.n).map((e,ei)=>'<li><span class="mono">'+String.fromCharCode(65+bi)+(ei+1)+'</span> '+esc(e.n)+' <b'+(e.progW?' class="prog"':'')+'>'+esc(presText(e,b))+'</b></li>').join('')).join('')+'</ol>':'')+
      '</button>';
    }).join('');
    if(!ss.length&&!ms.length)h+='<button class="wk-add" data-day="'+f+'">+ Planificar</button>';
    h+='</div>';
  }
  return h+'</div>';
}
function vDayFull(){
  const f=S.calDate;const ss=sessionsOn(f);const ms=S.par.filter(p=>p.fecha===f);const at=attOf(f);
  let h='<div class="dayv-top">'+(at?'<span class="pill neutral">Asistencia: '+at.p+'/'+at.t+' presentes</span>':'')+'<div class="grow"></div><button class="btn" data-act="dayAtt">Tomar asistencia</button><button class="btn" data-day="'+f+'">+ Planificar sesión</button></div>';
  h+=ms.map(p=>'<div class="day-match">Partido: vs '+esc(p.rival)+(p.hora?' · '+esc(p.hora)+' h':'')+(p.condicion?' · '+esc(p.condicion):'')+'</div>').join('');

function repsHtml(reps,dist,n){

/* ---------- pegar rutina como texto ---------- */
const RX_PRES=/(\d{1,2})\s*[x×X*]\s*(\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?(?:\s*[-\/,]\s*\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?)*)/;
const RX_SDE=/(\d{1,2})\s*series?\s*(?:de|x)\s*(\d+(?:\s*[-\/,]\s*\d+)*)/i;
const RX_LIST=/(?:^|\s)(\d+(?:\s*[-\/]\s*\d+){1,11})(?=\s|$)/;
const RX_HEAD=/^(bloque|circuito|superserie|biserie|triserie|parte|serie\s+[a-z\d]|activaci[oó]n|core|potencia|fuerza|accesorios?)\b/i;
function splitReps(str){return str.split(/\s*[-\/,]\s*/).map(x=>x.trim()).filter(Boolean);}
function parseExercise(line){
  const parts=line.split(/\s+\/\s+|\s*\|\s*/);
  if(parts.length>1&&parts.slice(1).every(p=>/^\d{1,2}\s*[x×X*]\s*\d/.test(p.trim())||/^@?\s*\d+(?:[.,]\d+)?\s*(?:%|kg|x\s*pc|reps?)/i.test(p.trim())||/^\d{1,3}(?:\s*[-\/]\s*\d{1,3})*$/.test(p.trim()))){const e=parseExercise(parts[0]);e.prog=['',...parts.slice(1).map(x=>x.trim())];return e;}
  let link='';
  line=line.replace(/(https?:\/\/\S+|(?:www\.)?(?:youtu\.be|youtube\.com|drive\.google\.com)\/\S+)/i,m=>{link=m;return ' ';});
  line=line.replace(/^\s*(?:[-•*·–]+|\d{1,2}[.)]|[a-z]\d{1,2}[.):-]?|[a-z][.)])\s+/i,'').trim();
  let m,series='',reps=[],name=line,rest='',raw='',expl=false;
  if((m=line.match(RX_PRES))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_SDE))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_LIST))){reps=splitReps(m[1]);series=String(reps.length);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(/\s[x×]\s*(\d+)\b/))){reps=[m[1]];name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  name=name.replace(/[\s:,\-–(]+$/,'').trim();
  const c=rest.replace(/^[\s,;:\-–@)]+/,'').replace(/[\s,;(]+$/,'').trim();
  /* "3x8-8" (por lado) o "3x12/15" (rango): si la cantidad no coincide con las series, se respeta tal cual */
  if(expl&&reps.length>1&&reps.length!==+series)return {n:name,series,reps:[raw.replace(/\s+/g,'').trim()],dist:false,c,link};
  const uniq=[...new Set(reps)];
  const dist=reps.length>1&&uniq.length>1;
  return {n:name,series,reps:dist?reps:[uniq[0]||''],dist,c,link};
}
function parseRoutineText(txt){
  const lines=txt.replace(/\r/g,'').split('\n');
  const blocks=[];let cur=null;let blankBreak=false;
  const hasHeaders=lines.some(l=>{const t=l.trim();return t&&!RX_PRES.test(t)&&(RX_HEAD.test(t)||/:\s*$/.test(t));});
  const newBlock=(nombre,series)=>{cur={nombre:nombre||('Bloque '+(blocks.length+1)),series:series||'',nota:'',ejercicios:[]};blocks.push(cur);};
  lines.forEach(raw=>{
    const t=raw.trim();
    if(!t){blankBreak=true;return;}
    const isHead=!RX_PRES.test(t)&&!RX_SDE.test(t.replace(/^.*?(\d+\s*series?\s*de)/i,'$1'))&&(RX_HEAD.test(t)||/:\s*$/.test(t));
    if(isHead){
      const sm=t.match(/(\d{1,2})\s*(?:series|sets|vueltas|rondas)/i);
      const nombre=t.replace(/(\(|[-–:,]\s*)?\d{1,2}\s*(?:series|sets|vueltas|rondas)\)?/i,'').replace(/[\s:\-–]+$/,'').trim();
      newBlock(nombre,sm?sm[1]:'');blankBreak=false;return;
    }
    if(/^(pausa|descanso|nota|obs)/i.test(t)&&cur){cur.nota=(cur.nota?cur.nota+' · ':'')+t;return;}
    if(!cur||(blankBreak&&!hasHeaders&&cur.ejercicios.length))newBlock();
    blankBreak=false;
    const e=parseExercise(t);if(e.n)cur.ejercicios.push(e);
  });
  blocks.forEach(b=>{
    const ss=b.ejercicios.map(e=>e.series).filter(Boolean);
    if(!b.series&&ss.length===b.ejercicios.length&&ss.length&&new Set(ss).size===1)b.series=ss[0];
    b.ejercicios.forEach(e=>{if(e.series&&e.series===b.series)e.series='';});
  });
  return blocks.filter(b=>b.ejercicios.length||b.nota);
}

function calorBlock(txt){
  const ej=[];const notas=[];
  String(txt).split(/\n+/).map(x=>x.replace(/^[-•*·\d.)\s]+/,'').trim()).filter(Boolean).forEach(l=>{
    if(l.split(/\s+/).length>9){notas.push(l);return;}
    const e=parseExercise(l);ej.push(e&&e.n?Object.assign({},e,{n:String(e.n).toLocaleUpperCase('es')}):{n:l.toLocaleUpperCase('es')});});
  return {nombre:'Entrada en calor',obj:'movact',series:'',nota:notas.join(' · '),ejercicios:ej.length?ej:[{},{}]};
}

function applyProg(e,b,txt){

  const p=parseExercise('X '+txt);

    /* la semana solo cambia reps ("12 reps") o carga ("75%", "80kg", "1.5xPC") */
    /* "6" o "6 reps" = repeticiones; "6 reps 80kg" = reps + carga */
    const m=txt.match(/^(\d{1,3})(?:\s*(?:reps?|repeticiones)\b\s*(.*))?$/i);
    if(m){o.reps=[m[1]];o.dist=false;if(m[2]&&m[2].trim())o.c=m[2].replace(/^[\s,;:\-–@]+/,'').trim();}

  const lm=txt.match(/^(\d+(?:\s*[-\/,]\s*\d+)+)/);
  if(!/[x×*]/i.test(txt)&&lm){
    const eff=+(e.series||b.series||0),n=lm[1].split(/\s*[-\/,]\s*/).length;
    if(eff&&n!==eff){o.reps=[lm[1].replace(/\s+/g,'')];o.dist=false;const rest=txt.slice(lm[0].length).replace(/^[\s,;:\-–@]+/,'').trim();if(rest)o.c=rest;return o;}

        '<td class="r mono">'+(over?'<span class="pill bad" title="Supera su 1RM">'+pctT+'</span>':pctT)+'</td><td class="r mono">'+pcT+'</td>'+

    }).join('')+'</tbody></table></div></div>';
  return h;
}

      const k=sel.dataset.map;const cur=S.lib.find(x=>x.id===k)||{};
      const nombre=cur.nombre||sel.closest('.ld-sec').dataset.exname;
      const d=Object.assign({},cur,{nombre,link:cur.link||'',test:sel.value});delete d.id;

function prescripcion(e,b){
  const ser=e.series||b.series||'';
  const reps=(e.reps||[]).filter(x=>x!=='');
  let r='';
  if(reps.length) r=e.dist?reps.join('-'):reps[0];
  if(ser&&r) return '<b>'+esc(ser)+'</b><i>×</i><b>'+esc(r)+'</b>';
  if(r) return '<b>'+esc(r)+'</b>';
  if(ser) return '<b>'+esc(ser)+'</b> <i>series</i>';
  return '';
}
function fichaText(t,label){return t?'<div class="f-sec"><div class="f-lbl">'+label+'</div><div class="f-txt">'+esc(t)+'</div></div>':'';}
/* si el ejercicio de la rutina no tiene video, usa el link guardado en la biblioteca */
function libLinkOf(n){const k=slug(n||'');const x=S.lib.find(y=>y.id===k);return x&&x.link||'';}
function fichaHtml(s,tipo,fecha,rut){
  const meta=[];

  if(s.duracion)meta.push('<span><small>Duración</small><b>'+esc(s.duracion)+'′</b></span>');

  if(s.md)meta.push('<span><small>Momento</small><b>'+esc(s.md)+'</b></span>');else if(s.micro)meta.push('<span><small>Microciclo</small><b>'+esc(s.micro)+'</b></span>');

  let h='<div class="ficha '+tipo+'">'+

    (meta.length?'<div class="f-meta">'+meta.join('')+'</div>':'')+
    fichaText(s.calor,tipo==='gym'?'Entrada en calor / activación':'Entrada en calor');
  if(bloques.length){
    h+='<div class="f-blocks">'+bloques.map((b,bi)=>{
      const L=String.fromCharCode(65+bi);
      const ej=(b.ejercicios||[]).filter(e=>e.n);

        (b.nota?'<div class="f-blk-nota">'+esc(b.nota)+'</div>':'')+
        ej.map((e,ei)=>'<div class="f-ex"><span class="f-ex-i">'+L+(ei+1)+'</span><span class="f-ex-n">'+(RO||!ATLCTX?esc(e.n):'<button type="button" class="atlex-b" data-atlex="'+esc(e.n)+'">'+esc(e.n)+atlBadge(e.n)+'</button>')+
          (()=>{const lk=e.link||libLinkOf(e.n);return lk?' '+vidBtn(lk):'';})()+(e.obs?'<i class="f-ex-obs">'+esc(e.obs)+'</i>':'')+'</span>'+
          '<span class="f-ex-p'+(e.progW?' prog':'')+'"'+(e.progW?' title="Cambia esta semana"':'')+'>'+prescripcion(e,b)+'</span><span class="f-ex-c">'+(e.c?esc(e.c):'')+(fecha&&parseLoad(e.c)?'<button type="button" class="ld-btn" data-loads="'+bi+':'+ei+'" data-lday="'+fecha+'" data-ltipo="'+tipo+'">kg por jugador</button>':'')+'</span></div>').join('')+
      '</div>';
    }).join('')+'</div>';

  return h+'</div>';

/* ---------- imprimir rutina como planilla ---------- */
function printRut(rid,aid){const r=rutById(rid);if(!r)return;printRutObj(r,aid?S.asigAll.find(x=>x.id===aid):null);}
function printRutObj(r,a){
  const ds=rutDays(r);
  const W=(a&&a.semanas)||r.semanas||4;
  const anyProg=ds.some(d=>(d.bloques||[]).some(b=>(b.ejercicios||[]).some(e=>(e.prog||[]).some(Boolean))));
  const weeks=anyProg?W:1;
  const meta=[r.tipo==='cancha'?'Cancha':'Gimnasio'];
  if(a){meta.push(catName(a.cat));meta.push(vigText(a));}else meta.push(W+(W===1?' semana':' semanas'));
  let h='<header class="p-head"><h1>'+esc(r.nombre||'Rutina')+'</h1><div class="p-meta">'+meta.map(esc).join(' · ')+'</div></header>';
  ds.forEach((d,di)=>{
    const h0=a&&(a.horario||[])[di];
    const res=[];for(let w=0;w<weeks;w++)res.push(resolveDay(d,w));
    h+='<section class="p-day"><h2>'+esc(d.nombre||('Día '+(di+1)))+(h0&&h0.d!=null?' <span>· '+WDL[h0.d]+(h0.hora?' '+esc(h0.hora):'')+'</span>':'')+'</h2>';
    const info=[];if(d.objetivo)info.push('<b>Objetivo:</b> '+esc(d.objetivo));if(d.duracion)info.push('<b>Duración:</b> '+esc(d.duracion)+'′');if(d.rpe)info.push('<b>RPE:</b> '+esc(d.rpe));
    if(info.length)h+='<p class="p-info">'+info.join(' &nbsp;·&nbsp; ')+'</p>';
    if(d.calor)h+='<p class="p-info"><b>Entrada en calor:</b> '+esc(d.calor).replace(/\n/g,'<br>')+'</p>';
    const bl=(d.bloques||[]);
    if(bl.some(b=>(b.ejercicios||[]).some(e=>e.n))){
      const hasC=bl.some(b=>(b.ejercicios||[]).some(e=>e.n&&e.c));
      const nCols=2+(anyProg?weeks:1)+(hasC?1:0);
      h+='<table class="p-t"><thead><tr><th class="p-i"></th><th>Ejercicio</th>'+(anyProg?Array.from({length:weeks},(_,w)=>'<th class="p-w">Sem '+(w+1)+'</th>').join(''):'<th class="p-w">Series × reps</th>')+(hasC?'<th class="p-c">'+(anyProg?'Carga (sem 1)':'Carga')+'</th>':'')+'</tr></thead><tbody>';
      let L=0;
      bl.forEach((b,bi)=>{
        const ex=(b.ejercicios||[]).map((e,ei)=>({e,ei})).filter(x=>x.e.n);if(!ex.length)return;
        const letter=String.fromCharCode(65+L++);
        h+='<tr class="p-blk"><td colspan="'+nCols+'"><b>'+letter+' · '+esc(b.nombre||('Bloque '+(bi+1)))+'</b>'+(b.series?' — '+esc(b.series)+' series':'')+(b.nota?' — <i>'+esc(b.nota)+'</i>':'')+'</td></tr>';
        ex.forEach(({e,ei},k)=>{
          let prev='';
          const cells=res.map((rd,w)=>{
            const rb=rd.bloques[bi],re=rb.ejercicios[ei];
            const txt=presText(re,rb)||'—';const cg=re.c!==e.c&&re.c?' <small>'+esc(re.c)+'</small>':'';
            const chg=w>0&&txt+cg!==prev;prev=txt+cg;
            return '<td class="p-w'+(chg?' chg':'')+'">'+esc(txt)+cg+'</td>';
          }).join('');
          h+='<tr><td class="p-i">'+letter+(k+1)+'</td><td class="p-n">'+esc(e.n)+(e.obs?'<i class="p-ob">'+esc(e.obs)+'</i>':'')+'</td>'+cells+(hasC?'<td class="p-c">'+esc(e.c||'')+'</td>':'')+'</tr>';
        });
      });
      h+='</tbody></table>';
    }
    if(r.tipo==='cancha'){if(d.principal)h+='<p class="p-info"><b>Parte principal:</b> '+esc(d.principal).replace(/\n/g,'<br>')+'</p>';if(d.calma)h+='<p class="p-info"><b>Vuelta a la calma:</b> '+esc(d.calma).replace(/\n/g,'<br>')+'</p>';}
    if(d.notas)h+='<p class="p-info"><b>Notas:</b> '+esc(d.notas).replace(/\n/g,'<br>')+'</p>';
    h+='</section>';
  });
  if(anyProg)h+='<p class="p-foot">En negrita: lo que cambia respecto de la semana anterior.</p>';
  /* sin márgenes del navegador (ahí van fecha, título y link): el margen lo pone la tabla de abajo,
     cuyo encabezado y pie vacíos se repiten en cada hoja */
  const pa=$('#printArea');pa.innerHTML='<table class="p-wrap"><thead><tr><td><div class="p-sp"></div></td></tr></thead><tbody><tr><td>'+h+'</td></tr></tbody><tfoot><tr><td><div class="p-sp"></div></td></tr></tfoot></table>';
  document.body.classList.add('printing');
  const oldTitle=document.title;document.title=r.nombre||'Rutina';   /* nombre del PDF al guardar */
  const done=()=>{document.body.classList.remove('printing');pa.innerHTML='';document.title=oldTitle;window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print();}catch(e){toast('No se pudo abrir la impresión en este navegador');done();}},80);
}

/* ---------- rutinas: biblioteca + asignaciones ---------- */
const rutById=id=>S.rutAll.find(r=>r.id===id)||(S.tplAll||[]).find(r=>r.id===id)||null;
const asigOfCat=c=>S.asigAll.filter(a=>a.cat===c);
const catName=id=>(S.cats.find(c=>c.id===id)||{}).nombre||id;
function asigState(a){if(a.hasta&&a.hasta<TODAY)return 'fin';if(a.desde>TODAY)return 'prox';return 'vig';}
function schedText(r,a){
  const ds=r?rutDays(r):[];
  return ds.map((d,i)=>{const h=(a.horario||[])[i]||{};return '<span><b>'+esc(d.nombre||('Día '+(i+1)))+'</b> '+(h.d!=null?WD[h.d]:'sin día')+(h.hora?' '+esc(h.hora):'')+'</span>';}).join('');

/* Pasa las rutinas viejas (guardadas dentro de una categoría) a la biblioteca + una asignación. Corre una vez. */
let migrated=false;
async function migrateRutinas(){
  if(migrated)return;migrated=true;
  try{
    const R=await Store.getAll('rutinas'),A=await Store.getAll('asignaciones');
    for(const id of Object.keys(R)){
      const r=R[id];if(!r.cat)continue;
      const ds=rutDays(r);
      if(!A['mig_'+id])await Store.put('asignaciones','mig_'+id,{cat:r.cat,rutina:id,desde:r.desde||TODAY,semanas:r.semanas==null?4:r.semanas,hasta:r.hasta||'',finalizada:!!r.finalizada,horario:ds.map(d=>({d:d.d==null?null:d.d,hora:d.hora||''}))});
      await Store.put('rutinas',id,{nombre:r.nombre||'Rutina',tipo:r.tipo||'gym',semanas:r.semanas||4,sesiones:ds.map(d=>{const c=Object.assign({},d);delete c.d;delete c.hora;return c;})});
    }
  }catch(e){console.warn('migración rutinas',e);}
}

/* ----- biblioteca (vista general, desde el menú lateral) ----- */
/* "últ. mod. 14/10" (con año solo si no es este año) */
function modTxt(r){if(!r||!r.editada)return '';const d=new Date(r.editada);const y=d.getFullYear();
  return 'últ. mod. '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+(y!==new Date().getFullYear()?'/'+String(y).slice(-2):'');}
function rutEstado(r){
  if(r.archivada)return 'arch';if(r.borrador)return 'pend';
  const as=S.asigAll.filter(a=>a.rutina===r.id);
  if(as.some(a=>asigState(a)!=='fin'))return 'vig';
  if(as.length)return 'venc';return 'libre';
}
const EST_LIB={pend:['Pendientes','Las que todavía estás armando'],vig:['Vigentes','Asignadas y en uso (o por empezar)'],libre:['Sin asignar','Listas, pero no las usa ninguna categoría'],venc:['Vencidas','Ya se usaron y terminaron'],arch:['Archivadas','Guardadas aparte; no se borran']};
/* renglones de un programa que todavía no tienen ejercicio */
const pendN=r=>rutDays(r).reduce((t,d)=>t+(d.bloques||[]).reduce((u,b)=>u+(b.ejercicios||[]).filter(e=>!e.n&&e.g).length,0),0);
const pendTag=r=>{const n=pendN(r);return n?'<span class="pend-t" title="Renglones del programa que todavía no completaste">faltan '+n+'</span>':'';};
function vLib(){
  let h='<div class="bar" style="margin-top:14px"><input class="inp" id="libSearch" placeholder="Buscar rutina…" value="'+esc(S.libQ||'')+'" style="max-width:300px;flex:1 1 200px"><div class="grow"></div><button class="btn pri" data-act="newRut">+ Nueva rutina</button></div>';
  const allR=S.rutAll;
  if(S.jugAll===undefined){S.jugAll=null;Store.getAll('jugadores').then(o=>{S.jugAll=o||{};if(S.view==='lib')render();}).catch(()=>{S.jugAll={};});}
  const all=allR.filter(r=>!isIndRut(r));const indAll=allR.filter(isIndRut);
  const indCol=vLibInd(indAll);
  h+='<div class="rut-cols"><div class="rut-col"><h2 class="rut-col-t">Rutinas de equipo</h2>';
  if(!all.length)return h+'<div class="empty"><b>Todavía no hay rutinas</b>Creá la primera y después asignala a una o varias categorías.</div>'+'</div>'+indCol+'</div>';
  const q=normTxt(S.libQ||'');
  const list=all.filter(r=>!q||normTxt(r.nombre).includes(q));
  const groups={pend:[],vig:[],libre:[],venc:[],arch:[]};list.forEach(r=>groups[rutEstado(r)].push(r));
  const row=r=>{const ds=rutDays(r);const act=S.asigAll.filter(a=>a.rutina===r.id&&asigState(a)!=='fin');
    const fin=S.asigAll.filter(a=>a.rutina===r.id&&asigState(a)==='fin');const st=rutEstado(r);
    return '<div class="lib-row"><button class="lib-main" data-rut="'+esc(r.id)+'"><span class="chip '+r.tipo+'">'+(r.tipo==='gym'?'Gym':'Cancha')+'</span><b>'+esc(r.nombre)+'</b><span class="tiny">'+(r.semanas||4)+' sem · '+ds.length+(ds.length===1?' día':' días')+'</span>'+pendTag(r)+(r.editada?'<span class="mod-t">'+modTxt(r)+'</span>':'')+'</button>'+
      '<span class="lib-cats">'+(act.length?act.map(a=>'<button class="asig-chip'+(asigState(a)==='prox'?' prox':'')+'" data-asig="'+esc(a.id)+'" title="'+esc(vigText(a))+'">'+esc(catName(a.cat))+'</button>').join(''):(st==='venc'?'<span class="tiny">Usada por '+[...new Set(fin.map(a=>catName(a.cat)))].map(esc).join(', ')+'</span>':''))+'</span>'+
      '<span class="lib-acts">'+(st!=='arch'?'<button class="btn sm" data-asignew="'+esc(r.id)+'">Asignar</button>':'')+'<button class="btn sm ghost" data-rutprint="'+esc(r.id)+'" title="Imprimir">Imprimir</button><button class="btn sm ghost" data-rutdup="'+esc(r.id)+'">Duplicar</button>'+
      (st==='arch'?'<button class="btn sm ghost" data-rutarch="'+esc(r.id)+'" data-v="0">Sacar del archivo</button>':(st!=='vig'?'<button class="btn sm ghost" data-rutarch="'+esc(r.id)+'" data-v="1">Archivar</button>':''))+'</span></div>';};
  const showArch=!!S.libArch||!!q;
  ['pend','vig','libre','venc'].forEach(k=>{const arr=groups[k].sort((a,b)=>(b.editada||0)-(a.editada||0)||(a.nombre||'').localeCompare(b.nombre||'','es'));if(!arr.length)return;
    h+='<div class="lib-grp"><h3>'+EST_LIB[k][0]+' <span class="lib-n2">'+arr.length+'</span><small>'+EST_LIB[k][1]+'</small></h3><div class="lib-list">'+arr.map(row).join('')+'</div></div>';});
  if(groups.arch.length)h+='<div class="lib-grp"><button class="linkish" data-libarch>'+(showArch?'▾':'▸')+' Archivadas ('+groups.arch.length+')</button>'+(showArch?'<div class="lib-list" style="margin-top:8px">'+groups.arch.map(row).join('')+'</div>':'')+'</div>';
  if(!list.length)h+='<p class="muted">No hay rutinas de equipo con ese nombre.</p>';
  return h+'</div>'+indCol+'</div>';
}
/* ¿es una rutina individual? la marcaste así, la armó una lesión, o solo la usan jugadores sueltos */
function isIndRut(r){if(r.dif)return true;if(r.indiv===true)return true;if(r.indiv===false)return false;
  return S.asigDif.some(a=>a.rutina===r.id)&&!S.asigAll.some(a=>a.rutina===r.id);}
function jugNameAny(a){const j=S.jug.find(x=>x.id===a.jugador);if(j)return j.nombre;if(a.jnombre)return a.jnombre;const o=S.jugAll&&S.jugAll[a.jugador];return o?o.nombre:'Jugador';}
function vLibInd(list){
  const q=normTxt(S.libQ||'');list=list.filter(r=>!q||normTxt(r.nombre).includes(q));
  const uses=r=>S.asigDif.filter(a=>a.rutina===r.id);
  const act=list.filter(r=>!r.archivada&&uses(r).some(a=>asigState(a)!=='fin'));

        return '<button type="button" class="rs-day'+(i===cur?' on':'')+'" data-rsday="'+i+'"><span class="rs-h">'+esc(d.nombre||('Día '+(i+1)))+(i===cur?' <i>editando</i>':'')+'</span>'+

    };
    /* ventana libre: se arrastra desde la barra de arriba y se agranda desde la esquina */

/* ---------- DNI: nunca se guarda escrito, solo un código (SHA-256) para emparejar ---------- */
function cleanDni(v){return String(v||'').replace(/\D/g,'');}
function sha256(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const K=[],H=[];let n=2,c=0;
  const isP=x=>{for(let f=2;f*f<=x;f++)if(x%f===0)return false;return true;};
  while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c]=(Math.pow(n,1/3)*4294967296)|0;c++;}n++;}
  const bytes=unescape(encodeURIComponent(ascii));const words=[];const bl=bytes.length*8;
  let m=bytes+'\x80';while(m.length%64-56)m+='\x00';
  for(let i=0;i<m.length;i++)words[i>>2]|=m.charCodeAt(i)<<((3-i)%4)*8;
  words[words.length]=(bl/4294967296)|0;words[words.length]=bl;
  const h=H.slice();
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16);const o=h.slice();
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2];const a=h[0],e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;h.pop();
    }
    for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0;
  }
  return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
function dniHash(v){const d=cleanDni(v);return d?sha256('pizarra-pf|dni|'+d).slice(0,32):'';}

/* ================= historial de pesos por rutina (lo que anotan los atletas) =================
   El atleta guarda sus pesos en su celular (registrosAtletas.log). Vos podés corregirlos sin pisar lo de él:
   tus cambios van en el campo pf del mismo registro → e: correcciones, d: borrados, a: agregados, t: pasados a testeos,
   per: rutinas que hizo (quedan aunque después borres o cambies la rutina). */
function atlNorm(d){
  const pf=d.pf||{};const E=pf.e||{},Dl=new Set(pf.d||[]);const L={};
  Object.keys(d.log||{}).forEach(x=>(d.log[x]||[]).forEach(e=>{if(!e||Dl.has(e.id))return;const ed=E[e.id];
    const n=Object.assign({},e,ed||{},{_d:d.id,_x:x});if(ed)n.ed=1;const xx=(ed&&ed.x)||x;(L[xx]=L[xx]||[]).push(n);}));
  (pf.a||[]).forEach(e=>{if(!e||Dl.has(e.id))return;(L[e.x]=L[e.x]||[]).push(Object.assign({},e,{_d:d.id,_x:e.x,pfAdd:1}));});
  return Object.assign({},d,{logRaw:d.log,log:L});
}
const asigEnd=a=>a.hasta||(a.semanas?addDays(a.desde,a.semanas*7-1):'9999-12-31');
const perKind=a=>a.ind?'ind':a.dif?'dif':'eq';
const PER_T={ind:'Rutina individual',dif:'Trabajo diferenciado',eq:'Rutina de la categoría',sin:'Sin rutina'};
function perOf(a){const r=rutById(a.rutina);return {k:a.id+'|'+a.rutina,a:a.id,rid:a.rutina,rn:(r&&r.nombre)||'',desde:a.desde,hasta:asigEnd(a),kind:perKind(a),tipo:r&&r.tipo};}
/* rutinas que tuvo un jugador (las que siguen cargadas + las guardadas en su registro + las que dicen sus pesos) */
function atlPeriods(docs,j){
  const P={};const add=p=>{if(!p||!p.k)return;const o=P[p.k];if(!o){P[p.k]=Object.assign({},p);return;}
    if(!o.rn&&p.rn)o.rn=p.rn;if(p.desde&&(!o.desde||p.desde<o.desde))o.desde=p.desde;if(p.hasta&&(!o.hasta||p.hasta>o.hasta))o.hasta=p.hasta;};
  const cats=new Set(docs.map(d=>d.cat).concat([S.cat]).filter(Boolean));
  S.asigAll.filter(a=>cats.has(a.cat)&&rutById(a.rutina)&&(rutById(a.rutina).tipo||'gym')==='gym').forEach(a=>add(Object.assign(perOf(a),{live:1})));
  S.asigDif.filter(a=>(j&&a.jugador===j.id)||docs.some(d=>(a.uids||[]).includes(d.id))).forEach(a=>add(Object.assign(perOf(a),{live:1})));
  docs.forEach(d=>((d.pf||{}).per||[]).forEach(add));
  return P;
}
function atlGroup(docs,j){
  const P=atlPeriods(docs,j);const out={};const sin={k:'sin',rn:'',kind:'sin',ents:[]};
  const rank={ind:0,dif:1,eq:2};
  docs.forEach(d=>Object.keys(d.log||{}).forEach(x=>(d.log[x]||[]).forEach(e=>{
    let p=null;
    if(e.rid&&e.a){const k=e.a+'|'+e.rid;p=P[k];if(!p){p=P[k]={k,a:e.a,rid:e.rid,rn:e.rn||'',kind:e.kind||'eq',desde:e.f,hasta:e.f};}
      if(e.f<p.desde)p.desde=e.f;if(e.f>p.hasta&&!p.live)p.hasta=e.f;}
    else{const c=Object.values(P).filter(q=>q.desde&&e.f>=q.desde&&e.f<=(q.hasta||'9999')).sort((a,b)=>rank[a.kind]-rank[b.kind]||(b.desde||'').localeCompare(a.desde||''));p=c[0]||null;}
    const g=p||sin;(out[g.k]=out[g.k]||Object.assign(g,{ents:g.ents||[]})).ents.push(Object.assign({x},e));})));
  /* la rutina vigente aparece aunque todavía no haya anotado nada */
  Object.values(P).forEach(p=>{if(p.live&&p.desde<=TODAY&&p.hasta>=TODAY&&!out[p.k])out[p.k]=Object.assign(p,{ents:[]});});
  return Object.values(out).sort((a,b)=>(a.k==='sin')-(b.k==='sin')||(b.desde||'').localeCompare(a.desde||''));
}
/* guarda en el registro del atleta las rutinas que hizo, así no se pierden si la rutina se borra o se cambia */
async function atlSnapAsig(a){
  if(RO||!a||!a.desde)return;const p=perOf(a);if(!p.rn)return;delete p.live;
  let docs;try{const all=await Store.getAll('registrosAtletas');docs=Object.keys(all).filter(id=>!all[id].baja).map(id=>Object.assign({id},all[id]));}catch(e){return;}
  docs.forEach(d0=>{const d=atlNorm(d0);
    const mine=a.ind||a.dif?((a.uids||[]).includes(d.id)):d.cat===a.cat;if(!mine)return;
    const has=Object.values(d.log).some(l=>l.some(e=>e.f>=p.desde&&e.f<=p.hasta&&(!e.rid||e.rid===p.rid)));if(!has)return;
    const pf=JSON.parse(JSON.stringify(d0.pf||{}));pf.per=pf.per||[];if(pf.per.some(x=>x.k===p.k))return;
    pf.per.push(p);Store.patch('registrosAtletas',d.id,{pf});});

function loadPdfjs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfjsP)return pdfjsP;
  pdfjsP=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok(window.pdfjsLib);}catch(e){pdfjsP=null;ko(e);}};
    s.onerror=()=>{pdfjsP=null;ko(new Error('net'));};document.head.appendChild(s);});
  return pdfjsP;}
async function pdfLines(file){
  const lib=await loadPdfjs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();const rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(q=>Math.abs(q.y-y)<3);if(!r){r={y,its:[]};rows.push(r);}r.its.push({x,s:it.str});});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.its.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()));}

}

  ['pTri',/^triceps \(mm\)/],['pSub',/^subescapular \(mm\)/],['pSupra',/^supraespinal \(mm\)/],['pAbd',/^abdominal \(mm\)/],
  ['pMus',/^muslo( frontal| anterior)? \(mm\)/],['pPan',/^(pierna|pantorrilla)( medial)? \(mm\)/],
  ['cCab',/^cabeza \(cm\)/],['cBra',/^brazo relajado/],['cAnt',/^antebrazo/],['cTor',/^torax( mesoesternal)? \(cm\)/],['cCin',/^cintura/],

  ['dBiac',/^biacromial/],['dBiil',/^biiliocrest/],['dTorT',/^transverso del torax/],['dTorAP',/^antero-?posterior del torax/],['dHum',/^humero/],['dFem',/^femur/],
  ['adip',/^(tejido|masa) adipos[oa].*?\(kg\)/],['musc',/^(tejido|masa) muscular.*?\(kg\)/],['osea',/^(tejido|masa) ose[oa].*?\(kg\)/],
  ['piel',/^(tejido|masa) (de la )?piel.*?\(kg\)/],['resid',/^(tejido|masa) residual.*?\(kg\)/],
  ['sum6',/^sumatori[oa] de 6 pliegues/],['sum8',/^sumatori[oa] de 8 pliegues/],['mgY',/^masa grasa \(kg\)/],['iam',/^indice adiposo muscular/],['imo',/^indice musculo oseo/]];

const AN_ISAK=[
  ['Básicas',[['peso','Peso (kg)'],['talla','Talla (cm)'],['tallaS','Talla sentado (cm)']]],
  ['Pliegues (mm)',[['pTri','Tríceps'],['pSub','Subescapular'],['pSupra','Supraespinal'],['pAbd','Abdominal'],['pMus','Muslo frontal'],['pPan','Pantorrilla medial']]],

function kerr(m,sexo,edad){

  const sum6=+m.pTri+(+m.pSub)+(+m.pSupra)+(+m.pAbd)+(+m.pMus)+(+m.pPan);
  const adip=(((sum6*k-116.41)/34.79)*5.85+25.6)/k3;
  const cor=(c,p)=>+c-pi*(+p)/10;

  const musc=(((sMus*k-207.21)/13.74)*5.4+24.5)/k3;
  const oCab=((+m.cCab-56.0)/1.44)*0.18+1.20;

const pct=(v,p)=>v!=null&&p?v/p*100:null;

  if(!T.length)return '<div class="fi-line"><span class="fi-lt">Antropometría</span><span class="tiny">sin tomas</span><span class="grow"></span>'+(RO?'':'<button class="linkish" data-anpdf>📄 PDF del nutri</button><button class="linkish" data-annew>+ Cargar</button>')+'</div>';
  const R=T.map(t=>({t,r:anRes(t,j)}));const last=R[R.length-1],prev=R[R.length-2],first=R[0];
  const L=last.r,P=prev&&prev.r;
  const dl=(k,good)=>{if(!P||P[k]==null||L[k]==null)return '';const d=L[k]-P[k];if(Math.abs(d)<0.05)return '<span class="dl">=</span>';
    return '<span class="dl '+(d*good>0?'g':'b')+'">'+(d>0?'▲ +':'▼ −')+n1(Math.abs(d))+'</span>';};
  let h='<div class="fi-line"><span class="fi-lt">Antropometría</span><span class="tiny">'+esc(fmtD(last.t.f,{day:'numeric',month:'short'}))+'</span>'+
    (L.musc!=null?'<span class="fi-m">Muscular <b>'+n1(L.musc)+' kg</b>'+dl('musc',1)+'</span>':'')+
    (L.adip!=null?'<span class="fi-m">Grasa <b>'+n1(L.adip)+' kg</b>'+dl('adip',-1)+'</span>':'')+
    (L.miss?'<span class="tiny">faltan medidas</span>':'')+
    '<span class="grow"></span><button class="linkish" data-fmore="an">+ información</button></div>';
  h+='<div class="fi-more" data-more="an" hidden><div class="fi-sh"><span class="grow"></span>'+(RO?'':'<button class="btn sm" data-anpdf>📄 Cargar PDF del nutri</button><button class="btn sm pri" data-annew>+ Nueva antropometría</button>')+'</div><div class="fi-kpis">'+[['Masa muscular',L.musc,'musc'],['Masa adiposa',L.adip,'adip'],['Masa ósea',L.osea,'osea'],['Σ 6 pliegues',L.sum6,'sum6']].map(([n,v,k])=>v==null?'':'<div class="fi-k"><small>'+n+'</small><b>'+n1(v)+(k==='sum6'?' mm':' kg')+'</b>'+(k!=='sum6'&&L.peso?'<span class="tiny">'+n1(pct(v,L.peso))+'% del peso</span>':'')+'</div>').join('')+'</div>';
  h+='<p class="tiny" style="margin:2px 0 0">Última toma: '+esc(fmtD(last.t.f,{day:'numeric',month:'short',year:'numeric'}))+' · '+(last.t.src==='pdf'?'PDF del nutri'+(last.t.ev?' ('+esc(last.t.ev)+')':''):last.t.modo==='inf'?'resultado de informe':'medidas ISAK (Kerr)')+(L.dif!=null?' · diferencia con el peso real '+(L.dif>0?'+':'')+n1(L.dif)+'%':'')+'</p>';
  if(prev){const c=anCompare(prev.r,L);if(c.length)h+='<div class="fi-cmp"><b>Desde la toma anterior ('+esc(fmtD(prev.t.f,{day:'numeric',month:'short'}))+')</b><ul>'+c.join('')+'</ul></div>';}
  if(R.length>2){const c=anCompare(first.r,L);if(c.length)h+='<div class="fi-cmp"><b>Desde la primera ('+esc(fmtD(first.t.f,{day:'numeric',month:'short',year:'numeric'}))+')</b><ul>'+c.join('')+'</ul></div>';}
  h+='<div class="fi-tomas">'+R.slice().reverse().map(x=>'<button type="button" class="fi-toma" data-anedit="'+esc(x.t.id)+'"><b>'+esc(fmtD(x.t.f,{day:'numeric',month:'short',year:'2-digit'}))+'</b><span class="tiny">'+(x.r.miss?'faltan medidas':'MM '+n1(x.r.musc)+' · MA '+n1(x.r.adip))+'</span></button>').join('')+'</div>';
  return h+'</div>';
}

    (pdfMsg?'<div class="rut-note an-pdfmsg">'+pdfMsg+'</div>':'')+

    '<label class="an-ver"><input type="checkbox" id="an_ver"'+(ver?' checked':'')+'> Que la vea el jugador en su app <span class="tiny">(masa muscular, adiposa y pliegues)</span></label>'+
    '<div class="stype" id="an_modo"><button type="button" class="'+(modo==='isak'?'on':'')+'" data-anmodo="isak">Medidas ISAK (calcula la app)</button><button type="button" class="'+(modo==='inf'?'on':'')+'" data-anmodo="inf">Resultado de un informe</button></div>'+
    (modo==='isak'?AN_ISAK.map(g=>'<h3>'+g[0]+'</h3><div class="form-grid">'+g[1].map(x=>inp(x[0],x[1])).join('')+'</div>').join('')+'<div class="rut-note"><span id="an_res"></span></div>'
      :'<p class="tiny">Cargá lo que tenga el informe; lo que no tenga, dejalo vacío.</p><div class="form-grid">'+AN_INF.map(x=>inp(x[0],x[1])).join('')+'</div>');

    const body=mw.querySelector('#an_b');
    const keep=()=>{body.querySelectorAll('[data-an]').forEach(i=>{m[i.dataset.an]=i.value;});const v=body.querySelector('#an_ver');if(v)ver=v.checked;};
    const res=()=>{const o=body.querySelector('#an_res');if(!o)return;keep();const r=kerr(m,j.sexo||fiSexo(j)||catRama(S.cats.find(c=>c.id===j.cat)),edadDe(j.nac||j.nacimiento));
      o.innerHTML=r.miss?'Faltan '+r.miss.length+' medidas para calcular las 5 masas.':'Muscular <b>'+n1(r.musc)+' kg</b> · Adiposa <b>'+n1(r.adip)+' kg</b> · Ósea <b>'+n1(r.osea)+' kg</b> · Residual '+n1(r.resid)+' · Piel '+n1(r.piel)+' · Suma '+n1(r.total)+' kg (<b>'+(r.dif>0?'+':'')+n1(r.dif)+'%</b> vs. peso real)';};
    body.addEventListener('input',res);res();

    body.addEventListener('change',async e=>{if(e.target.id!=='an_pdf')return;const file=e.target.files[0];if(!file)return;
      keep();const fe0=body.querySelector('#an_f');if(fe0)f=fe0.value||f;
      pdfMsg='Leyendo el PDF…';body.innerHTML=draw();
      let o;try{o=parseAntro(await pdfLines(file));}catch(err){pdfMsg='';body.innerHTML=draw();res();toast(err&&err.message==='net'?'Sin conexión: no pude abrir el lector de PDF':'No pude abrir ese PDF');return;}
      const keys=Object.keys(o).filter(k=>typeof o[k]==='number');

      keys.forEach(k=>{m[k]=o[k];});if(o.fecha)f=o.fecha;
      modo=(o.adip!=null&&o.musc!=null)?'inf':'isak';
      src={src:'pdf',arch:file.name,ev:o.evaluador||''};

      const otro=o.nombre&&!pn.some(w=>jn.includes(w));
      pdfMsg='✓ Leí el PDF'+(o.evaluador?' de <b>'+esc(o.evaluador)+'</b>':'')+(o.fecha?' del <b>'+esc(fmtD(o.fecha,{day:'numeric',month:'short',year:'numeric'}))+'</b>':'')+

    const dl=mw.querySelector('#an_del');if(dl)armDelete(dl,()=>{const arr=(j.antro||[]).filter(x=>x.id!==tid);const d=Object.assign({},j,{antro:arr});delete d.id;Store.put('jugadores',jid,d);j.antro=arr;toast('Toma borrada');anSync(j);openFicha(jid);});
  });
}
/* copia de las tomas (solo lo importante) al registro del jugador en la app de atletas: ahí no se lee 'jugadores' */
function anSync(j){if(RO||!j)return;
  const an=(j.antro||[]).filter(t=>t.ver!==false).map(t=>{const r=anRes(t,j);if(r.miss)return null;const o={f:t.f};if(t.ev)o.ev=t.ev;['peso','musc','adip','osea','sum6'].forEach(k=>{if(r[k]!=null&&!isNaN(r[k]))o[k]=Math.round(r[k]*100)/100;});return o;}).filter(Boolean).sort((a,b)=>a.f.localeCompare(b.f));
  jugDocs(j.id).forEach(d=>{if(JSON.stringify((d.pf||{}).an||[])===JSON.stringify(an))return;atlPfSave(d.id,pf=>{pf.an=an;});});}

/* ---------- rutinas que hizo: de la más nueva a la más vieja ---------- */
function fichaPers(jid){const j=S.jug.find(x=>x.id===jid);const docs=jugDocs(jid);
  const P=atlPeriods(docs,j);const G={};atlGroup(docs,j).forEach(g=>{G[g.k]=g;});
  const all=Object.values(P).map(p=>Object.assign({},p,{ents:(G[p.k]||{}).ents||[]}));
  Object.values(G).forEach(g=>{if(!P[g.k])all.push(g);});
  return all.filter(p=>p.k==='sin'?p.ents.length:p.desde<=TODAY).sort((a,b)=>(a.k==='sin')-(b.k==='sin')||(b.desde||'').localeCompare(a.desde||''));}

  openModal(modalHead('Registrado · '+catName(S.cat),m.j?m.j.nombre:(d0.nombre||'Atleta'))+'<div class="modal-b">'+b+'</div><div class="modal-f"><button class="btn" id="arHist">Historial por rutina</button>'+(m.j?'':'<button class="btn" id="arAll">Vincular</button>')+'<div class="grow"></div><button class="btn pri" data-close>Cerrar</button></div>',mw=>{

/* ---------- ideales de testeo ---------- */
const catRama=c=>{c=c||S.cats.find(x=>x.id===S.cat)||{};return c.rama||(/fem/i.test(c.nombre||'')?'f':'m');};
function idealOf(k){
  const d=S.ideales.find(x=>x.id===k);if(!d)return null;
  const r=catRama();const v=r==='f'?(d.f??d.m):(d.m??d.f);
  if(v==null||v==='')return null;
  return {tipo:d.tipo||'abs',v:Number(v),doc:d};
}
function idealLabel(id,ex){
  if(!id)return '';
  return id.tipo==='rel'?fmtN(id.v)+'× peso corporal':(ex.low?'≤ ':'')+fmtN(id.v)+' '+(ex.u||'');
}
/* valor + peso corporal → cuán cerca del ideal */
function evalIdeal(val,bw,ex,id){
  if(val==null||!id)return null;
  if(id.tipo==='rel'){
    if(!bw)return {nobw:true};
    const target=id.v*bw;return {target,pct:val/target,falta:Math.max(0,target-val),rel:val/bw};
  }
  if(ex.low)return {target:id.v,pct:val>0?id.v/val:0,falta:Math.max(0,val-id.v)};
  return {target:id.v,pct:val/id.v,falta:Math.max(0,id.v-val)};
}
const pctCls=p=>p>=1?'good':p>=.8?'warn':'bad';
function bwOf(jid,t){const s=t&&t.pc&&t.pc[jid];if(s)return Number(s);const j=S.jug.find(x=>x.id===jid);return j&&j.peso?Number(j.peso):null;}

const tesSeg=()=>'<div class="seg cal-seg tes-seg"><button class="'+(S.tesMode!=='atl'?'on':'')+'" data-tesmode="tes">Testeos</button><button class="'+(S.tesMode==='atl'?'on':'')+'" data-tesmode="atl">Registros de atletas'+(S.atl.length?' · '+S.atl.length:'')+'</button></div>';

  if(!tests.length) return h+'<div class="empty" style="margin-top:14px"><b>Sin registros de '+esc(ex.n)+'</b>Cargá la primera toma y acá vas a ver la evolución de cada jugador'+(id?' y qué tan cerca está del ideal':'')+'.</div>';
  const cols=tests.slice(-6);

  const cell=(t,jid)=>{
    const v=(t.valores||{})[jid];if(v===''||v==null)return null;
    const r=t.reps&&t.reps[jid],c=t.carga&&t.carga[jid];
    const bw=bwOf(jid,t);

  };

  const rmTxt=x=>(x.r>1?'≈':'')+fmtN(x.v)+(kg?' kg':' '+ex.u);

  /* ---- 1) última toma: nombre · peso corp. · fecha · levantó · 1RM · fuerza relativa · falta ---- */
  const xrm=x=>x.c!=null?' <span class="xrm">'+(x.r||1)+'RM</span>':'';
  const relCol=kg||rel;
  h+='<h3 style="margin-top:14px">Última toma de cada '+(catRama()==='f'?'jugadora':'jugador')+'</h3>';
  h+='<div class="tbl-wrap"><table class="t-main"><thead><tr><th>Jugador</th><th class="r">Peso corp.</th><th>Fecha</th>'+
    (kg?'<th class="r">Levantó</th><th class="r">1RM</th>':'<th class="r">Marca</th>')+
    (relCol?'<th class="r">Fuerza relativa</th>':'')+
    (id?'<th class="r">Falta para el ideal</th>':'')+'</tr></thead><tbody>';
  const nCols=3+(kg?2:1)+(relCol?1:0)+(id?1:0);
  rows.forEach(({j,last,ev})=>{
    const bw=last?last.bw:bwOf(j.id,null);
    const bwTd='<td class="r mono c-bw" data-l="Peso corp.">'+(bw?fmtN(bw)+' kg':'<button class="linkish tiny" data-editj="'+esc(j.id)+'">cargar</button>')+'</td>';

    '<th class="r">Cambio'+(kg?' 1RM':'')+'</th><th class="r">Mejor'+(kg?' 1RM':'')+'</th><th>Evolución</th></tr></thead><tbody>';
  rows.forEach(({j,hist,vals,last,prev})=>{
    let d='';if(last&&prev&&prev.v!==0){const pc=(last.v-prev.v)*100/prev.v;const good=ex.low?pc<0:pc>0;d='<span class="'+(pc===0?'muted':good?'delta-up':'delta-down')+'">'+(pc>0?'+':'')+pc.toFixed(1)+'%</span>';}

      return '<td class="r mono h-cell"><div class="h-lift">'+lift(x)+'</div><div class="h-rm">1RM '+rmTxt(x)+(x.ratio!=null?' · '+x.ratio.toFixed(2)+'×':'')+'</div></td>';}).join('')+
      '<td class="r mono">'+(d||'<span class="tiny">–</span>')+'</td><td class="r mono">'+(best==null?'–':fmtN(best))+'</td><td>'+spark(nums,ex.low)+'</td></tr>';

function parseMin(v){v=String(v??'').trim();if(!v)return null;const m=v.match(/^(\d{1,3}):(\d{1,2})$/);if(m)return +m[1]+(+m[2])/60;const n=Number(v.replace(',','.'));return isNaN(n)?null:n;}
