<style>
:root{
  --bg:#F1F3F1; --surface:#FFFFFF; --surface-2:#E7EBE8; --ink:#0D110E; --ink-2:#4A544D; --ink-3:#7A847D; --line:#D3D9D4;
  --accent:#00963E; --accent-soft:#DCF1E3; --accent-ink:#FFFFFF;
  --match:#0D110E; --match-ink:#FFFFFF; --match-soft:#E4E6E4;
  --gym:#2F55C9; --gym-soft:#E1E7FA; --cancha:#C46A12; --cancha-soft:#F8E9D6;
  --good:#1D8A47; --warn:#B87A06; --bad:#C0352B; --good-soft:#DCF1E3; --warn-soft:#F8EBCB; --bad-soft:#F7DDDA;
  --top:#0B0D0C; --top-ink:#ECEFEC; --top-ink-2:#8E9891;
  --shadow:0 10px 30px rgba(13,17,14,.16);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0A0C0B; --surface:#141816; --surface-2:#1C211E; --ink:#ECEFEC; --ink-2:#A6B0A9; --ink-3:#727C75; --line:#28302B;
    --accent:#1FB65C; --accent-soft:#11301D; --accent-ink:#04140A;
    --match:#ECEFEC; --match-ink:#0A0C0B; --match-soft:#232825;
    --gym:#7E98F2; --gym-soft:#1C2444; --cancha:#E39A4C; --cancha-soft:#352512;
    --good:#3CC775; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#11301D; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --top:#050605; --shadow:0 10px 30px rgba(0,0,0,.5);}
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#0A0C0B; --surface:#141816; --surface-2:#1C211E; --ink:#ECEFEC; --ink-2:#A6B0A9; --ink-3:#727C75; --line:#28302B;
    --accent:#1FB65C; --accent-soft:#11301D; --accent-ink:#04140A;
    --match:#ECEFEC; --match-ink:#0A0C0B; --match-soft:#232825;
    --gym:#7E98F2; --gym-soft:#1C2444; --cancha:#E39A4C; --cancha-soft:#352512;
    --good:#3CC775; --warn:#E0A62E; --bad:#EE6E62; --good-soft:#11301D; --warn-soft:#3A2D10; --bad-soft:#3B1A17;
    --top:#050605; --shadow:0 10px 30px rgba(0,0,0,.5);}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .crest{width:30px;height:auto;flex:0 0 30px}
.top .ttl{flex:1;min-width:0}
.theme-b{background:none;border:1px solid #2A322D;color:var(--top-ink);border-radius:8px;width:38px;height:38px;font-size:17px;line-height:1;flex:0 0 38px}
.top .back{background:none;border:1px solid #2A322D;color:var(--top-ink);border-radius:8px;width:38px;height:38px;font-size:20px;line-height:1;flex:0 0 38px}
.top .ttl{flex:1;min-width:0}
.top .eye{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--top-ink-2)}
.top h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 b{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--ink-2)}.tiny{font-size:12.5px;color:var(--ink-3)}.mono{font-family:var(--f-mono)}
h2{font-family:var(--f-disp);font-weight:800;font-size:26px;text-transform:uppercase;margin:0;letter-spacing:.02em;line-height:1.05}
h3{font-family:var(--f-disp);font-weight:700;font-size:18px;text-transform:uppercase;margin:0;letter-spacing:.04em}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip.gym{background:var(--gym-soft);color:var(--gym)}.chip.cancha{background:var(--cancha-soft);color:var(--cancha)}
.grp-t{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:18px 2px 8px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat-b{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:16px 14px;text-align:left;font-family:var(--f-disp);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;min-height:72px}
.cat-b:hover{border-color:var(--ink-3)}
.cat-b small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-top:4px}
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-family:var(--f-disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.tabs button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.rut-h{display:grid;gap:6px;margin-bottom:12px}
.rut-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.rut-meta b{color:var(--ink)}
.wk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-b{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;color:var(--ink-2)}
.wk-b.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.wk-b.now{position:relative}
.wk-b.now::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:12px 0}
.day-b{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;line-height:1.15}
.day-b b{display:block;font-family:var(--f-disp);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.day-b small{font-size:12px;color:var(--ink-3)}
.day-b.on{border-color:var(--accent);background:var(--accent-soft)}
.day-b .hoy{display:inline-block;background:var(--good);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:4px;vertical-align:2px;text-transform:uppercase}
.sec{display:grid;gap:4px;margin:10px 0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.txt{white-space:pre-wrap}
.blk{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:10px}
.blk-h{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2)}

.ex-a{grid-area:a;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

"use strict";
const $=s=>document.querySelector(s);
/* --- copiado de Pizarra PF (misma lógica de rutinas y progresiones) --- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const TODAY=iso(new Date());
const fmtD=(s,o)=>s?pISO(s).toLocaleDateString('es-AR',o||{weekday:'short',day:'numeric',month:'short'}):'';
const daysBetween=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmtN=v=>{const n=Number(v);return isNaN(n)?String(v):n.toLocaleString('es-AR',{maximumFractionDigits:2});};
const WD=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const WDL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const wdOf=f=>(pISO(f).getDay()+6)%7;
const addDays=(f,n)=>{const d=pISO(f);d.setDate(d.getDate()+n);return iso(d);};
const rutActive=(r,f)=>r.desde&&f>=r.desde&&(!r.hasta||f<=r.hasta);
const weekIdx=(r,f)=>Math.max(0,Math.floor(daysBetween(r.desde,f)/7));
const RX_PRES=/(\d{1,2})\s*[x×X*]\s*(\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?(?:\s*[-\/,]\s*\d+(?:[.,]\d+)?(?![\d.,]*\s*(?:kg|%|lb))\s*(?:''|"|″|′|'|s|seg|m|min)?)*)/;
const RX_SDE=/(\d{1,2})\s*series?\s*(?:de|x)\s*(\d+(?:\s*[-\/,]\s*\d+)*)/i;
const RX_LIST=/(?:^|\s)(\d+(?:\s*[-\/]\s*\d+){1,11})(?=\s|$)/;
function cleanDni(v){return String(v||'').replace(/\D/g,'');}
function sha256(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const K=[],H=[];let n=2,c=0;
  const isP=x=>{for(let f=2;f*f<=x;f++)if(x%f===0)return false;return true;};
  while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c]=(Math.pow(n,1/3)*4294967296)|0;c++;}n++;}
  const bytes=unescape(encodeURIComponent(ascii));const words=[];const bl=bytes.length*8;
  let m=bytes+'\x80';while(m.length%64-56)m+='\x00';
  for(let i=0;i<m.length;i++)words[i>>2]|=m.charCodeAt(i)<<((3-i)%4)*8;
  words[words.length]=(bl/4294967296)|0;words[words.length]=bl;
  const h=H.slice();
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16);const o=h.slice();
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2];const a=h[0],e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;h.pop();
    }
    for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0;
  }
  return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
function dniHash(v){const d=cleanDni(v);return d?sha256('pizarra-pf|dni|'+d).slice(0,32):'';}
function toBloques(s,tipo){
  if(s.bloques&&s.bloques.length)return s.bloques;
  if(s.ejercicios&&s.ejercicios.length)return [{nombre:'Bloque 1',series:'',nota:'',ejercicios:s.ejercicios.map(e=>({n:e.n||'',series:e.s||'',reps:[e.r||''],dist:false,c:e.c||'',link:''}))}];
  return tipo==='gym'?[{nombre:'Bloque 1',series:'',nota:'',ejercicios:[{},{},{}]}]:[];
}
function rutDays(r){
  if(r.sesiones&&r.sesiones.length)return r.sesiones;
  const base={};['objetivo','duracion','rpe','calor','bloques','ejercicios','principal','calma','notas'].forEach(k=>{if(r[k]!=null)base[k]=r[k];});
  if(base.ejercicios&&!base.bloques){base.bloques=toBloques(base,r.tipo);}delete base.ejercicios;
  return (r.dias||[]).slice().sort((a,b)=>a.d-b.d).map((x,i)=>Object.assign(JSON.parse(JSON.stringify(base)),{nombre:'Día '+(i+1),d:x.d,hora:x.hora||''}));
}
function splitReps(str){return str.split(/\s*[-\/,]\s*/).map(x=>x.trim()).filter(Boolean);}
function parseExercise(line){
  const parts=line.split(/\s+\/\s+|\s*\|\s*/);
  if(parts.length>1&&parts.slice(1).every(p=>/^\d{1,2}\s*[x×X*]\s*\d/.test(p.trim())||/^@?\s*\d+(?:[.,]\d+)?\s*(?:%|kg|x\s*pc|reps?)/i.test(p.trim())||/^\d{1,3}(?:\s*[-\/]\s*\d{1,3})*$/.test(p.trim()))){const e=parseExercise(parts[0]);e.prog=['',...parts.slice(1).map(x=>x.trim())];return e;}
  let link='';
  line=line.replace(/(https?:\/\/\S+|(?:www\.)?(?:youtu\.be|youtube\.com|drive\.google\.com)\/\S+)/i,m=>{link=m;return ' ';});
  line=line.replace(/^\s*(?:[-•*·–]+|\d{1,2}[.)]|[a-z]\d{1,2}[.):-]?|[a-z][.)])\s+/i,'').trim();
  let m,series='',reps=[],name=line,rest='',raw='',expl=false;
  if((m=line.match(RX_PRES))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_SDE))){series=m[1];raw=m[2];expl=true;reps=splitReps(m[2]);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(RX_LIST))){reps=splitReps(m[1]);series=String(reps.length);name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  else if((m=line.match(/\s[x×]\s*(\d+)\b/))){reps=[m[1]];name=line.slice(0,m.index);rest=line.slice(m.index+m[0].length);}
  name=name.replace(/[\s:,\-–(]+$/,'').trim();
  const c=rest.replace(/^[\s,;:\-–@)]+/,'').replace(/[\s,;(]+$/,'').trim();
  /* "3x8-8" (por lado) o "3x12/15" (rango): si la cantidad no coincide con las series, se respeta tal cual */
  if(expl&&reps.length>1&&reps.length!==+series)return {n:name,series,reps:[raw.replace(/\s+/g,'').trim()],dist:false,c,link};
  const uniq=[...new Set(reps)];
  const dist=reps.length>1&&uniq.length>1;
  return {n:name,series,reps:dist?reps:[uniq[0]||''],dist,c,link};
}
function applyProg(e,b,txt){
  const o=Object.assign({},e);txt=String(txt).trim();
  const p=parseExercise('X '+txt);
  if(!p.series&&!(p.reps.length>1||p.reps[0]!=='')){
    /* la semana solo cambia reps ("12 reps") o carga ("75%", "80kg", "1.5xPC") */
    /* "6" o "6 reps" = repeticiones; "6 reps 80kg" = reps + carga */
    const m=txt.match(/^(\d{1,3})(?:\s*(?:reps?|repeticiones)\b\s*(.*))?$/i);
    if(m){o.reps=[m[1]];o.dist=false;if(m[2]&&m[2].trim())o.c=m[2].replace(/^[\s,;:\-–@]+/,'').trim();}
    else o.c=txt.replace(/^@\s*/,'');
    return o;
  }
  /* solo reps sin "x" (ej. "8-8", "12/15", "8-6-4"): si la cantidad no coincide con las series, es por lado o rango */
  const lm=txt.match(/^(\d+(?:\s*[-\/,]\s*\d+)+)/);
  if(!/[x×*]/i.test(txt)&&lm){
    const eff=+(e.series||b.series||0),n=lm[1].split(/\s*[-\/,]\s*/).length;
    if(eff&&n!==eff){o.reps=[lm[1].replace(/\s+/g,'')];o.dist=false;const rest=txt.slice(lm[0].length).replace(/^[\s,;:\-–@]+/,'').trim();if(rest)o.c=rest;return o;}
  }
  if(p.series)o.series=p.series;
  const hasR=p.reps.length>1||p.reps[0]!=='';
  if(hasR){o.reps=p.reps;o.dist=p.reps.length>1;if(!p.series&&o.dist)o.series=String(p.reps.length);}
  if(p.c)o.c=p.c;
  return o;
}
function resolveDay(dd,w){
  const c=JSON.parse(JSON.stringify(dd));
  (c.bloques||[]).forEach(b=>{b.ejercicios=(b.ejercicios||[]).map(e=>{
    const pr=e.prog||[];let t='';
    for(let j=Math.min(w,pr.length-1);j>=1;j--){if(pr[j]){t=pr[j];break;}}
    const o=t?applyProg(e,b,t):Object.assign({},e);
    if(t&&w>0)o.progW=1;delete o.prog;return o;
  });});
  return c;
}

function vidUrl(u){u=String(u||'').trim();return (/^https?:\/\//i.test(u)||!/^(videos\/|\.\/|\/)/.test(u))?fixUrl(u):u;}
function vidInfo(u){
  u=String(u||'').trim();let m;
  /* YouTube: en bucle, sin sonido y SIN botones encima (tocar = pausa) */
  const yt=(id,vert)=>({yt:id,src:'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&controls=0&loop=1&playlist='+id+'&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1',thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg',vert:!!vert});
  if((m=u.match(/youtube\.com\/shorts\/([\w-]{6,})/)))return yt(m[1],true);
  if((m=u.match(/youtu\.be\/([\w-]{6,})/)||u.match(/[?&]v=([\w-]{6,})/)||u.match(/youtube\.com\/(?:embed|live)\/([\w-]{6,})/)))return yt(m[1],false);
  /* archivo de video directo (por ej. subido a la app): reproductor propio, sin botones */
  if(/\.(mp4|m4v|mov|webm)(\?|#|$)/i.test(u))return {file:u};
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/open\?id=([\w-]+)/)))return {src:'https://drive.google.com/file/d/'+m[1]+'/preview',thumb:'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w320',vert:true,probe:true};
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return {src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1&muted=1&loop=1&controls=0&playsinline=1'};
  if((m=u.match(/instagram\.com\/(?:p|reel|reels|tv)\/([\w-]+)/)))return {src:'https://www.instagram.com/p/'+m[1]+'/embed',vert:true};
  return null;
}

function vidYT(func,args){const f=document.querySelector('#vmini iframe');if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:args||[]}),'*');}
function vidOpen(u){

    :'<iframe src="'+esc(v.src)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video del ejercicio"></iframe>';
  box.innerHTML='<div class="vmini-bar"><span>Video</span>'+(own?'<button type="button" data-vsnd title="Sonido">🔇</button>':'')+'<button type="button" data-vsize title="Agrandar / achicar">⤢</button><a href="'+esc(vidUrl(u))+'" target="_blank" rel="noopener" title="Abrir en otra pestaña">↗</a><button type="button" data-vclose title="Cerrar" aria-label="Cerrar video">✕</button></div>'+
    '<div class="vmini-media">'+media+(own?'<div class="vmini-tap" data-vtap><span class="vmini-ico">❚❚</span></div>':'')+'</div>';
  box._paused=false;box._muted=true;
  if(v.file){const vd=box.querySelector('video');
    vd.addEventListener('loadedmetadata',()=>{if(vd.videoWidth&&vd.videoHeight)box.classList.toggle('vert',vd.videoHeight>vd.videoWidth);});
    vd.addEventListener('error',()=>{box.querySelector('.vmini-media').innerHTML='<div class="vmini-err">No se pudo cargar el video. Tocá ↗ para abrirlo.</div>';});}
  if(v.yt){const f=box.querySelector('iframe');f.addEventListener('load',()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1}),'*');}catch(e){}});}
  /* videos de Drive: miramos la portada para saber si está filmado vertical u horizontal */
  if(v.probe&&v.thumb){const im=new Image();im.onload=()=>{const b=document.getElementById('vmini');if(b&&im.naturalWidth&&im.naturalHeight)b.classList.toggle('vert',im.naturalHeight>im.naturalWidth);};im.src=v.thumb;}
}
function vidFlash(box,txt){const i=box.querySelector('.vmini-ico');if(!i)return;i.textContent=txt;i.classList.remove('show');void i.offsetWidth;i.classList.add('show');}

/* ---------- RPE (esfuerzo percibido): opcional, si la rutina lo pide ---------- */
/* fecha a la que corresponde un día de la rutina: la última vez que tocó (hoy o hasta 6 días atrás) */
function rpeDate(a,i){const h=(a.horario||[])[i];if(!h||h.d==null)return TODAY;for(let k=0;k<7;k++){const f=addDays(TODAY,-k);if(f<a.desde)break;if(wdOf(f)===h.d)return f;}return TODAY;}
function rpeGet(R,a,i,f){return (R.rpe||[]).find(x=>x.a===a.id&&x.d===i&&x.f===f);}
/* días de entrenamiento de la última semana (sin contar hoy) que quedaron sin responder */
function rpeMissing(a,ds){const R=getReg();if(!R.nombre)return [];const out=[];
  for(let k=1;k<=6;k++){const f=addDays(TODAY,-k);if(f<a.desde||(a.hasta&&f>a.hasta))continue;
    (a.horario||[]).forEach((h,i)=>{if(h&&h.d===wdOf(f)&&i<ds.length&&!rpeGet(R,a,i,f))out.push({f,i});});}
  return out;}
function rpeCard(a,i,dayName){
  const R=getReg();const f=rpeDate(a,i);const cur=rpeGet(R,a,i,f);
  let h='<div class="card rpe-card" id="rpeCard"><b>¿Qué tan duro fue el entrenamiento?</b><div class="tiny">RPE · '+esc(dayName)+' del '+esc(fmtD(f,{weekday:'long',day:'numeric',month:'short'}))+'. Del 1 (muy fácil) al 10 (no podía más). No es obligatorio, pero le sirve mucho a tu preparadora.</div>';
  if(!R.nombre)return h+'<p class="tiny" style="margin:8px 0 0">Para responder, primero completá tus datos en <b>Mis registros</b>.</p><button class="btn sm" data-tab="reg" style="margin-top:6px">Completar mis datos</button></div>';
  h+='<div class="rpe-g">'+Array.from({length:10},(_,k)=>k+1).map(v=>'<button class="rpe-b'+(cur&&cur.v===v?' on':'')+'" data-rpe="'+v+'" data-rpei="'+i+'" data-rpef="'+f+'" style="--h:'+(120-v*12)+'">'+v+'</button>').join('')+'</div>';
  if(cur)h+='<div class="tiny" style="margin-top:6px">Respondiste <b>'+cur.v+'</b>. Si te equivocaste, tocá otro número.</div>';
  return h+'</div>';
}

  const D=k=>L[k]!=null&&P[k]!=null?L[k]-P[k]:null;
  const dm=D('musc'),da=D('adip'),ds=D('sum6'),dp=D('peso');
  if(dm!=null){if(Math.abs(dm)<0.2)li('nu','<b>Tu masa muscular se mantuvo</b> ('+sg(dm)+' kg)');else if(dm>0)li('ok','<b>Subió tu masa muscular:</b> +'+n1(dm)+' kg');else li('bad','<b>Bajó tu masa muscular:</b> −'+n1(-dm)+' kg');}
  if(da!=null){if(Math.abs(da)<0.2)li('nu','<b>Tu masa adiposa se mantuvo</b> ('+sg(da)+' kg)');else if(da<0)li('ok','<b>Bajó tu masa adiposa:</b> −'+n1(-da)+' kg');else li('bad','<b>Subió tu masa adiposa:</b> +'+n1(da)+' kg');}
  if(ds!=null){if(Math.abs(ds)<1)li('nu','<b>Tus pliegues casi no cambiaron</b>');else if(ds<0)li('ok','<b>Bajaron tus pliegues:</b> −'+n1(-ds)+' mm (menos grasa bajo la piel)');else li('bad','<b>Subieron tus pliegues:</b> +'+n1(ds)+' mm');}
  if(dp!=null){const mU=dm!=null&&dm>=0.2,aD=da!=null&&da<=-0.2;
    if(Math.abs(dp)<0.5)li('nu','<b>Tu peso casi no cambió</b> ('+sg(dp)+' kg)'+(mU&&aD?': cambiaste grasa por músculo.':'.'));
    else li('nu','<b>Tu peso '+(dp>0?'subió':'bajó')+'</b> '+n1(Math.abs(dp))+' kg'+(dp<0&&aD&&!(dm!=null&&dm<=-0.2)?': lo que bajó es grasa, no músculo.':dp>0&&mU&&!(da!=null&&da>=0.2)?': lo que subió es músculo.':'.'));}
  let h='<div class="rep"><h4>Tu mini informe</h4><div class="rep-s">Última medición '+fl(L.f)+', comparada con la del '+fl(P.f)+'</div><ul>'+it.join('')+'</ul>';
  if(T.length>=3){const F=T[0];if(F.musc!=null&&L.musc!=null&&F.adip!=null&&L.adip!=null)h+='<div class="rep-v">Desde la primera ('+esc(fmtD(F.f,{month:'long',year:'numeric'}))+'): <b>'+sg(L.musc-F.musc)+' kg de músculo</b> y <b>'+sg(L.adip-F.adip)+' kg de grasa</b>.</div>';}
  return h+'</div>';
}
function anView(){
  const T=anList();
  if(!T.length)return '<div class="empty"><b>Todavía no hay mediciones</b>Cuando tu preparadora cargue tu antropometría, la vas a ver acá con un mini informe.</div>';
  const open=st.anOpen===undefined?T[T.length-1].f:st.anOpen;
  const pc=(v,p)=>v!=null&&p?'<span class="tiny">'+n1(v/p*100)+'% del peso</span>':'';
  let h=anInforme(T)+'<div class="sec-t">Mis mediciones <small>de la más nueva a la más vieja</small></div><div class="an-l">';
  T.slice().reverse().forEach(t=>{const on=open===t.f;
    h+='<button type="button" class="an-b'+(on?' on':'')+'" data-anf="'+esc(t.f)+'"><span class="an-bt"><b>'+esc(fmtD(t.f,{day:'numeric',month:'short',year:'numeric'}))+'</b><span class="tiny">Muscular '+n1(t.musc)+' · Adiposa '+n1(t.adip)+' kg</span></span><span class="an-ar">'+(on?'▾':'›')+'</span></button>';
    if(on)h+='<div class="an-d">'+(t.ev?'<div class="tiny">Nutri: '+esc(t.ev)+'</div>':'')+
      '<div class="an-ts"><div class="an-t"><small>Masa muscular</small><b>'+n1(t.musc)+' <span>kg</span></b>'+pc(t.musc,t.peso)+'</div><div class="an-t"><small>Masa adiposa</small><b>'+n1(t.adip)+' <span>kg</span></b>'+pc(t.adip,t.peso)+'</div></div>'+
      '<div class="an-mini">'+(t.peso!=null?'<span>Peso</span><b>'+n1(t.peso)+' kg</b>':'')+(t.osea!=null?'<span>Masa ósea</span><b>'+n1(t.osea)+' kg</b>':'')+(t.sum6!=null?'<span>Σ 6 pliegues</span><b>'+n1(t.sum6)+' mm</b>':'')+(t.musc&&t.osea?'<span>Músculo por kg de hueso</span><b>'+(t.musc/t.osea).toFixed(2).replace('.',',')+'</b>':'')+'</div></div>';});
  return h+'</div>';
}
/* rutinas que ya terminó (con o sin pesos anotados), de la más nueva a la más vieja */
function pastPeriods(){const R=getReg();const G=myGroups(effLog(R));const P=myPeriods();const have=new Set(G.map(g=>g.k));
  Object.values(P).forEach(p=>{if(!have.has(p.k))G.push(Object.assign({},p,{ents:[]}));});
  return G.filter(g=>g.k==='sin'?g.ents.length:!(g.live&&g.desde<=TODAY&&g.hasta>=TODAY)&&g.desde<=TODAY)
    .sort((a,b)=>(a.k==='sin')-(b.k==='sin')||(b.desde||'').localeCompare(a.desde||''));}
const rng=p=>p.desde?esc(fmtD(p.desde,{day:'numeric',month:'short'}))+(p.hasta&&p.hasta<'9999'?' → '+esc(fmtD(p.hasta,{day:'numeric',month:'short'})):''):'';
function persRut(c){
  const R=getReg();
  if(!R.nombre||!R.ape||!R.dniH||st.editProf)return profileForm(R);
  if(st.hist)return histView(st.hist);
  const exs=[...new Set(BASE_EX.concat(R.ex||[]).concat(Object.keys(R.log||{})))];const sel=st.regEx||exs[0];
  const FI=R.ficha||{};
  let h=(FI.dj?'':'<div class="card fi-ask"><b>Completá tu ficha médica</b><span class="tiny">Son 2 minutos: lesiones, salud y una declaración. La ve solo tu profe.</span><button class="btn sm pri" data-tab="ficha">Completar</button></div>')+'<div class="sec-t">Rutina actual</div>'+rutView(c)+'<div class="sec-t">Anotá tu peso</div>'+regTop(R,exs,sel);
  const G=pastPeriods();
  h+='<div class="sec-t">Mis rutinas anteriores</div>'+(G.length?'<div class="card hl">'+G.map(p=>'<button type="button" class="hl-r" data-hist="'+esc(p.k)+'"><span><b>'+esc(p.k==='sin'?'Otros registros':(p.rn||'Rutina'))+'</b><small>'+(p.k==='sin'?'pesos que no quedaron en ninguna rutina':rng(p))+' · '+p.ents.length+(p.ents.length===1?' peso anotado':' pesos anotados')+'</small></span><span class="hl-go">›</span></button>').join('')+'</div>'
    :'<p class="tiny">Cuando termines tu primera rutina, acá vas a poder ver qué hiciste cada mes y los pesos que anotaste.</p>');
  return h;
}
function histView(k){
  const p=pastPeriods().find(x=>x.k===k);if(!p){st.hist=null;return persRut(catById(st.cat));}
  const r=p.rid&&rutById(p.rid);const days=r?rutDays(r):[];const di=Math.min(st.hday||0,Math.max(0,days.length-1));
  const by={};p.ents.forEach(e=>{const kx=nrm(e.x);(by[kx]=by[kx]||{n:e.x,l:[]}).l.push(e);});
  const find=n=>{const kx=nrm(n);if(by[kx])return kx;return Object.keys(by).find(q=>q&&kx&&(q.startsWith(kx)||kx.startsWith(q)))||null;};
  const used=new Set();days.forEach(d=>(d.bloques||[]).forEach(b=>(b.ejercicios||[]).forEach(e=>{const q=e.n&&find(e.n);if(q)used.add(q);})));
  const row=(name,pres,l)=>{let h='<div class="hx"><span class="hx-n"><b>'+esc(name)+'</b>'+(pres?'<small>pautado '+esc(pres)+'</small>':'')+'</span><span class="hx-v">';
    if(!l||!l.length)return h+'<span class="tiny">sin anotar</span></span></div>';
    const L=l.slice().sort((a,b)=>a.f.localeCompare(b.f)||(a.t||0)-(b.t||0));const sh=L.slice(-5);
    h+='<span class="mono">'+(L.length>5?'… → ':'')+sh.map(e=>fmtN(e.kg)).join(' → ')+' kg</span>';
    const d=L[L.length-1].kg-L[0].kg;const ed=L.some(e=>e.ed||e.pfAdd);
    h+='<small class="'+(d>0?'up':d<0?'dn':'')+'">'+(L.length<2?fmtD(L[0].f,{day:'numeric',month:'short'}):d>0?'▲ +'+fmtN(Math.round(d*10)/10)+' kg':d<0?'▼ −'+fmtN(Math.round(-d*10)/10)+' kg':'igual')+(ed?' · ✎ PF':'')+'</small>';
    return h+'</span></div>';};
  let h='<button type="button" class="lnk-back" data-hist="">‹ Mis rutinas</button><div class="card"><b class="h-t">'+esc(p.k==='sin'?'Otros registros':(p.rn||'Rutina'))+'</b><div class="tiny">'+(p.k==='sin'?'':rng(p)+' · ')+p.ents.length+(p.ents.length===1?' peso anotado':' pesos anotados')+(p.rid&&!r?' · tu profe borró esta rutina':'')+'</div>'+
    (days.length>1?'<div class="hd-b">'+days.map((d,i)=>'<button type="button" class="'+(i===di?'on':'')+'" data-hday="'+i+'">'+esc(d.nombre||('Día '+(i+1)))+'</button>').join('')+'</div>':'')+'</div>';
  let rows='';
  if(days.length){(days[di].bloques||[]).forEach(b=>(b.ejercicios||[]).forEach(e=>{if(!e.n)return;const q=find(e.n);rows+=row(e.n,presText(e,b),q?by[q].l:null);}));}
  const otros=Object.keys(by).filter(q=>!used.has(q));
  if(rows)h+='<div class="card">'+rows+'</div>';
  if(otros.length)h+='<div class="sec-t">'+(days.length?'Otros ejercicios que anotaste':'Lo que anotaste')+'</div><div class="card">'+otros.map(q=>row(by[q].n,'',by[q].l)).join('')+'</div>';
  if(!rows&&!otros.length)h+='<p class="tiny">No anotaste pesos en esta rutina.</p>';
  return h+'<p class="tiny" style="margin:8px 2px">Cada número es un peso que anotaste, del más viejo al más nuevo. Si tu profe corrigió algo, aparece con ✎.</p>';
}
function regTop(R,exs,sel){
  return '<div class="card me"><div class="me-row" style="justify-content:space-between;align-items:center"><span><b>'+esc(R.nombre)+'</b>'+(R.dniFin?' <span class="tiny">· DNI …'+esc(R.dniFin)+'</span>':'')+'</span><button class="btn sm" id="pedit">Editar mis datos</button></div>'+
    '<div class="me-row"><div class="fld" style="flex:1;min-width:140px"><label for="pc">Mi peso corporal (kg)</label><input id="pc" type="number" inputmode="decimal" step="any" value="'+esc(R.pc||'')+'" placeholder="Opcional"></div></div>'+
    '<div class="add-f"><div class="fld"><label for="rx">Ejercicio</label><select id="rx">'+exs.map(x=>'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join('')+'<option value="__otro">Otro…</option></select></div>'+
    '<div class="fld"><label for="rk">Kilos</label><input id="rk" type="number" inputmode="decimal" step="any" placeholder="60"></div>'+
    '<div class="fld"><label for="rr">Reps</label><input id="rr" type="number" inputmode="numeric" placeholder="1" min="1" max="20"></div>'+
    '<button class="btn pri" id="radd">Anotar</button></div><div class="fld" id="rxoBox" hidden><label for="rxo">Nombre del ejercicio</label><input id="rxo" placeholder="Ej: Remo con barra"></div>'+
    '<p class="tiny" style="margin:0">Con más de 1 rep te calculamos tu 1RM estimado (fórmula de Epley). Tu preparadora física ve lo que anotás.</p></div>';
}
function regView(){
  const R=getReg();
  if(!R.nombre||!R.ape||!R.dniH||st.editProf)return profileForm(R);
  const exs=[...new Set(BASE_EX.concat(R.ex||[]).concat(Object.keys(R.log||{})))];
  const sel=st.regEx||exs[0];
  let h=regTop(R,exs,sel);
  const EL=effLog(R);const exs2=[...new Set(exs.concat(Object.keys(EL)))];
  const withData=exs2.filter(x=>(EL[x]||[]).length);
  if(!withData.length)return h+'<div class="empty"><b>Todavía no anotaste nada</b>Anotá el peso que levantaste y acá vas a ver tu progreso.</div>';
  h+='<div class="tabs rh-tabs"><button class="'+(st.regMode!=='rut'?'on':'')+'" data-regmode="ex">Por ejercicio</button><button class="'+(st.regMode==='rut'?'on':'')+'" data-regmode="rut">Por rutina</button></div>';
  if(st.regMode==='rut')return h+rutHist(EL);
  h+='<div class="lifts">'+withData.map(x=>{
    const L=(EL[x]||[]).slice().sort((a,b)=>b.f.localeCompare(a.f));
    const best=Math.max(...L.map(e=>epley(e.kg,e.r)));const last=L[0];const pc=Number(R.pc)||0;
    return '<div class="lift"><div class="lift-h"><b>'+esc(x)+'</b><span class="tiny">'+L.length+(L.length===1?' registro':' registros')+'</span></div>'+
      '<div class="kpis"><div class="kpi"><small>Último</small><span>'+fmtN(last.kg)+' kg × '+last.r+'</span></div><div class="kpi"><small>Mejor 1RM</small><span class="acc">'+(L.some(e=>e.r>1&&epley(e.kg,e.r)===best)?'≈':'')+fmtN(Math.round(best*10)/10)+' kg</span></div>'+
      (pc?'<div class="kpi"><small>× peso corporal</small><span>'+(best/pc).toFixed(2)+'×</span></div>':'')+'</div>'+
      '<ul class="hist">'+L.map(e=>'<li><span>'+esc(fmtD(e.f,{day:'numeric',month:'short'}))+'</span><span class="mono">'+fmtN(e.kg)+' kg × '+e.r+'</span><span class="tiny">1RM '+(e.r>1?'≈':'')+fmtN(Math.round(epley(e.kg,e.r)*10)/10)+'</span>'+(e.ed||e.pfAdd?'<i class="pf-ed" title="Lo corrigió o lo cargó tu preparadora">✎ PF</i>':'')+(e.pfAdd?'':'<button class="x" data-del="'+esc(e._x||x)+'|'+e.id+'" aria-label="Borrar">×</button>')+'</li>').join('')+'</ul></div>';
  }).join('')+'</div>';
  return h;
}
function saveProfile(){
  const nm=$('#pn').value.trim().replace(/\s+/g,' '),ap=$('#pa').value.trim().replace(/\s+/g,' ');const dRaw=$('#pd').value;const d=cleanDni(dRaw);
  if(!nm){toast('Poné tu nombre');$('#pn').focus();return;}
  if(!ap){toast('Poné tu apellido');$('#pa').focus();return;}
  const n=nm+' '+ap;
  const R=getReg();
  if(d){if(d.length<7||d.length>9){toast('El DNI tiene que tener 7 u 8 números');return;}R.dniH=dniHash(d);R.dniFin=d.slice(-3);}
  else if(!R.dniH){toast('Poné tu DNI (solo números)');return;}
  const nac=$('#pnac')?$('#pnac').value:'',pc2=$('#ppc')?$('#ppc').value:'',tal=$('#ptal')?$('#ptal').value:'';
  if(nac)R.nac=nac;if(pc2)R.pc=pc2;if(tal)R.talla=tal;
  R.nombre=n;R.nom=nm;R.ape=ap;R.cat=st.cat;st.editProf=false;st.datosLink=false;setReg(R);render();toast('Listo, '+n.split(' ')[0]+'. Ya podés anotar tus pesos');
}
function addReg(){
  let x=$('#rx').value;
  if(x==='__otro'){x=($('#rxo').value||'').trim();if(!x){toast('Escribí el nombre del ejercicio');$('#rxo').focus();return;}}
  const kg=Number(String($('#rk').value).replace(',','.')),r=Math.max(1,parseInt($('#rr').value)||1);
  if(!(kg>0)){toast('Poné los kilos');return;}
  const R=getReg();const tg=curTag();(R.log[x]=R.log[x]||[]).push(Object.assign({id:uid(),f:TODAY,kg,r},tg||{}));if(!BASE_EX.includes(x)&&!R.ex.includes(x))R.ex.push(x);
  R.cat=st.cat;setReg(R);st.regEx=x;render();toast('Anotado: '+x+' '+fmtN(kg)+' kg × '+r);
}

/* ---------- eventos ---------- */
$('#app').addEventListener('click',e=>{
  const rb=e.target.closest('[data-rpe]');if(rb){const R=getReg();if(!R.nombre)return;R.rpe=(R.rpe||[]).filter(x=>!(x.a===st.asig&&x.d===+rb.dataset.rpei&&x.f===rb.dataset.rpef));
    R.rpe.push({a:st.asig,d:+rb.dataset.rpei,f:rb.dataset.rpef,v:+rb.dataset.rpe,t:Date.now()});setReg(R);render();toast('Gracias. Guardamos tu RPE: '+rb.dataset.rpe);return;}
  const fx=e.target.closest('[data-lesnew],[data-lesdel],[data-q],[data-mol],#lesAdd,#fiSave');
  if(fx){const d=fx.dataset;
    if(d.mol!==undefined)return openMol(d.mol);
    fichaKeep();
    if(d.lesnew!==undefined){st.lesNew=d.lesnew==='1';return render();}
    if(d.lesdel!==undefined){FD.les.splice(+d.lesdel,1);return render();}
    if(d.q){const a=FD.q[d.q]||{};a.v=d.v;FD.q[d.q]=a;return render();}
    if(fx.id==='lesAdd'){const z=$('#l_z').value,tp=$('#l_t').value;if(!z||!tp){toast('Elegí la zona y qué fue');return;}
      FD.les.push({zona:z,lado:$('#l_l').value,tipo:tp,anio:$('#l_a').value,mol:$('#l_m').value||'No',det:$('#l_d').value.trim()});st.lesNew=false;return render();}
    if(fx.id==='fiSave')return fichaSave();}
  const t=e.target.closest('[data-hist],[data-hday],[data-anf],[data-cat],[data-tab],[data-asig],[data-day],[data-week],[data-vid],[data-regex],[data-del],[data-regmode],#radd,#psave,#pedit');if(!t)return;
  if(t.id==='psave')return saveProfile();
  if(t.dataset.regmode){st.regMode=t.dataset.regmode;return render();}
  if(t.id==='pedit'){st.editProf=true;return render();}
  const d=t.dataset;
  if(d.hist!==undefined){st.hist=d.hist||null;st.hday=0;render();window.scrollTo(0,0);return;}
  if(d.hday!==undefined){st.hday=+d.hday;return render();}
  if(d.anf){st.anOpen=(st.anOpen===undefined?(anList().slice(-1)[0]||{}).f:st.anOpen)===d.anf?'':d.anf;return render();}
  if(d.cat)return go(d.cat);
  if(d.tab){st.tab=d.tab;st.hist=null;return render();}
  if(d.asig){st.asig=d.asig;st.day=null;st.week=null;return render();}
  if(d.day){st.day=+d.day;render();if(d.rpego)setTimeout(()=>{const c=$('#rpeCard');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});},60);return;}
  if(d.week){st.week=+d.week;return render();}
  if(d.vid){const em=ytEmbed(d.vid);if(em){$('#vroot').innerHTML='<div class="vmodal" id="vm"><div class="vbox"><iframe src="'+esc(em)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video del ejercicio"></iframe><button class="btn" id="vclose">Cerrar video</button></div></div>';
      $('#vm').onclick=ev=>{if(ev.target.id==='vm'||ev.target.id==='vclose')$('#vroot').innerHTML='';};}
    else window.open(d.vid,'_blank','noopener');return;}
  if(d.regex){const rx=BASE_EX.find(b=>b.toLowerCase()===d.regex.toLowerCase())||d.regex;st.tab='reg';st.regEx=rx;const R=getReg();if(!BASE_EX.includes(rx)&&!R.ex.includes(rx)){R.ex.push(rx);ls.set('pfat-reg',R);}render();window.scrollTo(0,0);setTimeout(()=>{const k=$('#rk');if(k)k.focus();},50);return;}
  if(d.del){const [x,id]=d.del.split('|');const R=getReg();R.log[x]=(R.log[x]||[]).filter(z=>z.id!==id);setReg(R);return render();}
  if(t.id==='radd')return addReg();
});
$('#app').addEventListener('change',e=>{if(e.target.id==='pc'){const R=getReg();R.pc=e.target.value;setReg(R);render();}
  if(e.target.id==='rx'){const o=e.target.value==='__otro';$('#rxoBox').hidden=!o;if(o)$('#rxo').focus();else st.regEx=e.target.value;}});

/* ---------- arranque ---------- */
if(FB()){firebase.initializeApp(FIREBASE_CONFIG);try{firebase.firestore().enablePersistence({experimentalForceOwningTab:true}).catch(()=>{});}catch(e){}
  /* identificación anónima: cada celular escribe solo sus propios registros */
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){firebase.auth().signInAnonymously().catch(e=>console.warn('anon',e));return;}
    myUid=u.uid;render();
    try{firebase.firestore().collection('registrosAtletas').doc(myUid).onSnapshot(sn=>{const n=(sn.exists&&sn.data().pf)||{};if(JSON.stringify(n)!==JSON.stringify(PF)){PF=n;render();}},()=>{});}catch(e){}
    try{const snap=await firebase.firestore().collection('registrosAtletas').doc(myUid).get();
      const R=getReg();
      if(snap.exists&&!Object.keys(R.log).some(k=>R.log[k].length)&&!R.nombre){const c=snap.data();ls.set('pfat-reg',{nombre:c.nombre,nom:c.nom,ape:c.ape,dniH:c.dniH,dniFin:c.dniFin,pc:c.pc,nac:c.nac,talla:c.talla,log:c.log||{},ex:c.ex||[],upd:c.upd,alta:c.alta,ficha:c.ficha,mol:c.mol});render();}
      else if(R.nombre)pushCloud(R);
    }catch(e){console.warn(e);}
  });
}
const fromHash=decodeURIComponent((location.hash||'').slice(1));
st.cat=LOCK||(fromHash==='todas'?'':fromHash)||(fromHash==='todas'?null:ls.get('pfat-cat',''))||null;
watch('categorias',a=>{D.cats=a;D.ready.c=1;render();});
watch('rutinas',a=>{D.rut=a;D.ready.r=1;render();});
watch('asignaciones',a=>{D.asig=a;D.ready.a=1;render();});
window.addEventListener('hashchange',()=>{if(LOCK)return;const h=decodeURIComponent(location.hash.slice(1));if(h&&h!==st.cat)go(h);});
})();
